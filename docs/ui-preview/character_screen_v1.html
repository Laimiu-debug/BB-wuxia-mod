<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>武侠 Mod · 人物界面三页签 UI 预览</title>
<link rel="stylesheet" href="wx_tokens.css">
<style>
/* ============================================================================
 * 布局层（只用 absolute / float / inline-block，可直接迁入 CoherentUI）
 * 预览以 1rem = 20px 设计后整体 transform 缩放，规避中文 Chrome 最小字号钳制。
 * ============================================================================ */
html { font-size: 20px; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #060403; }
body {
	background: radial-gradient(ellipse at 50% 40%, #2a2016 0%, #120d09 55%, #050302 100%);
}
#stage { position: absolute; left: 0; top: 0; width: 142.1rem; height: 90.6rem; transform-origin: 0 0; }
.cs {
	position: absolute; left: 0; top: 0; width: 142.1rem; height: 90.6rem;
	background: url("../../mod_wuxia/gfx/ui/wx_skin/wx_background_inventory.png") no-repeat 0 0;
	background-size: 142.1rem 90.6rem;
}
.area { position: absolute; }
.grid-on .area, .grid-on .zone { outline: 1px dashed rgba(111,179,154,0.75); }
.grid-on .area:after, .grid-on .zone:after {
	content: attr(data-dim); position: absolute; right: 0; top: 0; z-index: 99; padding: 0 0.3rem;
	font: bold 0.9rem/1.3rem monospace; color: #9fd6c1; background: rgba(0,0,0,0.75); pointer-events: none;
}
.zone { position: absolute; }

/* 滚动条（预览仿 aciScrollBar 细金条） */
.scroll { overflow-y: auto; overflow-x: hidden; }
.scroll::-webkit-scrollbar { width: 0.6rem; }
.scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.35); }
.scroll::-webkit-scrollbar-thumb { background: var(--wx-gold-700); border: 1px solid var(--wx-gold-600); }

/* ---------------- 预览工具条（占用背景图顶部空白，不属于游戏界面） ---------------- */
.pv-bar { position: absolute; left: 21.5rem; right: 17.9rem; top: 3.2rem; height: 6rem; }
.pv-title { float: left; }
.pv-title h1 { margin: 0; font-family: var(--wx-font-title); font-weight: normal; font-size: 2.6rem; line-height: 3.2rem; color: var(--wx-gold-200); letter-spacing: 0.1em; text-shadow: 0 2px 6px #000; }
.pv-title p { margin: 0; font-size: 1.1rem; color: var(--wx-text-dim); }
.pv-tools { float: right; padding-top: 1.4rem; }
.pv-tools .wx-btn { margin-left: 0.4rem; }
.pv-notes {
	position: absolute; right: 1.2rem; top: 10.4rem; width: 30rem; z-index: 800; display: none;
	max-height: 76rem; padding: 1rem 1.2rem; font-size: 1.1rem; line-height: 1.65rem;
	background: rgba(14,10,7,0.97); border: 1px solid var(--wx-gold-500); box-shadow: 0 6px 24px rgba(0,0,0,0.9);
}
.pv-notes h3 { margin: 0.6rem 0 0.3rem 0; font-family: var(--wx-font-title); font-weight: normal; font-size: 1.6rem; color: var(--wx-gold-300); }
.pv-notes ul { margin: 0; padding-left: 1.3rem; }
.pv-notes li { margin-bottom: 0.25rem; }
.pv-notes b { color: var(--wx-text-hi); }

/* ============================================================================
 * 左栏：人物抬头
 * ============================================================================ */
.lh { left: 21.5rem; top: 12.9rem; width: 33.4rem; height: 8.2rem; }
.lh-crest { position: absolute; left: 0.8rem; top: 0.9rem; width: 6.2rem; height: 6.2rem; }
.lh-crest img { width: 100%; height: 100%; }
.lh-name { position: absolute; left: 7.6rem; top: 0.6rem; font-size: 2.3rem; line-height: 3rem; color: var(--wx-gold-200); text-shadow: 0 2px 3px #000; }
.lh-sub { position: absolute; left: 7.6rem; top: 3.5rem; font-size: 1.08rem; color: var(--wx-text-dim); white-space: nowrap; }
.lh-lvl {
	position: absolute; right: 0.9rem; top: 0.8rem; width: 4.8rem; height: 4.8rem; border-radius: 50%; text-align: center;
	background: radial-gradient(circle at 50% 35%, #3b2a18, #140e09); border: 1px solid var(--wx-gold-500);
	box-shadow: inset 0 0 0 3px #140e09, inset 0 0 0 4px var(--wx-gold-700), 0 2px 5px #000;

.lh-lvl span { display: block; font-size: 2.2rem; line-height: 3.3rem; color: var(--wx-gold-200); }
.lh-lvl em { display: block; margin-top: -0.7rem; font-style: normal; font-size: 0.95rem; color: var(--wx-text-dim); }
.lh-xp { position: absolute; left: 7.6rem; right: 6.6rem; top: 5.6rem; }
.lh-xptext { position: absolute; left: 7.6rem; right: 6.6rem; top: 6.25rem; font-size: 0.95rem; color: var(--wx-text-mute); text-align: right; }

/* ============================================================================
 * 左栏：纸娃娃
 * ============================================================================ */
.doll { left: 21.5rem; top: 21.3rem; width: 33.4rem; height: 34.2rem; }
.doll .wx-slot { position: absolute; }
.doll .wx-slot.is-empty > img.wx-item { opacity: 0.22; }
.doll .tall { height: 10.6rem; }
.doll .tall > img.wx-item { top: 16%; height: 68%; }
.doll .bag { width: 5.2rem; height: 5.2rem; }
.doll-tag { position: absolute; font-size: 0.95rem; color: var(--wx-text-mute); text-align: center; width: 6.2rem; }
.doll-top { position: absolute; left: 0.8rem; right: 0.8rem; top: 0.8rem; height: 2.4rem; }
.doll-top .wx-btn { float: left; }

/* 左栏：特质与状态 */
.traits { left: 21.5rem; top: 55.7rem; width: 33.4rem; height: 8.8rem; padding: 0.5rem 0.9rem; }

/* 左栏：属性 */

/* ============================================================================

.rh { left: 55.1rem; top: 12.9rem; width: 69.1rem; height: 3.6rem; }
.rh-tabs { position: absolute; left: 10rem; right: 5rem; bottom: 0; text-align: center; white-space: nowrap; }
.rh-left { position: absolute; left: 0.7rem; top: 0.55rem; }
.rh-left .wx-btn { padding: 0 0.5rem; margin-right: 0.2rem; }
.rh-close { position: absolute; right: 0.8rem; top: 0.5rem; }
.rh-close .wx-seal-close { width: 2.5rem; height: 2.5rem; line-height: 2.25rem; transform: none; }

.rb { left: 55.1rem; top: 16.7rem; width: 69.1rem; height: 47.8rem; }
.pane { position: absolute; left: 0.6rem; top: 0.6rem; right: 0.6rem; bottom: 0.6rem; display: none; }
.pane.is-on { display: block; }

/* ---------------- 页签一：兵甲行囊 ---------------- */
.inv-grid { position: absolute; left: 0; top: 0; right: 0; bottom: 4.6rem; padding: 0.1rem 0 0 0.25rem; }
.inv-grid .wx-slot { width: 5.98rem; height: 5.98rem; margin: 0 0.08rem 0.1rem 0; float: left; cursor: pointer; }
.inv-grid .wx-slot.is-dim { opacity: 0.25; }
.inv-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 4.2rem; padding: 0.8rem 0.6rem 0 0.6rem; border-top: 1px solid var(--wx-gold-700); }
.inv-cap { float: left; width: 12rem; margin-right: 1rem; }
.inv-cap .t { font-size: 0.95rem; color: var(--wx-text-dim); line-height: 1.2rem; }
.inv-cap .wx-bar { height: 1.2rem; margin-top: 0.2rem; }
.inv-cap .wx-bar .wx-val { line-height: 1.05rem; font-size: 0.95rem; }
.inv-filters { float: left; margin-top: -0.1rem; }
.inv-foot .wx-btn { float: right; }

/* ---------------- 页签二：武学修为 ---------------- */
.wx-status { left: 0; top: 0; right: 0; height: 2.8rem; line-height: 2.8rem; white-space: nowrap; }
.ap-pips { display: inline-block; vertical-align: middle; height: 2rem; line-height: 2rem; padding: 0 0.6rem 0 0.4rem; margin-right: 0.5rem; background: var(--wx-wood-950); border: 1px solid var(--wx-gold-800); box-shadow: var(--wx-shadow-well); cursor: default; }
.ap-pips img { width: 1.5rem; height: 1.5rem; vertical-align: middle; margin: -0.2rem 0.35rem 0 0; }
.ap-pips i { display: inline-block; vertical-align: middle; width: 0.75rem; height: 1.15rem; margin-right: 0.12rem; background: var(--wx-bar-ap); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); margin-top: -0.15rem; }
.ap-pips i.is-perm { background: var(--wx-gold-200); box-shadow: 0 0 0.35rem rgba(247,231,184,0.8); }
.ap-pips i.is-cap { background: transparent; border: 1px dashed var(--wx-gold-700); width: 0.75rem; }

.meridian { left: 0; top: 3.2rem; right: 0; height: 13.4rem; background: rgba(0,0,0,0.28); border: 1px solid var(--wx-gold-800); box-shadow: inset 0 0 2rem rgba(0,0,0,0.6); }
.mer-line { position: absolute; height: 2px; top: 6.4rem; background: var(--wx-gold-500); box-shadow: 0 0 0.4rem rgba(216,179,106,0.5); }
.mer-line.is-dim { background: none; border-top: 2px dotted var(--wx-gold-700); box-shadow: none; }
.mer-group { position: absolute; top: 0.35rem; height: 1.4rem; line-height: 1.2rem; text-align: center; font-size: 0.95rem; color: var(--wx-text-mute); letter-spacing: 0.3em; border-top: 1px solid var(--wx-gold-800); }
.mer-col { position: absolute; top: 1.7rem; width: 8.6rem; height: 11.5rem; text-align: center; cursor: pointer; border: 1px solid transparent; }
.mer-col:hover { background: rgba(216,179,106,0.05); border-color: var(--wx-gold-800); }
.mer-col.is-sel { background: rgba(216,179,106,0.09); border-color: var(--wx-gold-600); }
.mer-col.is-sel:before { content: ''; position: absolute; left: 50%; top: -0.1rem; margin-left: -0.45rem; border: 0.45rem solid transparent; border-top-color: var(--wx-gold-400); }
.mer-col.is-drop-ok { border: 1px dashed var(--wx-jade-400); background: rgba(74,140,117,0.16); }
.mer-col.is-drop-no { opacity: 0.35; }
.mer-role { height: 1.5rem; line-height: 1.5rem; font-size: 1rem; font-weight: bold; color: var(--wx-text-dim); white-space: nowrap; }
.mer-col.is-dantian .mer-role { color: var(--wx-gold-300); }
.mer-box { position: relative; width: 6.2rem; height: 6.2rem; margin: 0.1rem auto 0 auto; background: url("../../mod_wuxia/gfx/ui/wx_skin/wx_slot_acupoint.png") no-repeat center; background-size: 100% 100%; }
.mer-col.is-dantian .mer-box { width: 6.8rem; height: 6.8rem; margin-top: -0.2rem; background-image: url("../../mod_wuxia/gfx/ui/wx_skin/wx_slot_dantian.png"); }
.mer-box img.ic { position: absolute; left: 0.75rem; top: 0.75rem; width: 4.7rem; height: 4.7rem; border-radius: 50%; }

.mer-box.is-off img.ic { opacity: 0.4; filter: grayscale(0.8); }
.mer-box .plus { display: block; line-height: 6.2rem; font-size: 2.4rem; color: var(--wx-gold-700); }
.mer-box.is-ready .plus { color: var(--wx-jade-400); text-shadow: var(--wx-glow-jade); }
.mer-box.is-locked { opacity: 0.55; }
.mer-box .lock { display: block; padding-top: 1.6rem; font-family: var(--wx-font-title); font-size: 1.5rem; line-height: 1.6rem; color: var(--wx-text-mute); }
.mer-box .lock small { display: block; font-family: var(--wx-font-body); font-size: 0.95rem; }
.mer-box .wx-badge { z-index: 4; }
.mer-tiers { height: 1.1rem; line-height: 1.1rem; margin-top: 0.2rem; }
.mer-col.is-dantian .mer-tiers { margin-top: -0.25rem; }
.mer-exp { width: 6.2rem; height: 0.55rem; margin: 0.2rem auto 0 auto; }
.mer-name { height: 1.7rem; line-height: 1.7rem; margin-top: 0.05rem; padding: 0 0.2rem; font-size: 1.1rem; font-weight: bold; color: var(--wx-text-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mer-name.is-empty { font-weight: normal; color: var(--wx-text-mute); }

.moves { left: 0; top: 17rem; width: 40.4rem; height: 5rem; padding: 0.55rem 0.6rem; background: rgba(0,0,0,0.22); border: 1px solid var(--wx-gold-800); white-space: nowrap; overflow: hidden; }
.moves .lab { display: inline-block; vertical-align: middle; width: 3.6rem; margin-right: 0.4rem; text-align: center; line-height: 1.4rem; }
.moves .lab b { display: block; font-size: 1.05rem; color: var(--wx-gold-300); }
.moves .lab span { font-size: 0.95rem; color: var(--wx-text-mute); }
.moves .empty-cap { display: inline-block; vertical-align: middle; width: 3.8rem; height: 3.8rem; margin-right: 0.35rem; border: 1px dashed var(--wx-gold-800); }
.passives { left: 41rem; top: 17rem; right: 0; height: 5rem; padding: 0.3rem 0.7rem; background: rgba(0,0,0,0.22); border: 1px solid var(--wx-gold-800); }
.passives .hd { height: 1.5rem; line-height: 1.5rem; font-size: 0.95rem; color: var(--wx-text-mute); white-space: nowrap; }
.passives .hd b { color: var(--wx-gold-300); font-size: 1rem; margin-right: 0.4rem; }
.pv-stat { float: left; width: 33.3%; height: 1.55rem; line-height: 1.55rem; font-size: 1.02rem; white-space: nowrap; cursor: default; }
.pv-stat span { color: var(--wx-text-dim); margin-right: 0.3rem; }
.pv-stat b { color: var(--wx-pos); }
.pv-stat b.is-cap { color: var(--wx-amber-400); }
.pv-stat:hover span { color: var(--wx-gold-300); }

.lower-l { left: 0; top: 22.6rem; width: 40.4rem; bottom: 0; }
.shelf-bar { position: absolute; left: 0; right: 0; top: 0; height: 2.6rem; border-bottom: 1px solid var(--wx-gold-800); white-space: nowrap; }
.shelf-bar .r { position: absolute; right: 0; top: 0.05rem; }
.shelf-bar .wx-input { width: 8.6rem; height: 2.3rem; margin-left: 0.4rem; }
.shelf-hint { position: absolute; left: 0; right: 0; top: 2.9rem; height: 2rem; line-height: 2rem; padding: 0 0.6rem; font-size: 1rem; color: var(--wx-text-dim); background: rgba(31,61,51,0.35); border-left: 3px solid var(--wx-jade-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shelf-hint b { color: var(--wx-jade-300); }
.shelf-hint.is-lock { background: rgba(0,0,0,0.3); border-left-color: var(--wx-gold-700); }
.shelf-list { position: absolute; left: 0; right: 0; top: 5.3rem; bottom: 0; padding-right: 0.3rem; }

.mcard {
	position: relative; float: left; width: 19.5rem; height: 5.4rem; margin: 0 0.4rem 0.4rem 0; padding: 0.55rem 0.6rem 0 5.6rem;
	background: var(--wx-wood-800); border: 1px solid var(--wx-gold-800); border-left: 3px solid var(--wx-gold-800); cursor: pointer;
	transition: background-color var(--wx-dur-fast);

.mcard .ic img { position: absolute; left: 0.25rem; top: 0.25rem; width: 3.7rem; height: 3.7rem; }

.mcard .nm { font-size: 1.15rem; font-weight: bold; color: var(--wx-text-hi); line-height: 1.6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 3.6rem; }
.mcard .sb { font-size: 0.95rem; color: var(--wx-text-dim); line-height: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 3.6rem; }
.mcard .pr { margin-top: 0.2rem; white-space: nowrap; height: 1.2rem; line-height: 1.2rem; font-size: 0.95rem; color: var(--wx-text-mute); }

	font-family: var(--wx-font-title); font-size: 1.05rem; line-height: 1.2rem; color: var(--wx-gold-200);
	border: 1px solid var(--wx-gold-500); background: rgba(216,179,106,0.1);
}
.shelf-empty { padding: 3rem 2rem; text-align: center; color: var(--wx-text-mute); font-size: 1.1rem; line-height: 1.8rem; }

.insp-wx { left: 41rem; top: 22.6rem; right: 0; bottom: 0; }

/* ---------------- 页签三：藏经阁 ---------------- */
.lib-top { left: 0; top: 0; right: 0; height: 3.2rem; line-height: 3.2rem; white-space: nowrap; border-bottom: 1px solid var(--wx-gold-800); }
.lib-top .ttl { display: inline-block; vertical-align: middle; font-size: 1.9rem; color: var(--wx-gold-200); margin: 0 0.8rem 0 0.2rem; }
.lib-top .right { position: absolute; right: 0; top: 0; }
.lib-top .right > * { margin-left: 0.5rem; }
.lib-idx { left: 0; top: 3.8rem; width: 10.2rem; bottom: 0; padding: 0.2rem 0.4rem 0 0; border-right: 1px solid var(--wx-gold-800); }
.idx-h { margin: 0.5rem 0 0.15rem 0.5rem; font-size: 0.95rem; color: var(--wx-text-mute); letter-spacing: 0.25em; }

.lib-mid { left: 10.8rem; top: 3.8rem; width: 30.2rem; bottom: 0; }
.lib-tool { position: absolute; left: 0; right: 0; top: 0; height: 2.6rem; white-space: nowrap; }
.lib-tool .wx-input { width: 12.4rem; height: 2.4rem; }
.lib-tool .r { position: absolute; right: 0; top: 0; }
.seg { display: inline-block; vertical-align: middle; border: 1px solid var(--wx-gold-700); }
.seg span { display: inline-block; height: 2.2rem; line-height: 2.2rem; padding: 0 0.6rem; font-size: 1rem; font-weight: bold; color: var(--wx-text-dim); cursor: pointer; }

.lcard {
	position: relative; float: left; width: 14.4rem; height: 6.1rem; margin: 0 0.4rem 0.4rem 0; padding: 0.55rem 0.5rem 0 5.6rem;
	background: var(--wx-wood-800); border: 1px solid var(--wx-gold-800); cursor: pointer;
}
.lcard:nth-child(2n) { margin-right: 0; }
.lcard:hover { background: var(--wx-wood-750); border-color: var(--wx-gold-700); }
.lcard.is-insp { border-color: var(--wx-gold-500); box-shadow: inset 0 0 0 1px rgba(216,179,106,0.25); }
.lcard.is-learned { opacity: 0.55; }
.lcard .wx-slot { position: absolute; left: 0.5rem; top: 0.5rem; width: 4.8rem; height: 4.8rem; }
.lcard .nm { font-size: 1.12rem; font-weight: bold; color: var(--wx-text-hi); line-height: 1.55rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lcard .sb { font-size: 0.95rem; line-height: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--wx-text-dim); }
.lcard .st { font-size: 0.95rem; line-height: 1.5rem; white-space: nowrap; overflow: hidden; color: var(--wx-text-mute); }
.lcard .st.ok { color: var(--wx-jade-300); }
.lcard .st.hot { color: var(--wx-cinnabar-300); font-weight: bold; }

	function bro() { return D.bro; }
	function needExp(id, tier) { var q = QUAL[M[id].q]; return tier >= 3 ? 0 : q.exp[tier]; }
	function equippedSlotOf(id) { var s = bro().slots; for (var i = 0; i < s.length; i++) if (s[i].m === id) return i; return -1; }
	function slotUnlocked(i) { return bro().level >= bro().slots[i].unlock; }

	function canFit(id, idx) {
		var s = bro().slots[idx], m = M[id];
		if (!slotUnlocked(idx)) return { ok: false, why: '穴位尚未贯通（' + s.unlock + ' 级）' };
		if (s.cats.indexOf(m.cat) < 0) return { ok: false, why: '此穴只可装配：' + catsLabel(s.cats) };
		var eq = equippedSlotOf(id);
		if (eq >= 0 && eq !== idx) return { ok: false, why: '已装于穴' + CN[eq + 1] };
		if ((m.cat === 'neigong' || m.cat === 'qinggong') && catCount(m.cat, idx) >= 2) return { ok: false, why: '全身最多 2 门' + CAT[m.cat].short };

	function attrVal(name) {

	}

	/* 同系被动取最高（Math.max），辅修第二内功按 50% 折算 */
	function passives() {
		var out = {}, s = bro().slots;
		for (var i = 0; i < s.length; i++) {
			if (!s[i].m) continue;
			var id = s[i].m, m = M[id], l = bro().learned[id];
			if (!l || !wpnOk(id)) continue;
			var st = m.stats[l.tier - 1] || {};
			var halve = (m.cat === 'neigong' && i !== 0);
			for (var k in st) {
				if (!st.hasOwnProperty(k)) continue;
				var v = st[k]; if (halve && (k === 'Stamina' || k === 'Recovery')) v = Math.floor(v / 2);
				if (!out[k]) out[k] = { v: v, src: m.name, others: [] };
				else if (v > out[k].v) { out[k].others.push(out[k].src + ' ' + out[k].v); out[k].v = v; out[k].src = m.name; }
				else out[k].others.push(m.name + ' ' + v);
			}
		}
		return out;
	}
	function activeMoves() {
		var res = [], seen = {}, s = bro().slots;
		for (var i = 0; i < s.length; i++) {
			if (!s[i].m) continue;
			var id = s[i].m, m = M[id], l = bro().learned[id];
			for (var t = 0; t < l.tier; t++) {
				var arr = m.moves[t] || [];
				for (var j = 0; j < arr.length; j++) { if (seen[arr[j].id]) continue; seen[arr[j].id] = 1; res.push({ mv: arr[j], cat: m.cat, src: m.name, ok: wpnOk(id) }); }
			}
		}
		return res;
	}

		'<li>新增<b>书架视图</b>：线装书脊 + 竖排题签（逐字 &lt;br&gt;，不依赖 writing-mode），品阶即布面颜色，残页为散页。</li>' +
		'<li>残页进度用分段方格，凑齐变朱砂；「一键拼合」是本页唯一朱砂按钮。</li></ul>' +
		'<h3>兵甲行囊</h3><ul><li>保持原版仓库手感，仅统一角标（新篇 / 阁藏 / 已习 / 残页进度）与底栏「典籍入阁」。</li></ul>' +
		'<h3>移植提示</h3><ul><li>布局只用 absolute / float / inline-block；JS 为 ES3 写法；CSS 变量移植时替换为字面值（见设计令牌页）。</li></ul>';

	/* 缩放适配 */
	function fit() {
		SCALE = Math.min(window.innerWidth / 1421, window.innerHeight / 906) / 2;
		var st = $('stage'), w = 2842 * SCALE, h = 1812 * SCALE;
		st.style.transform = 'scale(' + SCALE + ')';
		st.style.left = Math.max(0, (window.innerWidth - w) / 2) + 'px';
		st.style.top = Math.max(0, (window.innerHeight - h) / 2) + 'px';
	}
	window.addEventListener('resize', fit);
	fit();
	/* 地址栏参数：#tab=lib&view=shelf&modal=wash，便于直接分享某个状态 */
	var hp = (location.hash || '').replace('#', '').split('&');
	for (var hi = 0; hi < hp.length; hi++) {
		var kv = hp[hi].split('=');
		if (kv[0] === 'tab') S.tab = kv[1];
		if (kv[0] === 'view') S.lib.view = kv[1];
		if (kv[0] === 'grid') S.grid = true;
	}
	renderAll();
	for (hi = 0; hi < hp.length; hi++) {
		var kv2 = hp[hi].split('=');
		if (kv2[0] === 'modal' && kv2[1] === 'wash') openWash();
		if (kv2[0] === 'modal' && kv2[1] === 'swap') doEquip('youxia', 1, false);
		if (kv2[0] === 'notes') $('pv-notes').style.display = 'block';
		if (kv2[0] === 'selftest') selfTest();
	}
	function selfTest() {
		var log = [], steps = [
			['装入空穴', function () { S.selSlot = 4; doEquip('youxia', 4, false); return bro().slots[4].m === 'youxia'; }],
			['换装确认', function () { doEquip('wuhu', 1, false); var b = modalEl.querySelector('[data-mf="1"]'); b.click(); return bro().slots[1].m === 'wuhu' && bro().scatter >= 2; }],
			['外功换兵判定', function () { return !wpnOk('wuhu') && !passives().MeleeSkill || passives().MeleeSkill.src !== '五虎断门刀'; }],
			['卸下', function () { doUnequip(1); modalEl.querySelector('[data-mf="1"]').click(); return !bro().slots[1].m; }],
			['内功上限 2 门', function () { bro().slots[5].unlock = 1; bro().slots[6].unlock = 1; doEquip('cuqian', 5, false); var r = bro().slots[5].m === 'cuqian' && canFit('songtao', 6).ok === false; bro().slots[5].unlock = 9; bro().slots[6].unlock = 11; bro().slots[5].m = null; return r; }],
			['灌注突破', function () { S.selSlot = 2; var t = bro().learned.taxue.tier; addExp('taxue', 120); return bro().learned.taxue.tier === t + 1; }],
			['阁藏习并装', function () { bro().slots[1].m = null; S.selSlot = 1; doEquip('baoyu', 1, true); modalEl.querySelector('[data-mf="1"]').click(); return !!bro().learned.baoyu && bro().slots[1].m === 'baoyu'; }],
			['拼合残页', function () { S.lib.insp = 'page:heifeng'; libAct('lib-craft'); return !!libItem('manual', 'heifeng') && !libItem('page', 'heifeng'); }],
			['2:1 补缺', function () { S.lib.insp = 'page:xuesha'; libAct('lib-wild'); modalEl.querySelector('[data-mf="1"]').click(); return !!libItem('manual', 'xuesha'); }],
			['藏经阁研习', function () { S.lib.insp = 'manual:songtao'; libAct('lib-learn'); return !!bro().learned.songtao; }],
			['筛选 + 书架', function () { S.tab = 'lib'; S.lib.cat = 'waigong'; S.lib.view = 'shelf'; renderAll(); return document.querySelectorAll('.spine').length > 0; }],
			['洗髓弹窗', function () { S.lib.cat = null; openWash(); modalEl.querySelector('[data-wt="3"]').click(); var ok = !/is-disabled/.test(modalEl.querySelector('[data-mf="1"]').className); closeModal(); return ok; }],
			['服丹', function () { var n = D.pills.huxin; bro().scatter = 2; var el = document.createElement('div'); el.setAttribute('data-act', 'heal'); el.setAttribute('data-v', 'huxin'); document.body.appendChild(el); el.click(); el.parentNode.removeChild(el); return bro().scatter === 0 && D.pills.huxin === n - 1; }]
		];
		for (var i = 0; i < steps.length; i++) { var ok; try { ok = steps[i][1](); } catch (err) { ok = 'ERR ' + err.message; } log.push((ok === true ? '✓ ' : '✗ ') + steps[i][0] + (ok === true ? '' : ' → ' + ok)); }
		var d = document.createElement('pre'); d.id = 'selftest'; d.style.cssText = 'position:fixed;left:8px;top:8px;z-index:99999;margin:0;padding:8px 12px;background:rgba(0,0,0,0.9);color:#9fd6c1;font:13px/1.5 monospace;border:1px solid #806337';
		d.textContent = log.join('\n'); document.body.appendChild(d);
	}
})();

</script>
