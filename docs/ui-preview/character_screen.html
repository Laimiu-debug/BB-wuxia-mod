<!DOCTYPE html>

<link rel="stylesheet" href="wx_vanilla_kit.css">
<style>
/* ============================================================================
 * v2「原版同构」：外壳 100% 用原版贴图与原版字色，武侠味只放在内容里
 *   - 贴图：docs/ui-preview/_vanilla/（python tools/extract_vanilla_ui_ref.py 从本机游戏提取，不入库）
 *   - 游戏内直接 coui://gfx/ui/skin/xxx.png 引用同名原版贴图，零新增美术
 *   - 字色取自原版 ui/colors.css；字号取自原版 ui/fonts.css（正文 1.4rem 起）
 *   - 布局只用 absolute / float / inline-block
 * ============================================================================ */
html { font-size: 20px; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0705; }
#stage { position: absolute; left: 0; top: 0; width: 142.1rem; height: 90.6rem; transform-origin: 0 0; }
.cs {
	position: absolute; left: 0; top: 0; width: 142.1rem; height: 90.6rem;
	background: url("_vanilla/gfx/ui/skin/background_inventory.png") no-repeat 0 0 / 142.1rem 90.6rem;
	font-family: 'FreeUniversal', 'BB Han', sans-serif; font-size: 1.4rem; line-height: 1.3;
	color: #d7b174; text-shadow: 1px 1px 1px #000;
}
.cs.bg-wx { background-image: url("../../mod_wuxia/gfx/ui/wx_skin/wx_background_inventory.png"); }
.cs.bg-statue { background-image: url("_vanilla/wx_background_inventory_v2.png"); }
.cs * { box-sizing: border-box; }
.area { position: absolute; }
.grid-on .area { outline: 1px dashed rgba(221,162,31,0.7); }
.clear { clear: both; }

/* ============================================================================
 * 布局：按原版 background_inventory.png 实测坐标（px ÷ 10 = rem）
 * ============================================================================ */
.lh     { left: 21.2rem; top: 12.6rem; width: 33.9rem; height: 9.0rem; }
.doll   { left: 21.2rem; top: 21.7rem; width: 33.9rem; height: 33.9rem; }
.skills { left: 21.2rem; top: 55.7rem; width: 33.9rem; height: 9.4rem; }
.stats  { left: 21.2rem; top: 65.2rem; width: 33.9rem; height: 25.2rem; }
.rh     { left: 55.2rem; top: 12.6rem; width: 69.4rem; height: 3.8rem; }
.rb     { left: 55.2rem; top: 16.6rem; width: 69.4rem; height: 44.8rem; }
.rstrip { left: 55.2rem; top: 61.5rem; width: 69.4rem; height: 3.6rem; }
.roster { left: 55.2rem; top: 65.2rem; width: 69.4rem; height: 25.1rem; }

.bg-wx .skills { top: 55.7rem; height: 8.8rem; } .bg-wx .stats { top: 64.7rem; }
.bg-wx .rh { left: 55.1rem; top: 12.9rem; height: 3.7rem; } .bg-wx .rb { left: 55.1rem; top: 16.7rem; height: 44.2rem; }
.bg-wx .rstrip { left: 55.1rem; top: 60.9rem; } .bg-wx .roster { left: 55.1rem; top: 64.7rem; }

/* 预览工具条 */
.pv { position: absolute; left: 21.2rem; right: 17.5rem; top: 2.6rem; height: 8rem; }
.pv h1 { margin: 0; font-family: 'BB Han Serif', serif; font-weight: 600; font-size: 2.8rem; color: #dda21f; text-shadow: 1px 1px rgba(0,0,0,0.5), -1px -1px #000; }

.st img.ico { position: absolute; left: 0; top: 0.6rem; width: 2.6rem; height: 2.6rem; }

.rh .close { position: absolute; right: 1rem; top: 0; }
.rh .badge { position: absolute; right: 1.2rem; top: 0.4rem; min-width: 2rem; height: 2rem; line-height: 2rem; padding: 0 0.4rem; font-family: 'FreeUniversal', sans-serif; font-size: 1.2rem; font-weight: normal; color: #fff; background: #8f1e1e; border-radius: 1rem; text-shadow: none; box-shadow: 0 0 0 1px #000; }
.pane { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; }
.pane.on { display: block; }
.strip { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: none; padding: 0 1.4rem; line-height: 3.6rem; white-space: nowrap; overflow: hidden; }
.strip.on { display: block; }
.strip .r { position: absolute; right: 1.6rem; top: 0; }
.strip img { width: 2.4rem; height: 2.4rem; vertical-align: middle; margin: -0.3rem 0.4rem 0 0; }

/* 通用：筛选按钮排（原版 filter-panel：左 2.0 / 上 0.8 / 间距 5.0） */
.fbar { position: absolute; left: 1.4rem; top: 0.6rem; right: 1.4rem; height: 4.3rem; white-space: nowrap; }
.fbar .vb3 { margin-right: -0.2rem; }

/* ---------------- 页签一：兵甲行囊 ---------------- */

.inv-grid .vslot > img.it { width: 6.7rem; height: 6.7rem; }
.inv-grid .vslot.fdim > img.it { opacity: 0.25; }

/* ---------------- 页签二：武学修为 ---------------- */
.wx-head { position: absolute; left: 1.6rem; right: 1.4rem; top: 0.6rem; height: 4.3rem; line-height: 4.3rem; white-space: nowrap; }

.meridian { position: absolute; left: 0.8rem; right: 0.8rem; top: 5.2rem; height: 14.4rem; }

.mcol { position: absolute; top: 0; width: 9.4rem; height: 14.4rem; text-align: center; cursor: pointer; }

.mcol.is-sel .role { color: #dda21f; }
.mcol .disc { position: relative; width: 6.4rem; height: 6.4rem; margin: 0 auto; }
.mcol .disc img.ic { position: absolute; left: 0.5rem; top: 0.5rem; width: 5.4rem; height: 5.4rem; border-radius: 50%; }
.mcol .disc .ring { position: absolute; left: 0; top: 0; width: 6.4rem; height: 6.4rem; background: url("_vanilla/gfx/ui/perks/selection_frame.png") 0 0 / 100% 100%; opacity: 0.35; }
.mcol.is-sel .disc .ring { opacity: 1; }
.mcol .disc .well { position: absolute; left: 0.6rem; top: 0.6rem; width: 5.2rem; height: 5.2rem; border-radius: 50%; background: radial-gradient(circle, rgba(0,0,0,0.55), rgba(0,0,0,0.25)); }
.mcol .disc .plus { position: absolute; left: 2.05rem; top: 2.05rem; width: 2.3rem; height: 2.3rem; opacity: 0.45; }
.mcol.ready .disc .plus { opacity: 1; }
.mcol .disc .lock { position: absolute; left: 2.1rem; top: 1.7rem; width: 2.2rem; height: 2.8rem; opacity: 0.75; }
.mcol.locked .disc, .mcol.locked .role, .mcol.locked .nm { opacity: 0.4; }
.mcol.off .disc img.ic { -webkit-filter: grayscale(100%); filter: grayscale(100%); opacity: 0.55; }
.mcol .disc .hl { position: absolute; left: -1rem; top: -1.1rem; width: 8.4rem; height: 8.8rem; background: url("_vanilla/gfx/ui/skin/inventory_highlight.png") 0 0 / 100% 100%; display: none; }
.mcol.drop-ok .disc .hl { display: block; }
.mcol.drop-no { opacity: 0.35; }
.mcol .tier { height: 1.9rem; line-height: 1.9rem; margin-top: 0.3rem; font-size: 1.3rem; color: #dda21f; }
.mcol .vxp { width: 7rem; height: 0.8rem; margin: 0 auto; }
.mcol .nm { height: 2rem; line-height: 2rem; margin-top: 0.2rem; padding: 0 0.2rem; font-size: 1.35rem; color: #d7b174; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcol.empty .nm { color: #8a7454; }
.mcol.ready .nm { color: #dda21f; }

.pas { position: absolute; left: 1.6rem; width: 39rem; top: 20.2rem; height: 3.2rem; line-height: 3.2rem; white-space: nowrap; overflow: hidden; }
.pas .it { display: inline-block; margin-right: 0.9rem; cursor: default; }
.pas .it img { width: 2.2rem; height: 2.2rem; vertical-align: middle; margin: -0.3rem 0.25rem 0 0; }
.pas .it b { font-weight: normal; color: #dda21f; }
.pas .lab { color: #bd9d71; font-style: italic; margin-right: 0.6rem; }
.shelf-f { position: absolute; left: 1.4rem; width: 39.5rem; top: 23.8rem; height: 4.3rem; white-space: nowrap; }
.shelf-f .vb2 { width: 7.4rem; margin-right: -0.1rem; }
.shelf-f .vb3 { width: 4.4rem; margin-left: -0.1rem; }
.shelf-f .vb3 img { width: 2.4rem; height: 2.4rem; }
.shelf-f .r { position: absolute; right: 0; top: 0.1rem; }
.shelf-g { position: absolute; left: 1.4rem; width: 39.8rem; top: 28.6rem; bottom: 0.4rem; padding-top: 0.2rem; }

/* 详览台：原版 dialog_panel_01 皮革底 */
.insp { position: absolute; background: url("_vanilla/gfx/ui/skin/dialog_panel_01.png") 0 0 / 100% 100%; }
.insp .body { position: absolute; left: 0; right: 0; top: 0; bottom: 5.2rem; padding: 1.2rem 1.4rem 0.6rem 1.4rem; }
.insp .foot { position: absolute; left: 0; right: 0; bottom: 0.6rem; height: 4.3rem; text-align: center; white-space: nowrap; }
.insp .foot .vb { margin: 0 0.1rem; }
.insp .hd { position: relative; min-height: 6rem; padding-left: 6.6rem; margin-bottom: 0.6rem; }
.insp .hd img { position: absolute; left: 0; top: 0; width: 5.6rem; height: 5.6rem; }
.insp .hd .t-title { font-size: 1.9rem; line-height: 2.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insp .hd .s { font-size: 1.3rem; line-height: 1.8rem; }
.insp .desc { font-size: 1.35rem; line-height: 1.9rem; color: #bd9d71; font-style: italic; margin-bottom: 0.8rem; }
.insp .sec { margin: 0.6rem 0 0.3rem 0; font-size: 1.4rem; color: #dda21f; }
.insp .tl { font-size: 1.35rem; line-height: 1.9rem; margin-bottom: 0.5rem; color: #8a7454; }
.insp .tl b { font-weight: normal; color: #a08860; margin-right: 0.4rem; }
.insp .tl.done { color: #d7b174; } .insp .tl.done b { color: #dda21f; }
.insp .tl.next b { color: #dda21f; }
.insp .tl .vxp { width: 14rem; margin-top: 0.3rem; display: inline-block; vertical-align: middle; }
.insp .ln { font-size: 1.35rem; line-height: 1.9rem; }
.insp-wx { left: 41.6rem; right: 0.8rem; top: 20.0rem; bottom: 0.4rem; }
.insp-lib { left: 41.6rem; right: 0.8rem; top: 5.4rem; bottom: 0.4rem; }

/* ---------------- 页签三：藏经阁 ---------------- */
.lib-g { position: absolute; left: 1.4rem; width: 39.8rem; top: 5.6rem; bottom: 0.4rem; }

/* ---------------- 右下：原版阵型（3 × 9） ---------------- */
.roster { padding: 0.5rem 0 0 1.4rem; }
.bro { position: relative; float: left; width: 7.1rem; height: 7.8rem; margin: 0.35rem 0 0 0.4rem; background: url("_vanilla/gfx/ui/skin/inventory_figure.png") center / 6.8rem 7.8rem no-repeat; cursor: pointer; }

.bro .hl { position: absolute; left: -0.7rem; top: -0.6rem; width: 8.5rem; height: 9rem; z-index: 1; background: url("_vanilla/gfx/ui/skin/inventory_highlight.png") 0 0 / 100% 100%; }
.bro .mood { position: absolute; right: 0.1rem; top: 0.1rem; width: 2rem; height: 2rem; z-index: 3; }
.bro .lv { position: absolute; left: 0.3rem; bottom: 0.1rem; z-index: 3; font-size: 1.2rem; color: #d6dbe9; }
.bro .up { position: absolute; left: 0.2rem; top: 0.1rem; width: 2rem; height: 2rem; z-index: 3; }

/* 原版无 toast：用一行横幅文字代替 */
.banner { position: absolute; z-index: 950; left: 55.2rem; width: 69.4rem; top: 17rem; text-align: center; display: none; pointer-events: none; }
.banner span { display: inline-block; padding: 0.6rem 2rem; font-size: 1.6rem; color: #dda21f; background: rgba(10,6,3,0.85); }

.notes { position: absolute; right: 1.4rem; top: 11rem; width: 32rem; z-index: 800; display: none; max-height: 76rem; padding: 1.6rem 1.8rem; background: url("_vanilla/gfx/ui/skin/dialog_panel_01.png") 0 0 / 100% 100%; font-size: 1.35rem; line-height: 2rem; box-shadow: 0 0 2rem #000; }

.notes ul { margin: 0; padding-left: 1.4rem; }
.notes b { font-weight: normal; color: #dda21f; }
</style>

</div>

	});

	$('notes').innerHTML =
		'<h3>v1 为什么突兀</h3><ul>' +
		'<li>原版人物界面是<b>暖棕皮革</b>（底色约 #2d2117），v1 用了近黑乌木 + 骨白字，整个亮度和色温都偏了。</li>' +
		'<li>原版正文是<b>橙金 #dda21f / 浅褐 #d7b174 / 斜体褐 #bd9d71</b>，v1 用了骨白、石青、琥珀等原版没有的颜色。</li>' +
		'<li>原版控件全是<b>位图贴图</b>（凸起的按钮、压花列表框、格位），v1 全是 1px 细线 + 胶囊标签 + 开关，像网页后台。</li>' +
		'<li>原版正文 1.4~1.8rem、元素稀疏，细节都放进<b>羊皮纸提示框</b>；v1 正文 1.1rem、卡片密集。</li>' +
		'<li>原版提示框是<b>浅色羊皮纸 + 深蓝墨字</b>，v1 做成了深色。</li></ul>' +
		'<h3>v2 的做法</h3><ul>' +
		'<li>外壳只用原版贴图：button_01/02/03、button_tab、inventory_slot、inventory_highlight、天赋选中圈、dialog_panel、popup 木板、羊皮纸提示框、原版进度条与图标。</li>' +
		'<li>武学修为照搬<b>原版天赋页</b>手法：圆形图标直接摆在底上，选中=原版选中圈，未贯通=33% 透明 + 原版锁。</li>' +
		'<li>已习武学 / 藏经阁照搬<b>原版仓库</b>：格位 + 右下数量角标 + 原版橙色光晕表示「可以操作」。</li>' +
		'<li>招式放回左栏原版<b>技能行</b>；行动力、负重留在原版属性栏。</li>' +
		'<li>洗经伐髓照搬原版<b>升级弹窗</b>的行结构（图标 + 星 + 属性条）。</li>' +
		'<li>武侠味只放在内容上：武学图标、宋体标题、穴位 / 重数 / 火候等称谓、经络金线（原版 line_gold.png）。</li></ul>' +
		'<h3>移植</h3><ul><li>游戏内直接用 coui://gfx/ui/skin/… 引用原版贴图，零新增美术。</li><li>底图默认为「新雕像」：原版棕色面板 + 放大的武侠雕像（只露半身，尺度同原版骑士 / 骷髅），由 tools/build_wx_character_bg_v2.py 生成；按钮可切换原版底 / 旧 mod 底对比。</li></ul>';

	function fit() {
		SCALE = Math.min(window.innerWidth / 1421, window.innerHeight / 906) / 2;
		var st = $('stage'); st.style.transform = 'scale(' + SCALE + ')';
		st.style.left = Math.max(0, (window.innerWidth - 2842 * SCALE) / 2) + 'px'; st.style.top = Math.max(0, (window.innerHeight - 1812 * SCALE) / 2) + 'px';
	}
	window.addEventListener('resize', fit); fit();
	var hp = (location.hash || '').replace('#', '').split('&');
	for (var hi = 0; hi < hp.length; hi++) { var kv = hp[hi].split('='); if (kv[0] === 'tab') S.tab = kv[1]; if (kv[0] === 'bg') S.bg = kv[1]; if (kv[0] === 'grid') S.grid = true; }
	renderAll();
	for (hi = 0; hi < hp.length; hi++) { var kv2 = hp[hi].split('='); if (kv2[0] === 'modal' && kv2[1] === 'wash') openWash(); if (kv2[0] === 'modal' && kv2[1] === 'swap') doEquip('youxia', 1, false); if (kv2[0] === 'notes') $('notes').style.display = 'block'; if (kv2[0] === 'selftest') selfTest(); }
	function selfTest() {
		function ok0() { modalEl.querySelector('[data-mf="0"]').click(); }
		var log = [], steps = [
			['装入空穴', function () { S.selSlot = 4; doEquip('youxia', 4, false); return bro().slots[4].m === 'youxia'; }],
			['换装确认', function () { doEquip('wuhu', 1, false); ok0(); return bro().slots[1].m === 'wuhu' && bro().scatter >= 2; }],
			['卸下', function () { doUnequip(1); ok0(); return !bro().slots[1].m; }],
			['内功上限 2 门', function () { bro().slots[5].unlock = 1; bro().slots[6].unlock = 1; doEquip('cuqian', 5, false); var r = bro().slots[5].m === 'cuqian' && canFit('songtao', 6).ok === false; bro().slots[5].unlock = 9; bro().slots[6].unlock = 11; bro().slots[5].m = null; return r; }],
			['灌注突破', function () { var t = bro().learned.taxue.tier; addExp('taxue', 120); return bro().learned.taxue.tier === t + 1; }],
			['阁藏习并装', function () { S.selSlot = 1; doEquip('baoyu', 1, true); ok0(); return !!bro().learned.baoyu && bro().slots[1].m === 'baoyu'; }],
			['拼合残页', function () { S.lib.insp = 'page:heifeng'; libAct('lib-craft'); return !!libItem('manual', 'heifeng'); }],
			['2:1 补缺', function () { S.lib.insp = 'page:xuesha'; libAct('lib-wild'); ok0(); return !!libItem('manual', 'xuesha'); }],
			['藏经阁研习', function () { S.lib.insp = 'manual:songtao'; libAct('lib-learn'); return !!bro().learned.songtao; }],
			['洗髓弹窗', function () { openWash(); modalEl.querySelector('[data-wt="3"]').click(); var r = !/\bdis\b/.test(modalEl.querySelector('[data-mf="0"]').className); closeModal(); return r; }],
			['换底几何', function () { S.bg = 'wx'; renderAll(); var r = /bg-wx/.test($('cs').className); S.bg = 'statue'; renderAll(); return r && /bg-statue/.test($('cs').className); }]
		];
		for (var i = 0; i < steps.length; i++) { var r; try { r = steps[i][1](); } catch (err) { r = 'ERR ' + err.message; } log.push((r === true ? '✓ ' : '✗ ') + steps[i][0] + (r === true ? '' : ' → ' + r)); }
		var d = document.createElement('pre'); d.style.cssText = 'position:fixed;left:8px;top:8px;z-index:99999;margin:0;padding:8px 12px;background:rgba(0,0,0,0.9);color:#dda21f;font:13px/1.5 monospace'; d.textContent = log.join('\n'); document.body.appendChild(d);
	}
})();
