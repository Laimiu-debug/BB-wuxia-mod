"systems": [
  {"key":"background","g":1,"parent":"","old":"人物出身","new":"江湖出身","rel":"改编","ref":"https://bbmod.com/wiki/read/Character_Backgrounds/?lang=zh","srcLabel":"Character Backgrounds","scope":"记录侠客的来历、已有本领、入队约定及相关际遇。","root":true,"body":"出身记录来历、旧行当和接触过的环境。师承记录已有武学的来源和仍然有效的约定。性情、资质、伤势和实际掌握的武学各有记录。队伍开局另定初始人手、家当和当局目标。\n\n先由地点、差事、旧交引荐或求助触发相遇。见面后再查本人意愿、当前职责和谁可以证明来历。可以约一程、雇一趟、长期结伴、仅向其求教或暂不同行。不同类型各自约明酬劳、期限和退出方式。\n\n登记眼下能使用的本领、随身物及拥有者、已发生的伤势、未结差事和答应过的人。能分辨货签、会辨兽踪这一类经验可提供选项。兵器、招式和站位在实际交手里决定同伴能做什么。\n\n让同一出身有两条以上可走的路。先靠已有本事承担查路、护货、照料或修缮，再经训练、求教师父和研读已有秘籍学习新职责。资质主要影响学习过程，成长速度和上限待议。\n\n欠款、师门请托、地方亲友和当前雇约分别记。遇到催书、旧债或义务冲突时，先让当事人提出选择，再以查证、协商、办差或分路结算。离队时记录人物去向、未付报酬和带走的物件，重逢时可沿用本局记录。\n\n每次际遇绑定实际在场的人、可查的事由与地点。樵夫辨林路可以给出走法，领队仍可查路或改道。采用建议后根据真正经过的路径、交付物与见证人结算；旧事何时能再次出现待议。\n\n招募地点和稀有度、薪酬、开局装备、属性区间、特殊事件触发频率和离队条件都仍待确认。原版数值页保留为资料入口。出身档案里的本领、随身物和事件属于设计候选。"},
  {"key":"traits","g":1,"parent":"","old":"特性","new":"性情与禀性","rel":"改编","ref":"https://bbmod.com/wiki/read/Traits/?lang=zh","srcLabel":"Traits","scope":"记录人物处事倾向、身体禀赋及擂斗、幸存等经历。候选档案包含表现、应对和际遇。","root":true,"body":"性情记录人物平日处事的倾向。禀性记录体质、视野或学习节奏。履历记录幸存、擂斗与曾任身份。出身、师承、已有武学和当前职责分别记录，再由一件具体差事把它们联系起来。\n\n心境随日常损失、休息与谈话变化。战意应对临阵威胁、同伴伤亡和站位压力。胆魄是承压能力的一项参考。人物与领队的关系依用人、履约和旧交发展，同一人可同时忠义、畏惧异兽，并在露出退路后继续担任护卫。\n\n记录具体情境、当事人、可见征兆、人物提出的选项和结果。急躁可在时机紧张时催促先动，谨诺可在接差前要求核时限。两人同场时都可提出意见，再依据站位、已知消息、承诺和身份选择能办到的行动。\n\n怯懦着重险事之前反复顾虑退路，胆怯着重突遇威胁时战意动摇，犹豫着重在信息或指令冲突时迟一步。勇敢着重知险后愿意帮忙，无畏着重眼前威吓下仍站得住，视死如归着重为具体承诺自愿担较大风险。\n\n受惊者可退到有接应的位置，初学慢的同伴可以拆步练习，体质有限的同伴可按出勤和装备换岗。性情变化可来自多次有记录的经历与个人选择；需要缓解多长、哪些属于暂时状态，依各条的候选边界。\n\n同一件事先结算实际行动、伤势与物资，再更新心境、关系和履历。候选按触发来源查能否重复表现。所有影响数值、取得和消退条件、叠加规则、触发频率及初始生成方式仍待讨论。","aliases":["性情与秉性","秉性"]},
  {"key":"attributes","g":1,"parent":"","old":"属性","new":"侠客属性","rel":"改编","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh","srcLabel":"Attributes","scope":"16 项侠客属性，按回合资源、时机与战意、命中与伤害、护甲与视野查阅。","root":true,"body":"面板区分人物底值、装备和武学带来的变化、临时状态及这次行动用到的值。气血、内力和行动点各自有当前额度。战意是临阵状态，胆魄是面对压力时可参考的人物能力。\n\n内力接替原版疲劳是已选方向。移动、出招、换器与照护沿行动点核对回合机会。内力消耗与恢复、负重、成长数字以及具体结算顺序均待议。\n\n候选读法先查是否能做，再查能否命中或达成，最后分清甲损、气血、伤势和其他结果。所得阅历依人物实际承担的行动及差事记录。"},
  {"key":"talents","g":1,"parent":"","old":"天赋","new":"习武资质","rel":"改编","ref":"https://bbmod.com/wiki/read/Talents/?lang=zh","srcLabel":"Talents","scope":"按领会招意、运劲收势、身距判断、临机应变与合练接应安排修习。","root":true,"body":"习武资质记录什么容易学、哪一步需要换教法。面板属性、已习武艺与实战阅历分开看。先通过师父示范或读已有谱本领会招意，再分段练成动作，并在不同格位、不同搭档或实际差事中核实哪些情况下能用。\n\n候选五个方向用于看清教与练的难处。人物可以较快说清招意，也可能还不敢在临阵换位。普通资质的同伴可以凭分步教学、陪练和实战达到一样的习得要求。\n\n敌手专属能力归到具体组织、异兽或机关。看懂敌招可用于准备自己的应对。新的侠客武艺要各自列学习来源、条件、代价和练成的验证办法。\n\n旧版成长星级放在原版索引查。资质是否量化、课程成本、验证次数和成长上限均待定。"},
  {"key":"levels","g":1,"parent":"","old":"等级与经验","new":"历练与修为","rel":"改编","ref":"https://bbmod.com/wiki/read/Level_and_Experience/?lang=zh","srcLabel":"Level and Experience","scope":"亲历找准难题，按师承习武，凭新情境里的实际结果完成突破。","root":true,"body":"角色在差事中留下能查证的经历。先记看见了什么、扛过哪项职责、当时的限制和实到的结果。做成的能帮验证本领，失手的能指明下一课。回师或读懂谱本，再用自己的器物、站位和搭档把这一步练稳。\n\n每一门武艺分别记录受教、可试用和独立可用的范围。实做时证明确实办成了指定职责，再登记可以独立使用。擅领会招意的人与依赖陪练的人可以用不同办法达到同一要求。\n\n突破需要新处境确实改变原来的做法，并留下人物有实际贡献的结果，才可带回教者复演。学到的是一式有条件的进阶办法，如改格接护或撤约再守。其他武艺及角色的既有条件按各自记录。课时、换修、成长差距、适用上限和消耗待议。"},
  {"key":"perks","g":2,"parent":"","old":"特长","new":"武学专长","rel":"替换","ref":"https://bbmod.com/wiki/read/Perks/?lang=zh","srcLabel":"Perks","scope":"按职责练成的本领，实战可以多做一次有条件的选择。","root":true,"body":"专长来自真实承担的职责。先练基础武艺并验证能独立使用，在改变处境的差事里用上所学，随后带回实际改变的动作、受助者与结果。回师复练并通过约定的验收，才能登记专长。\n\n例如临机换班须先独立使用断位接护，练成改格接护或撤约再守，再在另一趟实战用已学的突破协助替手守住新来路。之后才可复练规定接手人、交接时机与失效分支。\n\n专长给育成的职责增加一种做法。使用前逐个核对当事人、器具、位置、可支出的行动与反应。同一触发按实际选择执行一项准备或反应，取消后的旧安排依实况处理。课时、换修与数值均待议。"},
  {"key":"skills","g":2,"parent":"","old":"技能","new":"招式","rel":"替换","ref":"https://bbmod.com/wiki/read/Skills/?lang=zh","srcLabel":"Skills","scope":"按侠客可修习武学、敌手专属招法和交手通用规则查阅。","root":true,"body":"可学武艺列怎么学、什么时候能用、怎么结算、怎么衔接、怎么拆解和代价。先在可重摆条件的演练里验收，再用实际职责证明能独立施展。见证说明后来哪项条件改变，回师复练后可取得相应变式。兵器专精按持器、实际距离和可用反应给出选择。\n\n敌手招法单独列发动者、征兆、效果、后续、拆解和敌手代价。看过敌招可带回见闻，按对应的侠客条目练应对。通用规则处理站位、视野与短时状态。行旅技记录交割、人情和行囊。"},
  {"key":"rules","g":2,"parent":"","old":"游戏机制","new":"交手与行旅规则","rel":"拆分","ref":"https://bbmod.com/wiki/read/Game_Mechanics/?lang=zh","srcLabel":"Game Mechanics","scope":"战斗、队伍和大地图的通用规则分项对照。","root":true,"body":"本章汇总交手判定、队伍供养、昼夜和市价。战场上的行动点与站位、大地图上的行军时间与补给分开记录。涉及内力、架势和世界模拟的条目仍在设计讨论。"},
  {"key":"injuries","g":2,"parent":"","old":"伤势","new":"伤势与调养","rel":"改编","ref":"https://bbmod.com/wiki/read/Injuries/?lang=zh","srcLabel":"Injuries","scope":"暂时和永久伤势分别列入本章。","root":true,"body":"战斗中的流血、失衡等状态与战后仍持续的伤势分列。暂时伤势记录恢复过程，久伤记录长期影响及适应方式。内伤、经脉受损和走火入魔属于尚待讨论的扩展。"},
  {"key":"guide","g":2,"parent":"","old":"游戏指南","new":"江湖入门","rel":"改编","ref":"https://bbmod.com/wiki/read/Game_Guide/?lang=zh","srcLabel":"Game Guide","scope":"招人、谋生、养成与交手的读者指南。","root":true,"body":"开局先看随队人物、已有武学和承诺，再检查可支撑几趟差事的口粮与药材。选差事时同时看路况、撤离机会和可能遭遇的敌手。布阵时给护卫、远手、医者安排彼此照应的位置，战后再盘点伤势、兵器和下一段行程。"},
  {"key":"rarities","g":3,"parent":"","old":"红装与传奇装备","new":"名器与传世装备","rel":"替换","ref":"https://bbmod.com/wiki/read/Named_and_Legendary_Items/?lang=zh","srcLabel":"Named and Legendary Items","scope":"名家兵器、宝甲和传世奇物的图录。","root":true,"body":"名家器物和传世奇物按来历、持有者、使用条件与去向编目。名器获得后仍可能因为交易、遗失或事件易主，追索关系留在本局记录。专属招式、磨合与稀有程度待议。"},
  {"key":"melee","g":3,"parent":"","old":"近战武器","new":"近身兵器","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh","srcLabel":"Melee Weapons","scope":"按兵器门类收录近战装备。","root":true,"body":"近身兵器按适用距离、握法和招式归档。短兵擅用贴身机会，重兵偏压迫，长柄兵器有控制来路的空间。正式分类、双持与地形限制见「兵器总谱」。"},
  {"key":"ranged","g":3,"parent":"","old":"远程武器","new":"弓弩、火器与投掷暗器","rel":"改编","ref":"https://bbmod.com/wiki/read/Ranged_Weapons/?lang=zh","srcLabel":"Ranged Weapons","scope":"弓、弩、火器和投掷分列。","root":true,"body":"弓、弩、火器、投掷暗器与战术器具分列。查用时关注准备、弹药、射界与走位条件。兵器各有出手机会及暴露代价，射程、装填和打断规则待议。"},
  {"key":"armor","g":3,"parent":"","old":"护甲","new":"衣甲与护具","rel":"改编","ref":"https://bbmod.com/wiki/read/Armor/?lang=zh","srcLabel":"Armor","scope":"承接穿戴防护，分身甲、头部与手持盾具。","root":true,"body":"衣衫、身甲、盔帽、盾具和附具按穿戴位置登记。轻装游斗、护体内功与披甲守线是候选打法。护甲耐久、防护范围与负重取舍仍需设计。"},
  {"key":"head","g":3,"parent":"","old":"头部装备","new":"头巾、斗笠与盔帽","rel":"改编","ref":"https://bbmod.com/wiki/read/Headgear/?lang=zh","srcLabel":"Headgear","scope":"承接头部装备栏。","root":true,"body":"头巾、斗笠和盔帽占原版头部装备的对应位置。词条记录防护部位、外观和可能的视野影响。斗笠与盔帽的正式数值和负重待定。"},
  {"key":"shield","g":3,"parent":"","old":"盾牌","new":"盾牌与手盾","rel":"沿用","ref":"https://bbmod.com/wiki/read/Shields/?lang=zh","srcLabel":"Shields","scope":"保留手持盾具，与空手招架分别记载。","root":true,"body":"盾牌和手盾承接手持防护器具。大盾用于护线、小盾用于随身格挡均为候选。盾面防护方向、持用限制和耐久另看盾术与装备规则。"},
  {"key":"enemies","g":4,"parent":"","old":"敌人","new":"江湖对手","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh","srcLabel":"Enemies","scope":"按出身势力和交手职责收录敌手。","root":true,"body":"对手图录按所属组织、会用的招式和承担的职责查阅。辨认负责护线、游走和远射的敌手，可以帮助队伍判断先守哪里、先应付谁。不同组织的成员层次另列。"},
  {"key":"beasts","g":4,"parent":"","old":"野兽","new":"山泽禽兽与异兽","rel":"改编","ref":"https://bbmod.com/wiki/read/Beasts/?lang=zh","srcLabel":"Beasts","scope":"野兽、异兽与特殊猎物。","root":true,"body":"山泽禽兽与异兽按栖地、活动痕迹、攻击习性和可取材料编目。山林与湿地的遭遇可有差别。具体生物、可见征兆和战利品归属待定。"},
  {"key":"undead","g":4,"parent":"","old":"亡灵","new":"古墓守卫与傀儡","rel":"替换","ref":"https://bbmod.com/wiki/read/Undead/?lang=zh","srcLabel":"Undead","scope":"拟接替亡灵遭遇和据点的敌群。","root":true,"body":"古墓守卫与傀儡是原版亡灵遭遇的武侠对应草案。可编入古墓甲卫、披甲墓傀和驭傀人，按护卫、控制与牵制分工。世界观如何解释此类对手尚待选择。"},
  {"key":"orcs","g":4,"parent":"","old":"兽人","new":"重装山寨战帮","rel":"替换","ref":"https://bbmod.com/wiki/read/Orcs/?lang=zh","srcLabel":"Orcs","scope":"拟接替兽人敌群的重装战帮。","root":true,"body":"重装山寨战帮对应原版兽人阵容。山寨新卒、重装悍卒、狂徒与寨主可分别承担不同职责。山寨联军属于另一个时局条目。"},
  {"key":"goblins","g":4,"parent":"","old":"地精","new":"奇门伏兵","rel":"替换","ref":"https://bbmod.com/wiki/read/Goblins/?lang=zh","srcLabel":"Goblins","scope":"拟接替地精敌群的伏击、机关与游斗对手。","root":true,"body":"奇门伏兵对应原版地精敌群，经由伏弩、游走以及机关形成站位压力。编写遭遇时可给出踪迹、地形和伏兵之间的照应。骑手和术士的具体动作待定。"},
  {"key":"origins","g":5,"parent":"","old":"起源","new":"江湖开局","rel":"改编","ref":"https://bbmod.com/wiki/read/Origins/?lang=zh","srcLabel":"Origins","scope":"每次开局都是一场独立战役。玩家以江湖领队身份出发，各起源记录队伍的来历、初始成员和开局处境。","root":true,"body":"玩家每次以江湖领队展开一场独立战役。起源记录初始队伍、已有物资、人情和开局麻烦。\n\n五个候选开局各有处境。威远镖局接护送差事，靖夜司暗桩受托追查，无常鬼市经手情报或黑市交易，残剑门遗孤寻找同门与栖身处，黑风寨草寇在避难、结义和生计之间取舍。名称、开局人数及能否掌管整个组织尚待确定。\n\n逐条索引里还有沿原版起源拟名的对照草案。"},
  {"key":"retinue","g":5,"parent":"","old":"随从","new":"随行行家","rel":"改编","ref":"https://bbmod.com/wiki/read/Retinue/?lang=zh","srcLabel":"Retinue","scope":"编制之外的帮手及行旅后勤。","root":true,"body":"随行行家提供队伍后勤、探路、疗伤、修缮与消息。举凡郎中、铁匠、说书人与账房，均可记录职责、聘用条件和可提供的帮助。是否随队参战或占用名额待议。"},
  {"key":"ambitions","g":5,"parent":"","old":"战团抱负","new":"江湖志向","rel":"替换","ref":"https://bbmod.com/wiki/read/Ambitions/?lang=zh","srcLabel":"Ambitions","scope":"队伍主动追求的阶段目标。","root":true,"body":"江湖志向是队伍主动选取的阶段目标，可围绕保住同行者、挣回字号、见识高手或设擂展开。完成条件、奖励及能否中途改换待讨论。"},
  {"key":"towns","g":6,"parent":"","old":"城镇","new":"城镇与集市","rel":"改编","ref":"https://bbmod.com/wiki/read/Category:Settlements/?lang=zh","srcLabel":"Category:Settlements","scope":"城镇、设施与地方生活的入口。","root":true,"body":"城镇汇集补给、差事、人物与传闻。客栈、药铺、工坊和集市可按地方条件出现。镇上的灾情、商路与势力关系可改变今天能办到的事。"},
  {"key":"factions","g":6,"parent":"","old":"势力与关系","new":"江湖势力与交情","rel":"改编","ref":"https://bbmod.com/wiki/read/Factions_and_Relations/?lang=zh","srcLabel":"Factions and Relations","scope":"组织关系、个人口碑与江湖名望各有归属。","root":true,"body":"组织条目记录据点、人手、活动、交情与各自利益。已有门派仍在江湖活动，同行者可以各有师承。未被玩家选择的组织自行办事是设计目标，自治范围待议。"},
  {"key":"landmarks","g":6,"parent":"","old":"传奇地点","new":"江湖秘境","rel":"替换","ref":"https://bbmod.com/wiki/read/Legendary_locations/?lang=zh","srcLabel":"Legendary locations","scope":"原传奇地点的探索、相遇与遗物位置。","root":true,"body":"秘境条目可串联线索、入口、环境、守卫和遗物归属。残图、物证或故人指引皆可作为候选入口。是否能多次进入、谁会先到与失败分支各项待议。"},
  {"key":"places","g":6,"parent":"","old":"地点","new":"山川据点","rel":"改编","ref":"https://bbmod.com/wiki/read/Category:Locations/?lang=zh","srcLabel":"Category:Locations","scope":"野外地点、营地及城外附属设施。","root":true,"body":"山川据点收录野外营寨、驿站、关隘和镇外产业。应记可达路线、占据者、物资或事件关联，以便同一地点承担不同差事。"},
  {"key":"contracts","g":7,"parent":"","old":"委托","new":"江湖委托","rel":"改编","ref":"https://bbmod.com/wiki/read/Contracts/?lang=zh","srcLabel":"Contracts","scope":"保人、押送、寻人、讨物等有雇主的差事。","root":true,"body":"委托需说明雇主、目标、可见风险、期限、酬银和交割对象。护人、取物、追查与押运应分别记录何为完成。中途插曲可以改变同一差事的走向。"},
  {"key":"events","g":7,"parent":"","old":"事件（总览）","new":"江湖际遇","rel":"改编","ref":"https://bbmod.com/wiki/read/Events/?lang=zh","srcLabel":"Events","scope":"事件总览，按触发来源分组。原版另设同名分类目录。","root":true,"body":"江湖际遇按出身、性情、开局、时局、委托和行旅触发归档。每条应写明前因、可见线索、选项、即时结果、后续处置与结束条件，让同一批人和物在后续事件中能够对得上。\n\n保留的桥段候选包括坠崖搜救、雨夜破庙、废功重修、金盆洗手、比武招亲、高手留命、临阵顿悟、伤后重练、火器冲击、黑店投宿、怀璧其罪和茶馆说书。触发、收益与处罚待议。"},
  {"key":"eventIndex","g":7,"parent":"","old":"事件（分类目录）","new":"江湖际遇索引","rel":"并入","ref":"https://bbmod.com/wiki/read/Category:Event/?lang=zh","srcLabel":"Category:Event","scope":"分类目录指向同一批江湖际遇。","root":true,"body":"按出身、性情、时局、委托、开局和行旅见闻查阅同一批际遇。若一件事同时关联多类，保留同一正文，供相应系统共同索引。"},
  {"key":"craft","g":8,"parent":"","old":"制作","new":"百工制作","rel":"改编","ref":"https://bbmod.com/wiki/read/Crafting/?lang=zh","srcLabel":"Crafting","scope":"材料、配方以及制成品的归属。","root":true,"body":"百工制作把奇材、用途、工匠与产物连起来。配方应说明用料从何来、由谁操作、成品放在哪一类及材料怎么扣除。配方和数量待议。"},
  {"key":"trophies","g":8,"parent":"","old":"战利品","new":"奇材与战利品","rel":"改编","ref":"https://bbmod.com/wiki/read/Trophies/?lang=zh","srcLabel":"Trophies","scope":"原生物掉落和战获材料。","root":true,"body":"战利品按出处、用途和归属编目。异兽奇材可交工匠处理，器物或财货可牵涉交割和人物关系。获取条件和掉落数量待定。"},
  {"key":"workshop","g":8,"parent":"","old":"剥制工坊","new":"百工坊","rel":"替换","ref":"https://bbmod.com/wiki/read/Taxidermist/?lang=zh","srcLabel":"Taxidermist","scope":"承接原剥制工坊的材料委加工入口。","root":true,"body":"百工坊承接加工与修缮，可按工匠、器具、材料和地点提供服务。拟由坊中用奇材制护具等用品，费用和配方须逐项确定。"},
  {"key":"consumables","g":8,"parent":"","old":"消耗品","new":"药散、行粮与用具","rel":"改编","ref":"https://bbmod.com/wiki/read/Category:Consumable/?lang=zh","srcLabel":"Category:Consumable","scope":"承接消耗品目录，按使用场合归类。","root":true,"body":"行囊消耗品按行旅补给、战斗用具、修缮和医疗区分。使用条目应说明何时可用、由谁使用、消耗与补充方式。上限及可否叠加待定。"},
  {"key":"headstat","g":1,"parent":"attributes","old":"头部护甲","new":"头部护甲","rel":"沿用","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Head_Armor","srcLabel":"Attributes","scope":"头巾、斗笠、盔帽等头具的防护与当前耐久。","root":false,"body":"头部护甲记录被打到头部时可用的防护。装备可显示护及范围、当前耐久和上限，以及能辨认的视野影响。","attribute":{"sections":[{"title":"记录口径","body":"头部护甲记录被打到头部时可用的防护。装备可显示护及范围、当前耐久和上限，以及能辨认的视野影响。"},{"title":"来源与变化","body":"由实际穿戴的头具与相关附具提供。受击、修缮、换帽和环境影响分别记。轻布头具和闭面甲盔可呈现不同的遮护与佩戴取舍。"},{"title":"判定与提示","body":"已命中头部时读取此处的部位防护，分别记录头具损耗、残余伤害及后续状态。身体护甲和盾术按它们对应的部位与条件处理。"},{"title":"交手示例","body":"斥候为进风口戴上宽檐铁笠。遇迎头招式时查头部防护，读远旗时再看帽檐与地势怎样影响观察。"},{"title":"待定规则","body":"头部减伤、耐久到临界点时如何变化、配件是否并入、视野修正及头部伤势待议。"}],"related":["headchance","bodystat","vision","armor"]}},
  {"key":"bodystat","g":1,"parent":"attributes","old":"身体护甲","new":"身体护甲","rel":"沿用","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Body_Armor","srcLabel":"Attributes","scope":"衣衫、内甲、外甲和附具在身体部位提供的防护。","root":false,"body":"身体护甲记录躯干衣甲能承受多少冲击及还能使用到什么程度。候选面板显示衣甲耐久、覆盖和穿戴负担，持盾或内功护体另有入口。","attribute":{"sections":[{"title":"记录口径","body":"身体护甲记录躯干衣甲能承受多少冲击及还能使用到什么程度。候选面板显示衣甲耐久、覆盖和穿戴负担，持盾或内功护体另有入口。"},{"title":"来源与变化","body":"来自实际穿着与适配的附具。防护损耗随受到的攻击或使用条件变动，营地小修和工坊维修可按材料、时间及归属记录。"},{"title":"判定与提示","body":"命中身体时读取当时的耐久和护甲。候选从本次威力与穿甲关系算损甲和气血实伤。更换衣甲后重新评估披挂对行动、先手与内力的影响。"},{"title":"交手示例","body":"护卫身甲受了两记重打，已需要退位。轻装同伴可以顶住一侧并护他后撤。休整时再考虑用修料补甲还是请工坊。"},{"title":"待定规则","body":"不同甲种的防护、甲损阈值、附具组合、重量关系和护体内功叠加顺序待议。"}],"related":["headstat","penetr","ap","wear"]}},
  {"key":"hp","g":1,"parent":"attributes","old":"生命值","new":"气血","rel":"改编","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Hitpoints","srcLabel":"Attributes","scope":"气血的当前值、上限与受创后的处理。","root":false,"body":"气血记人物还能承受的伤害。面板可分列当前气血与上限。一次交手还可能留下流血、眩晕或需要养伤的创口，这些状态和伤势各自记录。","attribute":{"sections":[{"title":"记录口径","body":"气血记人物还能承受的伤害。面板可分列当前气血与上限。一次交手还可能留下流血、眩晕或需要养伤的创口，这些状态和伤势各自记录。"},{"title":"来源与变化","body":"人物基础决定初始储备。招式造成的实伤、已触发的持续伤害和恢复可改变当前值。是否有武学、伤势或长途劳顿改变上限待议。"},{"title":"判定与提示","body":"命中后，先算本次穿过防护的实际伤害，再更新气血。若另有流血，按状态注明后续何时结算。气血耗尽时进入何种濒死或败退流程仍待定。"},{"title":"交手示例","body":"桥口护卫的身甲尚存，气血却已因先前伤势低落。领队可改由盾手接位，先给伤员留出撤格。队伍能否继续护货要另看剩余人手。"},{"title":"待定规则","body":"初始气血、恢复速度、濒死与死亡的分支、临阵照护能改变哪些结果均待议。"}],"related":["bodystat","damage","injuries","ap"]}},
  {"key":"ap","g":1,"parent":"attributes","old":"行动点","new":"行动点","rel":"沿用","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Action_Points","srcLabel":"Attributes","scope":"每回合可用于移动、出招、换器和支援的行动额度。","root":false,"body":"行动点回答这回合还来得及做几步。面板可并列回合可用额度、剩余点数与已选动作的花费。需要内力或随身用具的招式同时核其他条件。","attribute":{"sections":[{"title":"记录口径","body":"行动点回答这回合还来得及做几步。面板可并列回合可用额度、剩余点数与已选动作的花费。需要内力或随身用具的招式同时核其他条件。"},{"title":"来源与变化","body":"回合开始按角色当前处境给出可用额度。走位、持器、照护和取物各按动作收费。减速、失衡与地势可能改变可用额度或动作成本，选择哪一种处理仍待议。"},{"title":"判定与提示","body":"候选预览先列通行路径和牵制，再同时列出选中动作的行动与内力开销。换位时双方按各自实际动作记账。被中断后是否退还，以及未用行动能否转成反应，仍待议。"},{"title":"交手示例","body":"医者已经走到伤员旁，剩余行动不足以这回合再完成照护。先记到达位置与剩余额度，领队可让近旁护卫接应，等下一回合再照护。"},{"title":"待定规则","body":"基础额度、地形费率、等待与反应的占用、动作取消后的返还条件待定。"}],"related":["fatigue","initiative","zoc","combat"]}},
  {"key":"fatigue","g":1,"parent":"attributes","old":"疲劳","new":"内力","rel":"替换","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Fatigue","srcLabel":"Attributes","scope":"内力及其预留、消耗、回气和气竭时的可行动作。","root":false,"body":"内力是交手中的当前储备。面板同时列内力上限、当前内力及起手已锁的用气。行动、反应、内力和伤势各自结算。","attribute":{"sections":[{"title":"记录口径","body":"内力是交手中的当前储备。面板同时列内力上限、当前内力及起手已锁的用气。行动、反应、内力和伤势各自结算。"},{"title":"来源与变化","body":"角色能用入门整息，也可以学习专门内功。不同用法要求原地收息、有掩护地行进或在接触后选择运劲。回师突破需要带回实际结果，取得的是另一种有条件的用法。"},{"title":"判定与提示","body":"照招法写明的时点锁气和扣气。开始前取消可解锁尚未实花的份额。回气须完成本法条件，每人同一时间维持一项。气不足仍可检查基于行动与站位的普通选择。"},{"title":"交手示例","body":"守桥的枪手已经耗气截过来敌。接替者就位后，枪手可以自己退至稳格整息，或在有两处路标和护哨时用雁签行息。后者到第二签才恢复，途中失去掩护按中断记。"},{"title":"待定规则","body":"候选时点见内功与身法正文。每式具体耗气、回气量、上限和负重分界仍待调校。"}],"related":["ap","initiative","resolve","skills"]}},
  {"key":"morale","g":1,"parent":"attributes","old":"士气","new":"战意","rel":"改编","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Morale","srcLabel":"Attributes","scope":"临阵当前的状态，随威胁、伤亡、站位和支援变化。","root":false,"body":"战意记录这一刻能否稳住、愿不愿意接战和能否照计划撤离。可见表现包括维持守位、动摇后求援或转向撤退，正式分档待定。","attribute":{"sections":[{"title":"记录口径","body":"战意记录这一刻能否稳住、愿不愿意接战和能否照计划撤离。可见表现包括维持守位、动摇后求援或转向撤退，正式分档待定。"},{"title":"来源与变化","body":"同行者失位、目击重伤、多人压阵、听见可核的应声等可触发变化。只把人物能够察觉的事用于提示。胆魄可影响应对，长期忠义、小队关系各自保留。"},{"title":"判定与提示","body":"候选在状态变化时写清直接来由、可能受限的行动和可用的稳住机会。小队多次受同一恐吓时是否要限制连锁检查仍须讨论。"},{"title":"交手示例","body":"回湾镖队过窄桥，盾手受压而身后的医者仍能看见退格。领队可叫同袍应声、换人护线或先撤一格。之后按当事人实际经历更新战意。"},{"title":"待定规则","body":"正式档位、临界状态能否拒绝进攻或自行后撤、助援能传多远、战后如何回稳待议。"}],"related":["resolve","mood","surround","effects"]}},
  {"key":"resolve","g":1,"parent":"attributes","old":"意志","new":"胆魄","rel":"改编","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Resolve","srcLabel":"Attributes","scope":"人物面对威吓、伤亡和包围时的承压能力。","root":false,"body":"胆魄是人物能否稳住阵脚的一项能力，可用于核对与威吓、伤亡和接近险位有关的战意变化。人物当下战意、日常心境和长期人情各有状态。","attribute":{"sections":[{"title":"记录口径","body":"胆魄是人物能否稳住阵脚的一项能力，可用于核对与威吓、伤亡和接近险位有关的战意变化。人物当下战意、日常心境和长期人情各有状态。"},{"title":"来源与变化","body":"出身可提供特定经历，训练与屡次承担职责可积累抗压表现。性情、已见威胁和同伴应声如何影响本次胆魄检查，需避免重复计入同一事由。"},{"title":"判定与提示","body":"候选在可见威胁实际发生时判一次承压，把胆魄、附近可见同伴和当前战意分栏提示。一次威吓失败后的表现由战意条目另行说明。"},{"title":"交手示例","body":"一位往日勇敢的枪手在已伤同伴倒下后需要重新稳住。虽然胆魄可作为优势，是否愿继续守还是先看退路、旁援与本次压力。"},{"title":"待定规则","body":"基础值、同类难题的适应幅度、领队鼓舞、阈值和触发频率待议。"}],"related":["morale","mood","surround","traits"]}},
  {"key":"initiative","g":1,"parent":"attributes","old":"先攻","new":"身法先手","rel":"改编","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Initiative","srcLabel":"Attributes","scope":"决定谁更早取得当前回合的行动时机。","root":false,"body":"身法先手表示在一轮交手里更早取得行动的倾向。可显示当前顺序、已行动者，以及某个等待或提气动作对顺序的可能影响。移动能走多远与出手需要几步另查。","attribute":{"sections":[{"title":"记录口径","body":"身法先手表示在一轮交手里更早取得行动的倾向。可显示当前顺序、已行动者，以及某个等待或提气动作对顺序的可能影响。移动能走多远与出手需要几步另查。"},{"title":"来源与变化","body":"基础身法、状态、负重和特殊招式可以成为候选来源。装备改变顺序时，要列出是披甲、持器还是当时受制。"},{"title":"判定与提示","body":"候选预览列本轮次序与会触发的待定反应。先行动的人要自己支付走位和出招的费用。拦截、还击或照应插在何时仍由反应规则决定。"},{"title":"交手示例","body":"侧掠客抢在重刀之前站住侧格，想给医者留一条路。能否移入仍要检查牵制。站到之后剩几个行动再决定要不要出手。"},{"title":"待定规则","body":"同先手如何排、等待是否重新排序、装备与气血状态的修正、回合中可否改变次序待议。"}],"related":["ap","fatigue","zoc","vision"]}},
  {"key":"accme","g":1,"parent":"attributes","old":"近战命中","new":"近身准头","rel":"改编","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Melee_Skill","srcLabel":"Attributes","scope":"近身兵器、拳脚和可及长兵招式的命中能力。","root":false,"body":"近身准头回答一次可达的近身攻击比较容易打到谁。适用拳脚、刀剑及够得到的长兵招式。落点合法、是否可挥动及命中后的威力各有校验。","attribute":{"sections":[{"title":"记录口径","body":"近身准头回答一次可达的近身攻击比较容易打到谁。适用拳脚、刀剑及够得到的长兵招式。落点合法、是否可挥动及命中后的威力各有校验。"},{"title":"来源与变化","body":"人物基础、实际熟习的兵器、招式手法及短时状态都可参与。距离和高低差的影响需区分是禁用还是改变命中。"},{"title":"判定与提示","body":"候选先确认目标、用器与可及格，再将攻击者的准头与防守者的近身防御对照。有合围、守势或露隙时说明来源和有效时段。"},{"title":"交手示例","body":"剑客正面刺过去会遇到守中回锋的防线。队友若先牵开站位，剑客可以改从侧格出手，目标的防守和距离按改后位置重看。"},{"title":"待定规则","body":"近身命中式、长兵隔人、合围与被围修正、招架在命中前后哪一步参与待议。"}],"related":["defme","dmgstat","hitchance","zoc"]}},
  {"key":"accra","g":1,"parent":"attributes","old":"远程命中","new":"远射准头","rel":"改编","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Ranged_Skill","srcLabel":"Attributes","scope":"弓弩、火铳和投掷类招式的远射命中能力。","root":false,"body":"远射准头用于判断一次有合法射线的攻击能否命中。能看见敌人、武器射程够和实际射线通得过，分别在出手前核。","attribute":{"sections":[{"title":"记录口径","body":"远射准头用于判断一次有合法射线的攻击能否命中。能看见敌人、武器射程够和实际射线通得过，分别在出手前核。"},{"title":"来源与变化","body":"人物基础、兵器、装填完成、瞄准时间及稳定站位可形成候选修正。弓、弩、暗器和火器在精熟度与射程上如何分列待议。"},{"title":"判定与提示","body":"候选先在地图标射界、射程和遮挡，符合出手条件时再把准头与远射防御比较。需要弹药的动作实际出手后如何扣除由该招式说明。"},{"title":"交手示例","body":"弩手知道桥后有敌，也看见靠前的盾手遮住自己一线。先换到另一个射点，按新格的高低差、可见性和备发状态重判能否发矢。"},{"title":"待定规则","body":"距离衰减、近距远射、友军遮挡、弹药消耗和投掷是否用同一副公式待议。"}],"related":["defra","vision","hitchance","height"]}},
  {"key":"defme","g":1,"parent":"attributes","old":"近战防御","new":"近身防御","rel":"沿用","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Melee_Defense","srcLabel":"Attributes","scope":"面对近身出手时的人物防守能力。","root":false,"body":"近身防御描述人物在刀剑、拳脚与长兵可及范围内应付直接攻击的能力。用来讨论近距离的身法、主动招架与站位带来的差异。","attribute":{"sections":[{"title":"记录口径","body":"近身防御描述人物在刀剑、拳脚与长兵可及范围内应付直接攻击的能力。用来讨论近距离的身法、主动招架与站位带来的差异。"},{"title":"来源与变化","body":"人物基础、训练、盾术、是否有稳定站位及当前牵制可提供候选影响。某种影响若已经在命中流程计入，应标注去重。"},{"title":"判定与提示","body":"候选可把近身防御作为命中对照，再看主动守势另给应对，或把两者放到合并判定。需要说明防御变化来自哪些实际状态、护甲何时介入。"},{"title":"交手示例","body":"持枪者能稳守正面，侧面受人逼近后可选回枪护后。若他转交一次反应机会，原来的正面拦截也要相应更新。"},{"title":"待定规则","body":"招架与闪避是否独立、盾与空手的适用范围、防御与架势和合围怎样组合待议。"}],"related":["accme","headstat","bodystat","surround"]}},
  {"key":"defra","g":1,"parent":"attributes","old":"远程防御","new":"远射防御","rel":"沿用","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Ranged_Defense","srcLabel":"Attributes","scope":"面对箭矢、弩、火器和远投时的人物防守能力。","root":false,"body":"远射防御描述人物应付已经具备合法射线的远攻。地形能不能遮断射线、盾遮住哪边与人物是否及时换位，需要在同一条件里看清。","attribute":{"sections":[{"title":"记录口径","body":"远射防御描述人物应付已经具备合法射线的远攻。地形能不能遮断射线、盾遮住哪边与人物是否及时换位，需要在同一条件里看清。"},{"title":"来源与变化","body":"人物基础、观察反应、护住一侧的盾、掩蔽和高低差均有影响候选。硬遮挡从是否能开射的检查来处理。部分遮挡如何修正仍待议。"},{"title":"判定与提示","body":"候选在射线成立后，根据人物防守、位置和已能辨认的来路结算。需要分别展示遮挡、盾面及防守属性，避免同一遮挡算两次。"},{"title":"交手示例","body":"游斗者与支盾同伴走过一段开阔路。侧面出现弩手后可离开原指定受护位置，换到实有遮挡的一格。之后射线及防御按新条件处理。"},{"title":"待定规则","body":"硬遮挡和可射掩体、盾的防护范围、格挡是否独立、地势作用及友军影响待议。"}],"related":["accra","vision","headstat","shieldskills"]}},
  {"key":"dmgstat","g":1,"parent":"attributes","old":"伤害","new":"招式威力","rel":"改编","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Damage","srcLabel":"Attributes","scope":"命中后，这一招有多少伤害潜力及可能带来的后续作用。","root":false,"body":"招式威力表示命中后用于计算护具损耗和人物受伤的攻击量。候选分别记武器基础、招式改变的部分，以及可能加上的状态效果。","attribute":{"sections":[{"title":"记录口径","body":"招式威力表示命中后用于计算护具损耗和人物受伤的攻击量。候选分别记武器基础、招式改变的部分，以及可能加上的状态效果。"},{"title":"来源与变化","body":"兵器及其使用条件、实际习得的招式、是否已蓄势、所处位置和当前异常状态可能影响威力。适用哪些增减由具体招式说明。"},{"title":"判定与提示","body":"先确认命中和部位，再让威力、破甲效力与该部位的防护共同决定损甲与实伤。流血、失衡等效果按招式触发条件另记。"},{"title":"交手示例","body":"重锤已起手，目标移开时这次击打可能打空。有命中的情况下再按落点部位计甲损及后续冲击。动作被打断要另外记录。"},{"title":"待定规则","body":"武器威力区间、技能成长比例、为何触发追加创伤以及怎么叠加护体待议。"}],"related":["accme","penetr","headchance","damage"]}},
  {"key":"penetr","g":1,"parent":"attributes","old":"破甲效率","new":"破甲效力","rel":"沿用","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Effectiveness_vs._Armor","srcLabel":"Attributes","scope":"攻击越过护甲的能力，与损伤护甲本身的程度分列。","root":false,"body":"破甲效力是武侠栏对原版破甲效率的对应。候选把护甲耐久被打掉多少称为损甲，把最终越过护具作用于气血的能力称为穿甲。","attribute":{"sections":[{"title":"记录口径","body":"破甲效力是武侠栏对原版破甲效率的对应。候选把护甲耐久被打掉多少称为损甲，把最终越过护具作用于气血的能力称为穿甲。"},{"title":"来源与变化","body":"兵器的使法、命中部位、实际护甲类型和当前防护状态可决定结果。钝击压甲和刺击穿甲可以表现出不同取舍。"},{"title":"判定与提示","body":"同一次打击应显示用到的部位、甲具耐久损失和气血结果。是否按穿透比例、部位标签或者两段处理，仍待规则比较。"},{"title":"交手示例","body":"一记重锤令身体护甲变得松动，另一种刺击则可能留下气血损伤而护具磨损较少。两个结果都能从当次结算的明细看到。"},{"title":"待定规则","body":"正式术语、穿甲和损甲是否设各自属性、对无甲目标的算法以及盾的承力待议。"}],"related":["dmgstat","bodystat","headstat","damage"]}},
  {"key":"headchance","g":1,"parent":"attributes","old":"命中头部概率","new":"头部命中几率","rel":"沿用","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Chance_to_hit_head","srcLabel":"Attributes","scope":"已命中后分配到头部的机会，随后使用相应护甲。","root":false,"body":"头部命中几率描述一次命中落在头部的可能。候选先区分普通攻击的部位抽取和明确攻上盘的招法。若同时有两种流程，要在招式上标明。","attribute":{"sections":[{"title":"记录口径","body":"头部命中几率描述一次命中落在头部的可能。候选先区分普通攻击的部位抽取和明确攻上盘的招法。若同时有两种流程，要在招式上标明。"},{"title":"来源与变化","body":"兵器形制、动作方向、目标能否遮护头部和地势差是候选修正。盔帽对命中机会的作用以及与承伤是否拆开待议。"},{"title":"判定与提示","body":"候选按命中、命中部位、部位防护顺次显示。若一招指定头部，就按该招的合法目标及抵挡条件结算。身体护甲按其自身耐久保留。"},{"title":"交手示例","body":"比试者亮出迎头劈斩，守方知道威胁在上方，可以护头或退开。若最后打中头部，结算查头具并另看是否触发失衡。"},{"title":"待定规则","body":"普通头部权重、定向攻击代价、不同身高地势及头部命中与伤势怎样连动待议。"}],"related":["headstat","bodystat","defme","damage"]}},
  {"key":"vision","g":1,"parent":"attributes","old":"视野","new":"视野","rel":"沿用","ref":"https://bbmod.com/wiki/read/Attributes/?lang=zh#w-Vision","srcLabel":"Attributes","scope":"能看到哪些格、人和起手征兆，受遮挡、地势和照明影响。","root":false,"body":"视野负责交手中的可见信息。可显示亲眼看见的格、遮挡后最后见到的位置，以及由同伴来报的记录。实际能否发矢还要看射线和射程。","attribute":{"sections":[{"title":"记录口径","body":"视野负责交手中的可见信息。可显示亲眼看见的格、遮挡后最后见到的位置，以及由同伴来报的记录。实际能否发矢还要看射线和射程。"},{"title":"来源与变化","body":"人物感知、头具、夜色、烟幕、地形高低和行军侦察可分别参与候选规则。地图上听到的传闻应带为谁所见、何时所见。"},{"title":"判定与提示","body":"候选在改变位置或生成烟幕时重算所见，射线受挡时提示是哪一段。若信息由队友传来，需要显示是否真实可从自己所在格出手。"},{"title":"交手示例","body":"烟幕刚遮住桥口时，弩手记得敌人最后在哪，但当前格已看不见。可等烟散、择侧换点或由近旁同伴继续守出口。"},{"title":"待定规则","body":"个人和队伍视野怎么共享、烟及夜的衰减、遮挡格边界及大地图侦察与交手的对应待议。"}],"related":["accra","defra","headstat","height"]}},
  {"key":"combatxp","g":1,"parent":"levels","old":"战斗经验","new":"实战阅历","rel":"改编","ref":"https://bbmod.com/wiki/read/Level_and_Experience/?lang=zh#w-Combat_XP","srcLabel":"Level and Experience","scope":"记录当事人实做的职责与结果，用来选择课程、验证本领和回师突破。","root":false,"body":"一次差事始终依实际人、物、地点与动作记录。分别注明当事人做了哪一步、谁能见证、有没有保护到原先答应的人。如有人只亲眼看见，可以把消息带回去问师。\n\n练熟同一路上的动作，可以继续稳定已知用法。突破查实际变化是否改变了走法、所需支援或出手条件，并追问有没有达成眼下职责。战斗败退也可能有做成的撤守、送医与交接。\n\n按每位伙伴的动作和其目标记录贡献。不同人能各自留下真实经历，一件货的签收或一个人的去向仍用同一份事实。证据保留周期、何时复核、怎样合并同类情境待议。"},
  {"key":"mastery","g":2,"parent":"perks","old":"第 4 层兵器精通","new":"兵器专精","rel":"改编","ref":"https://bbmod.com/wiki/read/Perks/?lang=zh#w-Tier_4","srcLabel":"Perks","scope":"按实际持器、握法和交手结果取得，写清新的出手条件和旧机会。","root":false,"body":"兵器专精记录侠客用某一类器具练成的用法。经师父初授与真实场面确认后，再解决一次会改变原走法、装填、收势或退路的难题，回师复练。武艺熟习、适配器具与当前持有分别核对。\n\n例如同样需要护队通过，枪矛专精能让下一柄枪接守来路，戟镗专精则能在旧落格被占时换一个牵引备位。二者各用实际所持、能看到的格与已准备的动作。\n\n换器、双持、受制和负重都会改变这次能做的选择，专精随适用条件开启。正式兼容名单、器种入选条件与实际开销尚待议。名器还有依自己来历与磨合才能用的变式。"},
  {"key":"armskills","g":2,"parent":"skills","old":"武器技能","new":"兵器招式","rel":"替换","ref":"https://bbmod.com/wiki/read/Skills/?lang=zh#w-Weapon_Skills","srcLabel":"Skills","scope":"","root":false,"body":"兵器招式记录一件兵器能提供的动作，例如用枪矛拦截接近、以棍杖掩护同伴。攻击距离、出手条件、留给对手的反应机会和耗用资源需逐项明确。"},
  {"key":"shieldskills","g":2,"parent":"skills","old":"盾牌技能","new":"盾术","rel":"替换","ref":"https://bbmod.com/wiki/read/Skills/?lang=zh#w-Shield_Skills","srcLabel":"Skills","scope":"","root":false,"body":"盾术覆盖举盾、护住同伴、推挡等候选用法。盾具保护方向、相邻同伴是否受益及被牵制后的效果待议。持盾与空手招架分别记载。"},
  {"key":"racialskills","g":2,"parent":"skills","old":"种族技能","new":"敌派与异兽招法","rel":"替换","ref":"https://bbmod.com/wiki/read/Skills/?lang=zh#w-Racial_Skills","srcLabel":"Skills","scope":"按专属发动者、可见征兆、条件、效果、后手和拆法查阅。","root":false,"body":"奇门前哨先试枪，游斗者再用自己的行动争退格。机关与异兽的招法也要满足各自的站位和场景条件。玩家可以观察、拆解和复盘，在营地把经核实的经历用作对应武艺的修习素材。\n\n随行动物、器物和军械的原版动作可按原版索引里的归属查阅。"},
  {"key":"perkskills","g":2,"parent":"skills","old":"特长技能","new":"专长解锁招式","rel":"替换","ref":"https://bbmod.com/wiki/read/Skills/?lang=zh#w-Perk_Skills","srcLabel":"Skills","scope":"","root":false,"body":"部分专长可解锁主动动作。候选包括调息、换位、脱身步和临阵振气。每项应写清前提、有效目标、行动开销和被牵制时能否使用。"},
  {"key":"traitskills","g":2,"parent":"skills","old":"特性技能","new":"身份招式","rel":"替换","ref":"https://bbmod.com/wiki/read/Skills/?lang=zh#w-Trait_Skills","srcLabel":"Skills","scope":"","root":false,"body":"身份招式来自人物过往经历或特性，例如驯兽、擂台习惯或特定身份带来的动作。使用约束及其能否经学习获得，由各条设定。"},
  {"key":"effects","g":2,"parent":"skills","old":"状态效果","new":"交手状态","rel":"改编","ref":"https://bbmod.com/wiki/read/Status_Effects/?lang=zh","srcLabel":"Status Effects","scope":"","root":false,"body":"交手状态记录短时变化，如出血、受制、失衡或掩护。词条应交代来源、可见提示、持续时间、叠加及解除方式，并注明哪些变化会留下战后伤势。"},
  {"key":"combat","g":2,"parent":"rules","old":"战斗机制","new":"六角格交手","rel":"沿用","ref":"https://bbmod.com/wiki/read/Combat_Mechanics/?lang=zh","srcLabel":"Combat Mechanics","scope":"","root":false,"body":"沿六角格安排距离、朝向与彼此照应，前排可占住来路，游斗者可牵开敌阵，为医者和远手留出工作空间。突围、救援与护送是可讨论的战斗目标，阵法的成立与瓦解待议。"},
  {"key":"hitchance","g":2,"parent":"rules","old":"命中率","new":"命中判定","rel":"沿用","ref":"https://bbmod.com/wiki/read/Hit_Chance/?lang=zh","srcLabel":"Hit Chance","scope":"","root":false,"body":"命中判定须解释准头、距离、掩护、地势和目标防御如何共同作用。招架与闪避是否作为独立判定，以及破绽何时参与，属于尚未决定的结算顺序。"},
  {"key":"damage","g":2,"parent":"rules","old":"伤害","new":"伤害结算","rel":"沿用","ref":"https://bbmod.com/wiki/read/Damage/?lang=zh","srcLabel":"Damage","scope":"","root":false,"body":"伤害条目应能解释一次命中如何分别影响气血、护甲和伤势。头身部位、护体内功与架势是否进入同一顺序，破架会留下怎样的机会，均待讨论。"},
  {"key":"difficulty","g":2,"parent":"rules","old":"难度设置","new":"江湖难度","rel":"沿用","ref":"https://bbmod.com/wiki/read/Game_Mechanics/?lang=zh#w-Difficulty_levels","srcLabel":"Game Mechanics","scope":"","root":false,"body":"难度可从补给压力、敌人构成、线索质量和失败代价等方面讨论。设置项需让领队知道开局承担哪些变化。档位名称、影响范围以及中途能否调整待定。"},
  {"key":"upkeep","g":2,"parent":"rules","old":"薪水与食物补给","new":"酬银与口粮","rel":"改编","ref":"https://bbmod.com/wiki/read/Game_Mechanics/?lang=zh#w-Upkeep_and_Food_Supply","srcLabel":"Game Mechanics","scope":"","root":false,"body":"酬银记与同伴约定的报酬，口粮记队伍消耗，任务分红可单列。若采用期限或固定账期，词条应写明约定及到期结果。支付节奏和欠付影响待定。"},
  {"key":"mood","g":2,"parent":"rules","old":"心情","new":"同伴心境","rel":"改编","ref":"https://bbmod.com/wiki/read/Game_Mechanics/?lang=zh#w-Mood","srcLabel":"Game Mechanics","scope":"","root":false,"body":"同伴心境体现伤亡、履约、分配和人情带来的日常变化。心境如何影响修炼或专注属于候选。关系与承诺另记，临阵战意另有判定。"},
  {"key":"daytime","g":2,"parent":"rules","old":"昼夜时间","new":"昼夜行旅","rel":"沿用","ref":"https://bbmod.com/wiki/read/Game_Mechanics/?lang=zh#w-Daytime","srcLabel":"Game Mechanics","scope":"","root":false,"body":"昼夜影响行路、观察和地方活动。夜行可能便于隐蔽，也可能使侦察和照应更困难。时间推进、照明与城镇作息如何联动待议。"},
  {"key":"scaling","g":2,"parent":"rules","old":"敌军规模与构成","new":"遭遇规模与阵容","rel":"改编","ref":"https://bbmod.com/wiki/read/Game_Mechanics/?lang=zh#w-Enemy_Troop_Size_and_Composition","srcLabel":"Game Mechanics","scope":"","root":false,"body":"遭遇要说明对手来由、人数和职责分布。劫匪、府兵、异兽可随地区和事件呈现不同阵容。是否随队伍规模、历练或时局调整，以及如何让变化有迹可循，尚待决定。"},
  {"key":"economy","g":2,"parent":"rules","old":"市场价格与经济","new":"市价与买卖","rel":"改编","ref":"https://bbmod.com/wiki/read/Game_Mechanics/?lang=zh#w-Market_prices_and_economics","srcLabel":"Game Mechanics","scope":"","root":false,"body":"市价把货源、地方近况和运输风险连起来。若一批药货被夺，受影响的可先是相关城镇和商品。货物流转、物价时效和买卖差价待议。"},
  {"key":"temphurt","g":2,"parent":"injuries","old":"暂时伤势","new":"暂时伤势","rel":"沿用","ref":"https://bbmod.com/wiki/read/Temporary_Injuries/?lang=zh","srcLabel":"Temporary Injuries","scope":"","root":false,"body":"暂时伤势按受伤部位、影响和恢复条件编目。应考虑受伤同伴在接下来的差事里能否继续承担原职责。战中稳定伤情、战后调养及复原时间待定。"},
  {"key":"permhurt","g":2,"parent":"injuries","old":"永久伤势","new":"久伤与残损","rel":"沿用","ref":"https://bbmod.com/wiki/read/Permanent_Injuries/?lang=zh","srcLabel":"Permanent Injuries","scope":"","root":false,"body":"久伤可改变步法、握持、感知或长期劳作。设计讨论保留通过训练适应或改任探路、情报等职责的空间。具体可恢复程度与长期惩罚未定。"},
  {"key":"named","g":3,"parent":"rarities","old":"红装","new":"名家器物","rel":"替换","ref":"https://bbmod.com/wiki/read/Named_and_Legendary_Items/?lang=zh#w-Named_Items","srcLabel":"Named and Legendary Items","scope":"","root":false,"body":"名家器物按兵器、身甲、盔帽和盾具分册。每件可记制作者、旧主、流转经过和辨认特征，追索事件引用同一件器物。磨合及属性变化待议。"},
  {"key":"legendary","g":3,"parent":"rarities","old":"传奇装备","new":"传世奇物","rel":"替换","ref":"https://bbmod.com/wiki/read/Named_and_Legendary_Items/?lang=zh#w-Legendary_Items","srcLabel":"Named and Legendary Items","scope":"","root":false,"body":"传世奇物以独特来历和取得经过区别于同类名家器物。残刃、柄件、线索和组装后的器物应分别编目，再串到同一寻访过程。具体复原条件待议。"},
  {"key":"dagger","g":3,"parent":"melee","old":"匕首类","new":"匕首与短刺","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Daggers","srcLabel":"Melee Weapons","scope":"","root":false,"body":"匕首和短刺适合贴身及把握对手上一招露出的空当。分水刺可列为候选短兵，接近重兵、脱离牵制及破甲条件需随各器具写清。"},
  {"key":"sword","g":3,"parent":"melee","old":"剑类","new":"剑与佩刀","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Swords","srcLabel":"Melee Weapons","scope":"","root":false,"body":"这一对照栏同时收录单剑、配对剑和便于随身携带的刀类。单剑可偏攻守转换，配对剑可偏连续出招，单刀可偏劈砍压迫。双持和正式分类待议。"},
  {"key":"mace","g":3,"parent":"melee","old":"钉锤类","new":"棍棒与锏","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Maces","srcLabel":"Melee Weapons","scope":"","root":false,"body":"棍棒、禅杖和锏可涵盖钝击、护人和干扰。棍杖侧重距离与掩护，锏与硬鞭可讨论对招架或兵刃造成压力。具体缴械和磨损规则待议。"},
  {"key":"spear","g":3,"parent":"melee","old":"长矛类","new":"枪矛","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Spears","srcLabel":"Melee Weapons","scope":"","root":false,"body":"枪矛凭长度拦截接近、维持间距，结队时可守住窄道或护住后排。能否在近身缠斗中换出手法，以及拦截消耗和触发机会待议。"},
  {"key":"axe","g":3,"parent":"melee","old":"斧类","new":"斧钺","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Axes","srcLabel":"Melee Weapons","scope":"","root":false,"body":"斧钺可讨论以重劈压迫护甲或盾面。出手慢、准头或收势困难是可选代价。护甲损耗和伤害穿透应分项说明。"},
  {"key":"flail","g":3,"parent":"melee","old":"连枷类","new":"链枷与链兵","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Flails","srcLabel":"Melee Weapons","scope":"","root":false,"body":"原版连枷在此对应链枷与链兵。软鞭、九节鞭、流星锤与绳镖可作为候选挂入绳链兵器组，牵制、缠绕和位移需各自定义范围与代价。"},
  {"key":"cleaver","g":3,"parent":"melee","old":"斩刀类","new":"重刀与斩刀","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Cleavers","srcLabel":"Melee Weapons","scope":"","root":false,"body":"重刀与斩刀用于讨论重劈、连续压迫和创口效果。长柄大刀、陌刀与较短的重刀可分别定位。实际攻击格数、流血和内力消耗待议。"},
  {"key":"hammer","g":3,"parent":"melee","old":"战锤类","new":"战锤","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Hammers","srcLabel":"Melee Weapons","scope":"","root":false,"body":"战锤可用来讨论重击与压迫守势。若引入格挡后的震荡，仍需定义命中或招架条件。重锤、金瓜锤的握法和出手代价待议。"},
  {"key":"pole","g":3,"parent":"melee","old":"长柄武器","new":"长柄兵器","rel":"改编","ref":"https://bbmod.com/wiki/read/Melee_Weapons/?lang=zh#w-Polearms","srcLabel":"Melee Weapons","scope":"","root":false,"body":"戟、镗及部分长柄大刀可编入长柄兵器。刺、牵拉、顶退各对应不同的站位机会，够得着目标与隔着队友能否出手需分开说明。"},
  {"key":"bow","g":3,"parent":"ranged","old":"弓类","new":"弓术兵器","rel":"改编","ref":"https://bbmod.com/wiki/read/Ranged_Weapons/?lang=zh#w-Bows","srcLabel":"Ranged Weapons","scope":"","root":false,"body":"弓类远手可在交手前期占据射界，压迫无遮护的敌手。弓弩应分别记录出手节奏、所需弹药与掩体影响。射程和移动后出手的要求待议。"},
  {"key":"crossbow","g":3,"parent":"ranged","old":"弩类","new":"弩具","rel":"改编","ref":"https://bbmod.com/wiki/read/Ranged_Weapons/?lang=zh#w-Crossbows","srcLabel":"Ranged Weapons","scope":"","root":false,"body":"弩具的典型取舍是射击时机与装填空当。词条应分别记载装填、保持待发与射击的条件，交由队友掩护是否有收益待议。"},
  {"key":"firearm","g":3,"parent":"ranged","old":"火器","new":"火器","rel":"改编","ref":"https://bbmod.com/wiki/read/Ranged_Weapons/?lang=zh#w-Firearms","srcLabel":"Ranged Weapons","scope":"","root":false,"body":"火器为时代与装备路线中的候选门类。若纳入火铳，应同时说明装填、补给、掩护和射界。正式年代、火器类别及效果尚未确定。"},
  {"key":"throwing","g":3,"parent":"ranged","old":"投掷武器","new":"投掷暗器","rel":"改编","ref":"https://bbmod.com/wiki/read/Ranged_Weapons/?lang=zh#w-Throwing_Weapons","srcLabel":"Ranged Weapons","scope":"","root":false,"body":"飞刀、袖箭与针具等可用于短距突袭或打断，其中抛投和机括发射可分项。发射方向、携弹与反应机会应写明。铁蒺藜等地面物另查投掷用具。"},
  {"key":"throwtools","g":3,"parent":"ranged","old":"投掷物品","new":"投掷用具","rel":"改编","ref":"https://bbmod.com/wiki/read/Ranged_Weapons/?lang=zh#w-Throwable_Items","srcLabel":"Ranged Weapons","scope":"","root":false,"body":"烟罐、铁蒺藜等候选用具以遮蔽或改变可用通道为主。正文宜记清覆盖范围、持续时间、影响对象与应对方式。同一格能否同时存在多种效果待验证。"},
  {"key":"attachments","g":3,"parent":"armor","old":"护甲附件","new":"衣甲附具","rel":"改编","ref":"https://bbmod.com/wiki/read/Armor_Attachments/?lang=zh","srcLabel":"Armor Attachments","scope":"","root":false,"body":"衣甲附具记录加挂在身甲上的衬件和护具。改造可关注所护部位、兼容衣甲、用料、拆装和耐久。附具能否回收及可装数量待议。"},
  {"key":"body","g":3,"parent":"armor","old":"身体护甲","new":"衣衫与身甲","rel":"改编","ref":"https://bbmod.com/wiki/read/Armor/?lang=zh#w-Body_Armor","srcLabel":"Armor","scope":"","root":false,"body":"常服、劲装、内甲和外甲可按身甲编目。词条应交代适用场合、修缮与活动取舍。外观分层和实际防护如何对应尚待设计。"},
  {"key":"accessory","g":8,"parent":"craft","old":"饰品","new":"佩饰与护符","rel":"改编","ref":"https://bbmod.com/wiki/read/Crafting/?lang=zh#w-Accessories","srcLabel":"Crafting","scope":"","root":false,"body":"佩饰与护符用于登记佩挂器物和队伍标志等对照条目。可记来历、持有者及可见用途。佩戴限制和交手效果待议。"},
  {"key":"eventcraft","g":8,"parent":"craft","old":"通过事件制作的物品","new":"际遇制物","rel":"改编","ref":"https://bbmod.com/wiki/read/Crafting/?lang=zh#w-Event-crafted_items","srcLabel":"Crafting","scope":"","root":false,"body":"际遇制物由具体人物、地点或事件推动，例如遇匠修补旧物、由书生辨认残卷。记录材料的去向和成品交付，失败或更改委托也需承接。"},
  {"key":"bandits","g":4,"parent":"enemies","old":"强盗","new":"绿林劫匪","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Brigands","srcLabel":"Enemies","scope":"","root":false,"body":"绿林劫匪围绕可通行的山路、商队与营地活动。劫客和头领可按其在设伏、追逃和带队中的职责编目。与黑风寨候选组织的关系待定。"},
  {"key":"nomads","g":4,"parent":"enemies","old":"游牧民","new":"大漠游帮","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Nomads","srcLabel":"Enemies","scope":"","root":false,"body":"大漠游帮是边地敌手或来往团体的候选称呼。习于在开阔地活动、拉开距离、从侧翼接近可作为打法方向。组织来源、是否骑乘与敌友条件待议。"},
  {"key":"barbarians","g":4,"parent":"enemies","old":"蛮族","new":"边地武众","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Barbarians","srcLabel":"Enemies","scope":"","root":false,"body":"边地武众按驻地、首领和行事目的编目。临时聚众、结阵护卫与熟悉险路是可讨论的差别。具体门派和立场由地域设定确定。"},
  {"key":"military","g":4,"parent":"enemies","old":"贵族家族","new":"世家府兵","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Noble_Houses","srcLabel":"Enemies","scope":"","root":false,"body":"世家府兵是依附于地方世家的武装，可能护送使者、守卫庄园或参与纷争。甲士、长兵与远手可以有明确分工。戒备等级和出动缘由待定。"},
  {"key":"cityforces","g":4,"parent":"enemies","old":"城邦","new":"城关守军","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-City_States","srcLabel":"Enemies","scope":"","root":false,"body":"城关守军负责城防、关卡与城外巡查。遭遇可与辖区和具体任务相连。何时盘查、追击、放行或施援尚待设计。"},
  {"key":"civilian","g":4,"parent":"enemies","old":"平民","new":"行旅与百姓","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Civilian","srcLabel":"Enemies","scope":"","root":false,"body":"行旅与百姓包含路过的商旅、村民与其他有自己处境的人物，另可收录独行剑师。护送、救援、请教或争执需根据来由与关系进入不同事件。"},
  {"key":"mercs","g":4,"parent":"enemies","old":"佣兵","new":"受雇武人","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Mercenaries","srcLabel":"Enemies","scope":"","root":false,"body":"受雇武人随差事、雇主和报酬行动。查阅时区分雇请出战的对手与可招募的同行者。雇佣期限、背约与转交雇约的规则待定。"},
  {"key":"folk","g":4,"parent":"enemies","old":"其他人类","new":"江湖散人","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Other_humans","srcLabel":"Enemies","scope":"","root":false,"body":"江湖散人按个人行当、武学和走动地区记录。行医、访友、寻仇或讨生活皆可成为相遇缘由。是否入队、求教或交手由际遇决定。"},
  {"key":"champions","g":4,"parent":"enemies","old":"精英勇士","new":"成名高手","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Champions","srcLabel":"Enemies","scope":"","root":false,"body":"成名高手应有可辨的名号、交手习惯和过往。遇到同一人时可沿用先前的伤势、恩怨和器物去向，便于串联宿敌再会。专属招法与触发条件待定。"},
  {"key":"animals","g":4,"parent":"beasts","old":"动物","new":"猎犬、鹰隼与驮兽","rel":"改编","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Animals","srcLabel":"Enemies","scope":"","root":false,"body":"犬可警戒或参加交手，鹰隼可用于侦察的候选设计，驮兽可承担运载工作。图录应注明训练、携行与补给方式。是否进入战场及驱使方式待议。"},
  {"key":"wagon","g":5,"parent":"retinue","old":"货车升级","new":"行囊与车马扩充","rel":"改编","ref":"https://bbmod.com/wiki/read/Retinue/?lang=zh#w-Cart_Upgrades","srcLabel":"Retinue","scope":"","root":false,"body":"行囊与车马扩充记录队伍运载口粮、药材、装备与差事货物的方式。增容可能伴随费用、行路限制和保护需求，实际容量与升级条件待定。"},
  {"key":"retirement","g":5,"parent":"ambitions","old":"退休","new":"隐退与生涯结局","rel":"改编","ref":"https://bbmod.com/wiki/read/Retirement/?lang=zh","srcLabel":"Retirement","scope":"","root":false,"body":"隐退可为领队或同伴收束一段经历，记下战绩、余债、人情和器物去处。领队遇险后的生涯结局及继任方式待定。每局结局归入该次独立战役。"},
  {"key":"buildings","g":6,"parent":"towns","old":"城镇建筑","new":"市镇设施","rel":"改编","ref":"https://bbmod.com/wiki/read/Settlement_buildings/?lang=zh","srcLabel":"Settlement buildings","scope":"","root":false,"body":"市镇设施按用途分录，如客栈住宿与听闻、药铺求医和购药、百工坊修缮与委加工。开设条件、费用及地方近况的影响待定。"},
  {"key":"arena","g":6,"parent":"towns","old":"竞技场","new":"城中擂台","rel":"改编","ref":"https://bbmod.com/wiki/read/Arena/?lang=zh","srcLabel":"Arena","scope":"","root":false,"body":"城中擂台供设定约斗、赛事与彩头。每场应注明参赛人、胜负条件、退场与受伤后果，常日擂斗和大型擂会分别查阅。"},
  {"key":"rumors","g":6,"parent":"towns","old":"酒馆传闻","new":"酒肆传闻","rel":"改编","ref":"https://bbmod.com/wiki/read/Tavern_Rumors/?lang=zh","srcLabel":"Tavern Rumors","scope":"","root":false,"body":"酒肆传闻可指向名器下落、商路风险或人物行踪。消息应记录何处听来、何时发生及说话人的来源，容许失真与过时。传播方式待议。"},
  {"key":"worldmap","g":6,"parent":"places","old":"世界地图","new":"江湖舆图","rel":"改编","ref":"https://bbmod.com/wiki/read/Global_Map/?lang=zh","srcLabel":"Global Map","scope":"","root":false,"body":"舆图把城镇、据点、商路与地形连起来。腹地、水乡、南疆与边塞是候选地域原型。真实地图、架空地理或随机生成仍待选择。"},
  {"key":"crisis","g":6,"parent":"factions","old":"后期危机","new":"武林大势","rel":"改编","ref":"https://bbmod.com/wiki/read/Late_Game_Crises/?lang=zh","srcLabel":"Late Game Crises","scope":"","root":false,"body":"武林大势是影响多个地点和势力的局内风波。世家纷争、古墓之乱、山寨联军和圣址争夺是从原版映射来的方向，触发、持续与收束条件待定。"},
  {"key":"renown","g":6,"parent":"factions","old":"声望","new":"江湖名望","rel":"改编","ref":"https://bbmod.com/wiki/read/Renown/?lang=zh","srcLabel":"Renown","scope":"","root":false,"body":"江湖名望记录队伍被多少地方和人物听说，以及被记住的事迹。名望可关联引荐、礼遇、约斗或被对手关注。传播范围与增长尺度待定。"},
  {"key":"reputation","g":6,"parent":"factions","old":"声誉","new":"江湖口碑","rel":"改编","ref":"https://bbmod.com/wiki/read/Reputation/?lang=zh","srcLabel":"Reputation","scope":"","root":false,"body":"江湖口碑记录旁人从履约、分配与处置争端中形成的印象。某地是否知道事由取决于消息来源。对某人的私交或某桩官府案件各有记录。"},
  {"key":"relations","g":6,"parent":"factions","old":"关系","new":"各派交情","rel":"改编","ref":"https://bbmod.com/wiki/read/Relations/?lang=zh","srcLabel":"Relations","scope":"","root":false,"body":"各派交情记录亲疏、承诺、亏欠及旧怨。人物、队伍与组织可各有关系。具体交情如何影响求教、交易与差事尚待确定。"},
  {"key":"caravans","g":6,"parent":"factions","old":"商队","new":"商队与押运行列","rel":"改编","ref":"https://bbmod.com/wiki/read/Factions_and_Relations/?lang=zh#w-Caravans","srcLabel":"Factions and Relations","scope":"","root":false,"body":"商队与押运行列串起货主、货物、路线、镖队和可能的劫夺者。遭劫、改道、交割及追索可以引用同一批货的去向。自治与补给联动待定。"},
  {"key":"bargain","g":7,"parent":"contracts","old":"议价","new":"酬金商议","rel":"改编","ref":"https://bbmod.com/wiki/read/Contracts/?lang=zh#w-Haggling","srcLabel":"Contracts","scope":"","root":false,"body":"酬金商议可涉及预付、交割付款、额外损耗和途中的变更。谈妥后应看得出双方各承诺了什么，变更或背约如何记入口碑待议。"},
  {"key":"civiljobs","g":7,"parent":"contracts","old":"平民委托","new":"市镇差事","rel":"改编","ref":"https://bbmod.com/wiki/read/Contracts/?lang=zh#w-Civilian_Contracts","srcLabel":"Contracts","scope":"","root":false,"body":"市镇差事围绕普通商民和地方生活，包括守镇、寻物、走镖。路线、交割对象和地方法度应随具体委托说明。"},
  {"key":"noblejobs","g":7,"parent":"contracts","old":"贵族委托","new":"世家委托","rel":"改编","ref":"https://bbmod.com/wiki/read/Contracts/?lang=zh#w-Noble_Contracts","srcLabel":"Contracts","scope":"","root":false,"body":"世家委托常涉及使者、遗珍、据点和人质。检查雇主的利益及委托可能牵动的交情。如何核验救援或处置结果待议。"},
  {"key":"southjobs","g":7,"parent":"contracts","old":"南方委托","new":"边城差事","rel":"改编","ref":"https://bbmod.com/wiki/read/Contracts/?lang=zh#w-Southern_Contracts","srcLabel":"Contracts","scope":"","root":false,"body":"边城差事可连接关隘、外来商队与地区势力。通关、翻越险路和补给是候选难点。实际地区、货单与差事名单待定。"},
  {"key":"evbg","g":7,"parent":"events","old":"按背景分类的事件","new":"出身际遇","rel":"改编","ref":"https://bbmod.com/wiki/read/Events/?lang=zh#w-Events_by_Background","srcLabel":"Events","scope":"","root":false,"body":"出身际遇让从前的身份派上用场。比如驿使认得旧站路，家仆识得旧主家规，访古书生看懂遗刻。结果须看在场人物和眼前处境。"},
  {"key":"evtrait","g":7,"parent":"events","old":"按特性分类的事件","new":"性情际遇","rel":"改编","ref":"https://bbmod.com/wiki/read/Events/?lang=zh#w-Events_by_Trait","srcLabel":"Events","scope":"从实际信号、人员与约定引发性情际遇，描写同伴怎样选择和调整。","root":false,"body":"性情际遇从本局能说明的事由出现。听见不明动静、收到催约、目击同一货物的两种说法，都可能让同伴提出自己的选项。登记在场人、前置经历、现有物品或已确认的证据，再选择请人查证、调整职责、休整或继续。\n\n结果回写本次实际见闻、完成的约定和人物状态。有些情节只让人物心境暂时变化，反复出现并有当事人参与后才讨论长期性情是否改变。相同事件如何重复触发和效果数值仍待议。"},
  {"key":"evcrisis","g":7,"parent":"events","old":"按后期危机分类的事件","new":"时局风波","rel":"改编","ref":"https://bbmod.com/wiki/read/Events/?lang=zh#w-Events_by_Late_Game_Crisis","srcLabel":"Events","scope":"","root":false,"body":"时局风波把大势带来的征调、封路、失守、逃难或重建落到具体地点。事件应引用现有局势和涉事人物，并记下其后果。"},
  {"key":"evcontract","g":7,"parent":"events","old":"委托事件","new":"委托插曲","rel":"改编","ref":"https://bbmod.com/wiki/read/Events/?lang=zh#w-Contract_Events","srcLabel":"Events","scope":"","root":false,"body":"委托插曲发生在同一差事途中，如走镖时接到改道请求，寻物时遇见另一位认领者。记录人员、货物和承诺的最新变化，并在交割时承接。"},
  {"key":"evorigin","g":7,"parent":"events","old":"起源事件","new":"开局因缘","rel":"改编","ref":"https://bbmod.com/wiki/read/Events/?lang=zh#w-Origin_Events","srcLabel":"Events","scope":"","root":false,"body":"开局因缘来自初始成员、雇主、旧案和前约。旧同门求援或原雇主追问下落是可讨论的触发。延续范围在当次战役内。"},
  {"key":"evother","g":7,"parent":"events","old":"其他事件","new":"行旅见闻","rel":"改编","ref":"https://bbmod.com/wiki/read/Events/?lang=zh#w-Other_Events","srcLabel":"Events","scope":"","root":false,"body":"行旅见闻包括沿路相遇、休憩和探访。雨夜破庙可由押运者、追查者与既有信物引发。黑店可通过可疑招呼或同伴警觉留下处理机会。触发和后果随实际人物与地点设计。"},
  {"key":"supply","g":8,"parent":"consumables","old":"工具与修缮物资","new":"修缮用料","rel":"改编","ref":"https://bbmod.com/wiki/read/Tools_and_Supplies/?lang=zh","srcLabel":"Tools and Supplies","scope":"","root":false,"body":"修缮用料用于队伍维护衣甲与兵器。应记携带数量、谁能修、何时修及哪些名器需要专门工匠。消耗和恢复耐久的关系待议。"},
  {"key":"ammo","g":8,"parent":"consumables","old":"弹药","new":"箭矢与弹药","rel":"改编","ref":"https://bbmod.com/wiki/read/Ammunition/?lang=zh","srcLabel":"Ammunition","scope":"","root":false,"body":"箭、弩矢和火器弹药可按兼容兵器与补充来源记录。随身待用与行囊储备如何扣减，以及备用弹药的运载条件待定。"},
  {"key":"medical","g":8,"parent":"consumables","old":"医疗物资","new":"行医药材","rel":"改编","ref":"https://bbmod.com/wiki/read/Medical_Supplies/?lang=zh","srcLabel":"Medical Supplies","scope":"","root":false,"body":"行医药材供旅途中照料伤员。候选可区分处理外伤、内伤、中毒，以及供药师配制的原料。用量、恢复节奏与服务条件需逐项确定。"},
  {"key":"food","g":8,"parent":"consumables","old":"口粮","new":"随行口粮","rel":"改编","ref":"https://bbmod.com/wiki/read/Provisions/?lang=zh","srcLabel":"Provisions","scope":"","root":false,"body":"口粮用于队伍行军、扎营和连续差事。货源、可存期限及人数带来的消耗都可影响路线选择。不同食品的正式数值待定。"},
  {"key":"traveluse","g":8,"parent":"consumables","old":"世界地图","new":"行旅用药与杂物","rel":"改编","ref":"https://bbmod.com/wiki/read/Crafting/?lang=zh#w-Worldmap","srcLabel":"Crafting","scope":"","root":false,"body":"行旅杂物收录大地图使用的药散与便利物品。条目应交代目标、使用时机、是否经过扎营或就医，以及使用后会怎样改变行程。"},
  {"key":"fightuse","g":8,"parent":"consumables","old":"战斗","new":"临阵药散与用具","rel":"改编","ref":"https://bbmod.com/wiki/read/Crafting/?lang=zh#w-Combat","srcLabel":"Crafting","scope":"","root":false,"body":"临阵用具可讨论止血、烟雾或应急支援。应写明目标距离、准备、是否可能被打断及作用多久。携带数量、残余伤势和使用次数待定。"},
  {"key":"trade","g":8,"parent":"craft","old":"贸易","new":"江湖商货","rel":"改编","ref":"https://bbmod.com/wiki/read/Trade/?lang=zh","srcLabel":"Trade","scope":"","root":false,"body":"江湖商货按产地、买家、路线和运载条件记录。物资短缺可先影响相关地方与货品。日常市价、差事指定货与追索赃物各有用途。"},
  {"key":"alchemist","g":8,"parent":"workshop","old":"炼金工坊","new":"药铺与药师","rel":"改编","ref":"https://bbmod.com/wiki/read/Alchemist/?lang=zh","srcLabel":"Alchemist","scope":"","root":false,"body":"药铺与药师可提供诊看、成药和委托配药。普通补给、调养和待议的异兽灵药分别登记。配方、资质与负面代价尚待决定。"},
  {"key":"zoc","g":2,"parent":"rules","old":"控制区（ZoC）","new":"近身牵制范围","rel":"沿用","ref":"https://bbmod.com/wiki/read/Combat_Mechanics/?lang=zh#w-Zone_of_Control_(ZoC)","srcLabel":"Combat Mechanics","scope":"","root":false,"body":"近身牵制按人物实际站位、距离和剩余反应发生。身法检查退格与途中路段。对手交掉反应、确有同伴接防，或已学招式给出合法退步，都会改变眼下的选择。被截时以已到的合法格或实际受迫位置停下，已经走过的动作照记。到新格再查招式距离和后手。"},
  {"key":"height","g":2,"parent":"rules","old":"地势高度","new":"地势高低","rel":"沿用","ref":"https://bbmod.com/wiki/read/Combat_Mechanics/?lang=zh#w-Height_Level","srcLabel":"Combat Mechanics","scope":"","root":false,"body":"高低差会影响路线选择、可见性和对峙。占高可争取观察与接敌位置，陡坡也可能妨碍队伍相互照应。能否攀越及具体战斗修正待议。"},
  {"key":"surround","g":2,"parent":"rules","old":"包围","new":"合围","rel":"沿用","ref":"https://bbmod.com/wiki/read/Combat_Mechanics/?lang=zh#w-Surrounding","srcLabel":"Combat Mechanics","scope":"","root":false,"body":"合围来自多名敌手占住相互呼应的位置，迫使目标分心或失去退路。在传统武侠尺度下，高手仍需借地形、掩护和脱身时机破围。有效围攻的范围及结算待议。"},
  {"key":"wear","g":2,"parent":"rules","old":"武器耐久","new":"兵器耐久","rel":"沿用","ref":"https://bbmod.com/wiki/read/Combat_Mechanics/?lang=zh#w-Weapon_Durability","srcLabel":"Combat Mechanics","scope":"","root":false,"body":"耐久记录兵器磨损，以及需要准备修缮或备用器物的时机。普通器物与名器可有各自维修条件，卷刃、折损、缴械如何影响耐久待议。"},
  {"key":"townstate","g":6,"parent":"towns","old":"城镇状况","new":"城镇近况","rel":"改编","ref":"https://bbmod.com/wiki/read/Settlement_situations/?lang=zh","srcLabel":"Settlement situations","scope":"","root":false,"body":"城镇近况可由路断、匪患、缺药或热闹市集形成。应说明缘由、当地可见变化及何时缓解。价格波动、招募和任务可引用这条近况。"},
  {"key":"attached","g":6,"parent":"places","old":"附属地点","new":"城外产业与岗哨","rel":"改编","ref":"https://bbmod.com/wiki/read/Settlements_and_attached_locations/?lang=zh#w-Attached_Locations","srcLabel":"Settlements and attached locations","scope":"","root":false,"body":"城外产业与岗哨可向城镇供应货物、守望道路或提供田野差事。被占、废弃、恢复时怎么反馈回城镇，属于世界模拟候选。"},
  {"key":"terrain","g":6,"parent":"places","old":"地形类型","new":"行旅地形","rel":"沿用","ref":"https://bbmod.com/wiki/read/Global_Map/?lang=zh#w-Terrain_Types","srcLabel":"Global Map","scope":"","root":false,"body":"山岭、密林、水道、荒漠等地形可改变行军难度、视线与补给计划。大地图通行和进场后的格子地形分别说明，通行系数待定。"},
  {"key":"warhouses","g":6,"parent":"factions","old":"贵族家族之战","new":"世家纷争","rel":"替换","ref":"https://bbmod.com/wiki/read/Late_Game_Crises/?lang=zh#w-War_of_the_Noble_Houses","srcLabel":"Late Game Crises","scope":"","root":false,"body":"世家纷争围绕家族利益、驻地和通路展开。护送使者、保全据点或调停可成为差事，参与结果可以影响局内交情。开战原因和收束规则待议。"},
  {"key":"wardead","g":6,"parent":"factions","old":"亡灵灾祸","new":"古墓之乱","rel":"替换","ref":"https://bbmod.com/wiki/read/Late_Game_Crises/?lang=zh#w-Undead_Scourge","srcLabel":"Late Game Crises","scope":"","root":false,"body":"古墓之乱拟由秘境扰动或守卫外溢引出，候选涉及邻近据点、守墓者与地方求援。规模、成因与义庄或古墓的关联待定。"},
  {"key":"wargreen","g":6,"parent":"factions","old":"绿皮入侵","new":"山寨联军之乱","rel":"替换","ref":"https://bbmod.com/wiki/read/Late_Game_Crises/?lang=zh#w-Greenskin_Invasion","srcLabel":"Late Game Crises","scope":"","root":false,"body":"山寨联军之乱可把多个战帮的结盟、粮道威胁与地方反应连成一段时局。联军如何形成、各寨目标是否一致以及玩家可否调停均待议。"},
  {"key":"warholy","g":6,"parent":"factions","old":"圣战","new":"两地争夺圣址","rel":"替换","ref":"https://bbmod.com/wiki/read/Late_Game_Crises/?lang=zh#w-Holy_War","srcLabel":"Late Game Crises","scope":"","root":false,"body":"两地争夺圣址以受重视的驻地与通路为矛盾。可有交涉、护送、守卫和撤离等立场。地名、信仰、参与者和结束方式尚待世界观确定。"},
  {"key":"titles","g":5,"parent":"ambitions","old":"称号","new":"江湖名号","rel":"改编","ref":"https://bbmod.com/wiki/read/Titles/?lang=zh","srcLabel":"Titles","scope":"","root":false,"body":"江湖名号可由公开战绩、地方传闻或擂台表现传开。不同地方何时听说、会否礼遇、挑战或准备应对，可依传播范围讨论。正式授予与效果规则待定。"},
  {"key":"tournament","g":6,"parent":"towns","old":"竞技场锦标赛","new":"武林擂会","rel":"改编","ref":"https://bbmod.com/wiki/read/Arena/?lang=zh#w-Arena_Tournament","srcLabel":"Arena","scope":"","root":false,"body":"武林擂会将数场比试组织成同一赛程。应记录参赛名单、晋级条件、是否允许中途退场及彩头来源。常设擂会与玩家设擂的关系待议。"},
  {"key":"treasures","g":8,"parent":"trophies","old":"财宝","new":"财货与珍玩","rel":"改编","ref":"https://bbmod.com/wiki/read/Treasures/?lang=zh","srcLabel":"Treasures","scope":"","root":false,"body":"财货与珍玩可以作为差事目标、战后缴获或商旅货单。记下原主、可辨识特征和是否须交还，便于在交割、交易和追索中使用。"},
  {"key":"pendants","g":8,"parent":"craft","old":"战利品项链","new":"战功佩饰","rel":"改编","ref":"https://bbmod.com/wiki/read/Trophy_Necklaces/?lang=zh","srcLabel":"Trophy Necklaces","scope":"","root":false,"body":"战功佩饰可纪念一场擂会、一次护送或与异兽交手的经过。记录来源与持有人。声望反馈、可佩戴位置和属性影响待议。"},
  {"key":"paint","g":8,"parent":"consumables","old":"涂装套装","new":"衣甲与盾面涂彩","rel":"沿用","ref":"https://bbmod.com/wiki/read/Paint_Set/?lang=zh","srcLabel":"Paint Set","scope":"","root":false,"body":"涂彩用于盾面与衣甲的纹样、颜色或来历标记。若涉及势力辨识、掩饰身份或改版维修，需另行定义识别条件及所需物料。"},
  {"key":"elixirs","g":8,"parent":"consumables","old":"解剖学者药剂","new":"异兽灵药","rel":"替换","ref":"https://bbmod.com/wiki/read/Category:Anatomists_Potions/?lang=zh","srcLabel":"Category:Anatomists Potions","scope":"","root":false,"body":"异兽灵药可由获得的奇材交药师调制。用途、服用条件、重复服用代价及是否只针对特定伤势仍待议，原版药剂效果供对照查询。"},
  {"key":"namedweapon","g":3,"parent":"named","old":"红装武器","new":"名家兵器","rel":"替换","ref":"https://bbmod.com/wiki/read/Named_and_Legendary_Items/?lang=zh#w-Weapons","srcLabel":"Named and Legendary Items","scope":"","root":false,"body":"名家兵器可记录铸造者、原主、修复与现持有者。若有专属招式，应在器物与招式条目双向关联。习得条件和易主后的使用权限待议。"},
  {"key":"namedarmor","g":3,"parent":"named","old":"红装护甲","new":"名家宝甲","rel":"替换","ref":"https://bbmod.com/wiki/read/Named_and_Legendary_Items/?lang=zh#w-Armors","srcLabel":"Named and Legendary Items","scope":"","root":false,"body":"名家宝甲按防护部位、制作来历、修缮与流转编目。独特纹样可作辨识线索，附具兼容和额外效果待定。"},
  {"key":"namedhead","g":3,"parent":"named","old":"红装头盔","new":"名家盔帽","rel":"替换","ref":"https://bbmod.com/wiki/read/Named_and_Legendary_Items/?lang=zh#w-Helmets","srcLabel":"Named and Legendary Items","scope":"","root":false,"body":"名家盔帽登记护及部位、造型辨识、旧主及现持有者。可能影响视野和身份识别的细节按具体装备设计。"},
  {"key":"namedshield","g":3,"parent":"named","old":"红装盾牌","new":"名家盾具","rel":"替换","ref":"https://bbmod.com/wiki/read/Named_and_Legendary_Items/?lang=zh#w-Shields","srcLabel":"Named and Legendary Items","scope":"","root":false,"body":"名家盾具可登记纹章、旧主、盾面工艺和防护用法。专属动作、文饰与耐久如何交互尚待讨论。"},
  {"key":"constructs","g":4,"parent":"enemies","old":"血肉魔像","new":"秘境机关守卫","rel":"替换","ref":"https://bbmod.com/wiki/read/Enemies/?lang=zh#w-Flesh_Golems","srcLabel":"Enemies","scope":"","root":false,"body":"秘境机关守卫可由据点或核心机关驱动，区别于单独行动的墓傀。如何发现机关关联、是否能绕开或使其停止，取决于各秘境的候选方案。"},
  {"key":"racialpass","g":2,"parent":"rules","old":"种族特长","new":"异兽与敌派天性","rel":"替换","ref":"https://bbmod.com/wiki/read/Category:Racial_Perks/?lang=zh","srcLabel":"Category:Racial Perks","scope":"敌派与异兽的固有行为，结合对象、地形与可见征兆说明。","root":false,"body":"生物天性、机关本身的限制、组织成员习惯、临阵状态分别写。守水的巨怪可只在自己的活动范围内争守一条岸路。时机不满足时按实际遭遇处理。\n\n这部分给读者提供遇敌时能观察什么和用何种方法应付。原版异兽和敌派被动作为对照资料保留。"},
  {"key":"history","g":9,"parent":"","old":"开发日志与公告","new":"原版开发史","rel":"资料","ref":"https://bbmod.com/wiki/read/Developer_Posts/?lang=zh","srcLabel":"Developer Posts","scope":"原版工作室开发日志和历史公告。","root":false,"body":"收录原版开发日志、更新公告与历史讨论。从对应原文可查发布时间和版本背景。武侠版的取舍以设计总纲的修订记录为准。"},
  {"key":"legacy","g":9,"parent":"","old":"旧版攻略与战报","new":"旧版资料","rel":"资料","ref":"https://bbmod.com/wiki/read/Late_Game_Builds/?lang=zh","srcLabel":"Late Game Builds","scope":"","root":false,"body":"收录旧版攻略与战报。可用于查考当时的玩法、名称及社区用语，使用时可留意资料所处的版本和附带规则。"},
  {"key":"gloss","g":9,"parent":"","old":"同名词辨析","new":"名称辨析索引","rel":"资料","ref":"https://bbmod.com/wiki/read/Indomitable/?lang=zh","srcLabel":"Indomitable","scope":"","root":false,"body":"同名或相近名称从此处辨析。查词时可对照原文英文、所属系统与条目链接，例如单个角色的出身和整队的开局。"},
  {"key":"community","g":9,"parent":"","old":"百科与社区资料","new":"社区参考","rel":"资料","ref":"https://bbmod.com/wiki/read/Battle_Brothers_Wiki/?lang=zh","srcLabel":"Battle Brothers Wiki","scope":"","root":false,"body":"归档原百科、社区目录及资料入口。请沿原文链接查阅出处和语境。本页设计内容的出处见设计总纲。"},
  {"key":"technical","g":9,"parent":"","old":"操作、技术与音像资料","new":"参考资料","rel":"资料","ref":"https://bbmod.com/wiki/read/Keyboard_Shortcuts/?lang=zh","srcLabel":"Keyboard Shortcuts","scope":"","root":false,"body":"附录索引原版操作、技术和音像资料。查阅操作或规则时可确认原文对应的游戏版本、资料日期及引用范围。"},
  {"key":"weapons","g":3,"parent":"","old":"武器","new":"兵器总谱","rel":"改编","ref":"https://bbmod.com/wiki/read/Weapons/?lang=zh","srcLabel":"Weapons","scope":"","root":false,"body":"兵器候选按打法查阅，正式分类待定。\n\n短兵有单剑、双剑／子母剑、匕首／分水刺。重劈兵器有单刀、大刀／陌刀、斧／钺。长兵有长枪、齐眉棍／禅杖、大戟／镗。\n\n重击与压制类有重锤／金瓜锤、锏／硬鞭、重剑。奇门兵器有软鞭／九节鞭、流星锤／绳镖、判官笔／折扇。远程兵器与用具有弓／强弩、袖箭／针具、飞刀／铁蒺藜。\n\n双持可作为配套方式。弓弩可分家，重剑中的传世名器另列，地面器具可能归用具。各门类应写出优势、代价与应对办法。"}
],

"additions": [
  {"key":"contest","name":"江湖夺宝局","links":["contracts","landmarks","rarities"],"note":"增设多方争夺同一件宝物的事件。","body":"夺宝局把一件有来历的宝物和多个寻访者放到同一局势中。队伍听到的消息可来自残图、旧主或地方传闻。先赶到的人也可能带走宝物。\n\n候选过程中可谈判、联手探路、抢先取物或放弃争夺。归属变化会接入「名器易主与追夺」。敌对各方能否同场交手及消息何时更新仍待决定。"},
  {"key":"wager","name":"赌斗与彩头","links":["arena","bargain","rarities"],"note":"在擂台与委托之外增加双方约定的赌注。","body":"赌斗开始前可约定彩头、参斗者、胜负与认输条件。它可出现在城中擂台或其他双方认可的场合。彩头可讨论银两或具体器物。\n\n若有人失约或中途退场，处理方式可影响交情和口碑。托管、伤亡责任与彩头交割规则待议。"},
  {"key":"teaching","name":"秘籍与习武","links":["perks","skills","levels"],"note":"侠客可以研读秘籍，也可以向江湖师父求教，学习已有武学。收录武学的来源与修习条件。","body":"已选方向是修习已有武学。领队可以带队寻找秘籍，也可让侠客向江湖师父求教。武学条目应记录从哪里学到、需要哪些前置以及能用于哪些场合。\n\n完整秘籍、手抄本和残页是讨论中的来源形式。是否消耗抄本、何时需要引荐、研读之后如何形成修为均待决定。"},
  {"key":"combos","name":"轻功与招式搭配","links":["armskills","perkskills","ap","zoc"],"note":"已有逐段落脚、拦截和到格后接招的候选规则。","body":"行前检查逐段落点与牵制。接应方自己占位、用行动或反应提供窗口。身法完成后，以真实距离和当事人尚能付出的资源接普通攻守。\n\n回签步从实开的一侧撤回旧格，借挡转门用实际招架后的选择走到侧格，贴槛分程把坡路拆成两段结算。动作、内力与落脚地点按每式正文分别记。"},
  {"key":"ownership","name":"名器易主与追夺","links":["named","legendary","events"],"note":"记录名器由谁持有及再次追索的入口。","body":"名器条目以一件实物串联旧主、获得经过和当前持有人。本局内的典当、转赠、缴获或遗失可留下追索线索。\n\n例如名器被转卖之后，可从卖家、目击者或流传的消息寻找下落。哪些线索可见、能否追回及交涉条件待议。"},
  {"key":"rivals","name":"宿敌再会","links":["champions","relations","events"],"note":"关联同一位对手的多次相遇。","body":"宿敌再会沿用同一位对手的来历、之前的交手、伤势和当事人的约定。再会时可因胜负、人情或新目标产生不同走向。\n\n高手留命、后来约战、昔敌一同护人均可作为候选。再遇的触发、对手是否改变打法以及关系如何收束待定。"},
  {"key":"finalarena","name":"天下擂","links":["tournament","ambitions","renown"],"note":"增设由玩家设擂的战役目标。","body":"天下擂是玩家设擂的战役目标候选。它可以串起本局结识的高手、流传的战绩和各地的挑战邀约。\n\n场地、资格、赛程、退场与达成条件待议，相关内容归入单局江湖志向。"},
  {"key":"lineage","name":"门派与拜师","links":["background","factions","perks","skills"],"note":"记录江湖已有的门派、同伴的师承，以及向门中师父求教的入口。","body":"江湖中已有门派继续活动，同伴可以带着各自的师承入队。拜师用于向门中师父求教，可能关联声誉、引荐、约定和可修习的武学。\n\n禅宗古刹、玄门道宗、名山剑派、世家大族、机关暗器世家、南疆毒派、丐帮、血刀与金刚诸派、魔教诸部及医道宗门是讨论中的原型。正式门派、驻地和求教资格待定。"},
  {"key":"inner","name":"内功与内力","links":["fatigue","levels","skills"],"kind":"已选方向","note":"已有内力训练、战中用气和回气的候选结算。","body":"人物可先学认气和留余，再在差事中验证节省下的内力如何办成职责。起手所锁的内力到指定步骤实际扣除，普通行动另查自己的条件。\n\n整息、徐息调元和雁签行息按各自的安全条件与完成时点恢复。被迫离格、掩护丢失或改做别的动作会结束相应准备。精确费用、恢复量、负重界线和休整时长待调校。"}

"review": [
  {"key":"active-factions","name":"江湖组织自治与共同事件","placement":"建议独立建项","kind":"设计目标","section":"5.1、5.2、5.4","links":["origins","factions","caravans","contracts","events","places"],"existing":["contest","ownership","rivals"],"note":"旧稿的五个候选组织是威远镖局、靖夜司、无常鬼市、残剑门和黑风寨。玩家选了其中一家，其他各家仍能自行办事。一趟药镖的护送、劫夺和追查共用同一批人货与结果。自治范围待议。","body":"设计示例从一趟药镖展开。商人托威远押运，无常鬼市可能传出消息，黑风寨决定是否劫货，靖夜司可能追查。残剑门也可因自身处境接触这段事件。\n\n各方共享同一批人货和结果。药货若改道或被夺，后续差事应接着查这批货的去处。玩家未接差时各组织能自主走多远仍待议。"},
  {"key":"exchange","name":"起手、拆招与破架","placement":"已有武侠规则试稿，结算细节待议","kind":"讨论方向","section":"2.3、2.4、4.4","links":["armskills","ap","hitchance","shieldskills","surround","effects"],"existing":["combos","inner"],"note":"招式体系与桥口两手交锋已有起手、应对、结算和收势的候选顺序。","body":"桥口试稿按实际格况、可见信号、人物自己的动作和反应判断每一手的结果。用掉了准备或反应才计相应代价，未触发的接护仍会因失位而结束。\n\n架势是否单列、同时有多人应招时的细序、破绽对命中和护甲的数值影响仍待议。"},
  {"key":"companions","name":"结伴、师门义务与去留","placement":"建议独立建项","kind":"设计目标","section":"4.1、4.3、4.6","links":["background","traits","upkeep","mood","morale","retirement","relations"],"existing":["lineage","rivals"],"note":"师承不同的伙伴入队后仍有旧交和约定。镖师取酬、同伴分红、客卿应邀助拳，以及各人何时离队，均可在这里讨论。被俘、失踪、战死和隐退后的去向，以及领队身亡后队伍能否继续，留待确定。","body":"伙伴可以通过雇佣、结伴、救援、流亡、奉命助拳等途径同行，继续保有原先的人情和约定。镖师、客卿和结义同伴可分别约定报酬、职责和期限。\n\n离队、被俘、失踪、战死与隐退可留下各自的去向。领队遇险或身亡时是否继任以及如何处置尚待选择。"},
  {"key":"combat-roles","name":"队伍角色分工","placement":"补入现有条目","kind":"已选方向","section":"1.1、2.6","links":["perks","skills","ap","surround","injuries"],"existing":["combos"],"note":"同伴靠所学招式、装备和站位分工。前排护住医者、游斗者牵制对手，队伍可随敌情调整阵容。","body":"队伍按招式、装备和站位形成分工。护卫可挡住来路，远手利用射界，游斗者牵制敌手，医者在掩护下支援。遇到不同敌情时可调整阵容。\n\n可讨论阵法、机关、驱兽和破阵等细分方向，各职责需明确出场机会、代价以及被对手限制的情形。"},
  {"key":"practice","name":"修炼、突破与老兵成长","placement":"补入现有条目","kind":"设计目标","section":"3.1、3.4、4.3","links":["levels","combatxp","talents","retirement"],"existing":["teaching","lineage"],"note":"普通资质的同伴可从实际难题出发，分步习武，再用完成的职责确认本领。","body":"用亲历的难题决定下一课。会做原来的动作后，带着在新限制下实做的结果回师，可以学习一式现有的进阶用法。老卒可以改练照护、守后或交接，已经验证的其他本领取决于个人履历。\n\n课时、复练成本、成长差距与换修范围均待议。从「历练与修为」可打开候选规则和桥口护撤推演。"},
  {"key":"formations","name":"阵法、护卫与破阵","placement":"补入现有条目","kind":"候选细项","section":"2.6、4.2、4.4","links":["combat","zoc","surround","height","injuries"],"existing":["combos"],"note":"归入六角格交手与合围。阵位如何成立、谁护住医者、阵眼被牵制时会失去什么，可沿用战场站位讨论。传统武侠尺度下，军阵、地形和消耗仍能威胁高手。","body":"阵法可从六角格上彼此照应的阵位出发，例如前排枪矛控制来路，身侧有人接应，后排医者获得活动空间。若关键成员被牵制或失位，可出现拆阵机会。\n\n阵眼是否单独设置、阵型如何成立、护卫是否触发额外动作及破阵如何处理尚待议。"},
  {"key":"inner-injuries","name":"内伤、心境与心魔","placement":"补入现有条目","kind":"候选细项","section":"3.4、4.1、4.6","links":["injuries","temphurt","permhurt","mood","morale"],"existing":["inner","teaching"],"note":"内伤与调养归伤势，心境和心魔归同伴心境与修炼。经脉受损、内功冲突和走火入魔可留作候选。外伤、心境、临战士气与长期忠诚分别记录。","body":"内伤可讨论经脉受损或修炼遭遇挫折，外伤则随实际受击部位处理。心境记录人物长期经历造成的变化，战意记录临阵状态。\n\n心魔是突破时的候选挑战，可用人物经历和职责设置情境。内外伤是否并存、如何调养与失败后能否恢复待议。"},
  {"key":"street-life","name":"市井情报、榜单与黑市","placement":"补入现有条目","kind":"候选细项","section":"5.5、5.6、5.7","links":["rumors","renown","titles","towns","economy","trade","events"],"existing":["ownership","teaching"],"note":"茶馆说书、丐帮情报与兵器谱归传闻和名号。黑市拍卖、真假秘籍与镖局分号归城镇和买卖。雨夜破庙、金盆洗手等桥段归江湖际遇。地方消息的来源与时效待议。","body":"茶馆与酒肆可传播近来的见闻，行动者也可从市集、丐帮或固定联系人处听取地方消息。兵器谱和人物榜可记录公开战绩与传闻中的名号。\n\n鬼市可讨论拍卖、鉴定与交易。消息真假、传到哪里、黑市是否有固定地点以及地方风波怎样影响各项活动待定。"},
  {"key":"weapon-bond","name":"名器磨合与专属招式","placement":"补入现有条目","kind":"候选细项","section":"3.5、4.6","links":["named","legendary","wear","armskills"],"existing":["ownership"],"note":"名器易主已记录持有者与追索。名器来历、修复、磨合及可能习得的专属招式可挂在同一件器物下。神兵灵性的表现待选。","body":"可沿同一件名器的经历记录修复、温养、持用与所学招式。若讨论磨合，器物词条可写明从何开始、需要什么条件以及有哪些能察觉的变化。\n\n与原主、工匠及专属招式的关联可放在图录中。灵性如何表现、失去器物会失去哪些能力尚待讨论。"},
  {"key":"warrants","name":"案件、通缉与易容","placement":"建议后议","kind":"候选玩法","section":"5.4、5.5","links":["contracts","events","reputation","relations","rumors"],"existing":["rivals"],"note":"旧稿另提官府通缉。若追查成为常规玩法，再为具体案件、证人、辖区和身份识别立项。江湖口碑与某一桩案件分别记载。","body":"若纳入追查玩法，一桩具体案件可记录涉事人物、证据、辖区和追捕命令。相同口碑的同一人，在不同辖区也可能面对不同案件状态。\n\n易容与识别仍是候选玩法，何时会被认出、证词能否串联以及个案结案如何影响交情待议。"}

"articles": [
  {"key":"lilian-xiuwei","k":"levels","kind":"设定","name":"历练与修为怎么长成","summary":"从一次差事的经过找出要练的难题，学会能用的武艺，再凭换了条件的实际结果选择突破。","sections":[{"title":"实战留下可查的经历","body":"记录谁接了什么职责、看见什么、实际做了哪一步，以及人、物和队友去了哪里。一次失镖仍可有成功的救人或可回营复查的失误。旁观敌招留下可问的线索。"},{"title":"以难题选课、照来路习武","body":"向能教这门武艺的师父求教，或读解释得清条件的谱本。先练卡住的那一步，再练与同伴配合。领会快慢影响用什么教法、花多少次练习的候选安排。"},{"title":"让武艺从试用变为独立可用","body":"修习簿记录来源、完成的练习及实战条件。通过有接应的实做，且当事人确实完成自己的职责，才登记这门武艺可以独立使用。"},{"title":"突破要带着新问题回来","body":"已能独立用的招式，再用在出口、搭档、地势或义务确实改变的一次差事中。带回有结果的证据，由懂这门武艺的人指点并复练，取得一种具体用法。"},{"title":"突破改变一项做事条件","body":"例如改格接护能在备用格仍合法时重新指定护撤点，原护路同时失去保护。撤约再守可以主动收掉已经落空的救援准备，换回一次可付出的普通防守。同一次准备只选一种进阶用法。"},{"title":"突破之后怎样验成专长","body":"把已经习得的突破再用在一趟真实差事里。改格接护或撤约再守实际改变了护撤安排，替手仍需在他的位置付出反应并接成新来路。两人有完整结果后，再回师复演失败分支，才可取得临机换班。"},{"title":"适用范围","body":"候选成长按武艺和职责分别记录。已经失败、已解决或仅适合旁观的问题各有去向。课时、报酬、学习者的差异、换修成本和条件重复的判定门槛仍待讨论。"}],"links":["lilian-jianzheng","huifu-duanxi","shizhan-shiyong","huishi-potu","shoubai-jiulu","lilian-huqiao","nu-lian-jingzhi","yaohuo-jieji","zhuanchang-zhuanjing","shouyue-ke","zhaoshi-liancheng","neigong-shenfa","yunqi-tiaoxi"],"systems":["combatxp","talents"]},
  {"key":"lilian-jianzheng","k":"combatxp","kind":"修习","name":"一条历练要能回看经过","summary":"用差事、角色、处境、决定和结果，判断一次现场经历能带来什么学习机会。","sections":[{"title":"同一遭遇分别记谁做了什么","body":"盾手移开守位、照护人接到伤员、远手拉开射线，各用自己的动作与受助者结果作证。一件货或一个人的去向仍只有一份事实。"},{"title":"三种可查记录","body":"亲见却未出手可提供见闻。亲自处理但职责未完成可留下难题。亲自完成指定职责留下可用于独立使用或突破的实际结果。"},{"title":"怎样识别重演","body":"用同一门武艺、同一类障碍和已经验证的做法再办一次相同职责，可以加深熟习。路线名、敌方名称、人物衣料等变化只有改变具体选择、限制或结果时才进入突破核验。"},{"title":"凭反例也能决定下一课","body":"查结果时先问是否真的看见、有关的人是否真的到位、动作代价是否付出。任何条件欠缺都可成为针对练习，但需到场证据才能算办成。"}],"links":["shoubai-jiulu","huifu-duanxi","xiuxi-zhangbo","lilian-xiuwei"],"systems":["levels"]},
  {"key":"huifu-duanxi","k":"levels","kind":"修习","name":"带着难题排下一课","summary":"队伍只教那一步最需要改变的动作，让一次现场遭遇决定练习内容。","sections":[{"title":"找原因","body":"有同伴说援护失败。回原记录发现他听到了信号，唯一相邻格却被占。下一课练辨落点、改约或退出，照护动作可以从已经掌握的地方继续。"},{"title":"从已有武艺找解法","body":"同门解释具体条件，把一位陪练放到原来的阻碍位置。能指出落脚处时，再换一个搭档重做。"},{"title":"用资质选择教法","body":"领会快但收势不稳者直接练停止或换手。跟不上变化的人先复演一次固定来路，再加上新阻碍。不同教法用同一结果检查。"},{"title":"资源与未练成","body":"练习占当前空闲、具备的器具与陪练。一课没完成就保留实际做成的部分，并写下一课应验的条件。战地离开、换装或伤愈都可以改排。"}],"links":["huijin-shouye","xiwu-shezhi","xiuxi-zhangbo","shizhan-shiyong"],"systems":["talents","combatxp"]},
  {"key":"shizhan-shiyong","k":"levels","kind":"修习","name":"从试用到独立出手","summary":"用实际达成的职责确认一门已教武艺可由侠客独立使用。","sections":[{"title":"何时试用","body":"已有可核的示范或谱解，且在营地按约完成一次动作。第一次实做有熟手接应，了解什么情况应取消。"},{"title":"现场怎样验","body":"先看人物开始时能合法做这一招，过程中支付了相应行动与物资，再查其保护的同伴确实到达撤离点或实物正确交割。"},{"title":"安全取舍也能留证","body":"若候选做法要求遇阻先停，能在触发前如约撤掉准备并保住队友，可记为完成明确的撤守职责。对没有完成的具体招式照实记成未验。"},{"title":"将可用范围写入武艺栏","body":"熟手给出已经可独立承担的场合和依然要核的条件。拥有这门武艺后，持器、内力、落脚与身体状态仍在行动时各自检查。"}],"links":["lilian-jianzheng","huifu-duanxi","tongshi-lianglu","huishi-potu"],"systems":["combatxp","talents"]},
  {"key":"huishi-potu","k":"levels","kind":"修习","name":"带着新情境回师突破","summary":"同一门武艺要面对一次改变解法的真实限制，再学得一条有代价的进阶用法。","sections":[{"title":"先有独立使用记录","body":"能在常见情况下独立办成一次职责，修习簿中写清谁教过、练过什么、怎样验收。"},{"title":"有需要新取舍的经历","body":"撤格被占、原受助者改道、要验收的人临时更换等，都须真让某一步不能照原法走。记录学员实际完成的替代职责。"},{"title":"回师验证","body":"拿现场过程复演一次。师父可以先教与该难题相符的既有变式，验证进阶条件、开销、失效分支及会让掉哪个旧优势。"},{"title":"选突破的用法","body":"登记具体招式和适用问题，出差按要办的事选。断位接护的改格与撤约是两条候选路线，演示以一名护卫择一。同一次准备只可用其中一式。"}],"links":["lilian-jianzheng","shizhan-shiyong","lilian-huqiao","gaige-jiehu","cheyue-zaishou","zhuanchang-zhuanjing","zhaoshi-liancheng","huanshao-xuqian","xiedan-gaixian"],"systems":["combatxp","talents","skills"]},
  {"key":"shoubai-jiulu","k":"combatxp","kind":"修习","name":"失镖后各记各人的结果","summary":"将差事输赢和人物到底做没做成分开记，让撤退、救人和复盘都能影响成长。","sections":[{"title":"照实记录这一趟","body":"药货被夺，押送交割失败。照护人协助伤员到出口，盾手在听见改道后重新组织后撤。货仍由碰过它的人持有，未领取的镖银仍在原约里。"},{"title":"举出各自可查的行动","body":"照护人留下治疗与撤离结果，盾手留下做好撤守的实战证据。来不及就位的同伴可以记录自己看见的侧路和本来准备做的事，用于下次换教法。"},{"title":"补差事接着走","body":"留下的封记仍可追查，队伍可以去药铺休整，返回镖局复练护撤，或由还能出勤的人循签追失物。众人的历练对下一次选择产生不同作用。"},{"title":"机会与限制","body":"成功完成撤离职责可进入撤约的突破查验。目击、重伤或故意把同行置于危险的做法按真实后果记录，未办成的职责仍需之后实做验证。"}],"links":["chengkou-yaobiao","paoshang-qianpiao","housheng-care","lilian-jianzheng","cheyue-zaishou"],"systems":["levels"]},
  {"key":"lilian-huqiao","k":"levels","kind":"设定","name":"桥口护撤的两条突破路","summary":"以威远护卫为例，亲历、求教、试用和实战检验怎样逐步落实到一门武艺。","sections":[{"title":"原先的难题","body":"前人护住车道后，伤员仍缺一条能安全走完的退格。学员随队看懂来路，可以带这个问题请盾手教断位接护。"},{"title":"练成基础用法","body":"找固定搭档练放下原守位、指定一人和相邻格。随下一趟实际护送，原来约定的人从选定撤路安全退出，护卫完成自己的接护。"},{"title":"两种变化","body":"前次撤格在新一趟被占时，护卫按已经学会的基础法延后立势，确认旁格后护人撤出。另一种情形是伤员提前改道，护卫终止安排并把本队引回安全处。二者分别验证改格和撤约。"},{"title":"回师取得一式","body":"从自己已经验证的那条带回见证，复演并取得对应进阶用法。已经走顺的原路线可以继续练熟，突破核验需要新的问题和实际结果。"},{"title":"接着练临机换班","body":"择一突破之后，在另一趟实做里用到它，并让预定替手实际完成接防。回师同时检验替手已就位与赶不上时的两种安排，再登记临机换班。"}],"links":["gaige-jiehu","cheyue-zaishou","shouduan-huanzhen","huishi-potu","lilian-xiuwei","linji-huanban","shouyue-ke","qiaokou-liangshou"],"systems":["combatxp","talents","shieldskills"]},
  {"key":"nu-lian-jingzhi","k":"levels","kind":"修习","name":"弩手学会在该停时停","summary":"远手用有出处的视野变化练出一门节制出手、给队友报位的新功夫。","sections":[{"title":"最初的难题","body":"伏弩换点已练稳，却在烟幕里把刚听到的动静当成确认目标。领队得把这一声、最后看见的位置和真正的射界分别写进见闻。"},{"title":"回营试练","body":"请巡夜卒给两种信号，一次是真的目击、一次只是听闻。练习先取消尚未发出的远射，再按能证实的事实告诉前排一处范围。"},{"title":"临阵验证","body":"在一场真的需要护人的遭遇中，射界突然断开。学员及时停止误射，使相邻同伴依据实际观察或可听到的报告重新布置。各人所知与动作依自己证据结算。"},{"title":"突破的用途","body":"通过复练验收后可以学停弩报位。它让班组获得一条有时效的消息，付出当下发矢机会。"}],"links":["tingnu-baowei","liannu-zhuanhou","wuyan","guanzhao-dihu","huishi-potu"],"systems":["combatxp","accra","vision"]},
  {"key":"yaohuo-jieji","k":"levels","kind":"修习","name":"从验一车药到异地交割","summary":"让一次没有交好货的历练，变成验签人可以明确承担的新职责。","sections":[{"title":"最初的难题","body":"验签人会双签交货，到了回湾约好的地方才知收货人已转到另一处，中人说能代接。应先给队伍查明哪批还在车上、由谁允许转托。"},{"title":"回营试练","body":"请威远验货人重做货主、承运者和交割人的三份记录。把授权范围写到要办的这一批，再试一份看似齐全但缺有效见证的凭信。"},{"title":"实做的证据","body":"在另一票需要换人或分地交付的差事里，实际和原委托方确认过代接权限。按货签只交验成的部分，留下未处理的实物去向。"},{"title":"突破的用途","body":"再请原教者复核后学异地接签，可依已留的授权办理一处换点交割。凭信、期限和物件本身缺一项都须另议。"}],"links":["yidi-jieqian","shuangqian-jiaohuo","huozhan-yanfeng","chengkou-yaobiao","huishi-potu"],"systems":["combatxp"]},
  {"key":"xiwu-shezhi","k":"talents","kind":"设定","name":"习武资质怎么用","summary":"用观察、练习和差事检验来写人物的习武资质。关心的是在哪一步容易领会，接下来该怎么教。","sections":[{"title":"先把记录分开","body":"属性表查眼下能做多少，资质记录怎样学得进去，武艺栏列已经学会的动作及使用条件。同一个人可明白招意、擅护住一侧，却还需要多练换位。"},{"title":"看什么、怎么验","body":"从领会招意、运劲收势、身距判断、临机应变、合练与接应五个方向观察。记录教法、器具、陪练、当日伤势和遇到的具体困难，情况不清时留作待观察。"},{"title":"怎样学成一门武艺","body":"已有武学从师父示范或能读懂的谱本开始。先说明触发和代价，在营地分段演练，再用角色实际上阵或办差的结果确认哪些条件下能独立完成。每一课明确下一次要验什么。"},{"title":"允许不同进度","body":"入门快的人可以早些转入难练习，循序的同伴可用分步、熟悉搭档和复练达到同一招式要求。换器、受伤、缺陪练都单记，并允许恢复后从已经做稳的步骤继续。"},{"title":"先确定谁能用","body":"可修习武艺要有侠客可接触的来源和练成条件。敌手自有能力随所属人物、异兽或机关结算，战法与状态按适用条件生效。观察敌手可留下应对和训练线索。"},{"title":"仍待决定","body":"资质是否等级化、是否改变属性成长、每课时间、失败后保留多少进展、验证次数、上限和教学资源均待议。旧版成长星级归入原版对照。"}],"links":["shicheng-yanxi","tongshi-lianglu","shanghou-huanke","xiuxi-zhangbo","weiyuan-kaoke","guanzhao-dihu","lilian-xiuwei","zhuanchang-zhuanjing"],"systems":["attributes","levels","combatxp"]},
  {"key":"zizhi-linghui","k":"talents","kind":"资质","category":"习武基础","name":"领会招意","summary":"看一次示范之后，能指出用这招解决什么问题，什么时候应当停手。","sections":[{"title":"观察","body":"师父演示守中回锋，让学员分别说出守势保护的来路、还击触发和不宜出剑的情况。说不全就先记需要复看哪一段。"},{"title":"练习","body":"把示范拆成选定来路、承接一击和决定是否还手。先复述再换一组起手，要求学员用自己的话说何时可以沿用。"},{"title":"过关","body":"在熟悉格位按提示完成后，换一个对手，验能否在会打空时停手和留气。仅看懂招意的记录可以保留，下一课从没做稳的步骤起。"},{"title":"待定","body":"教法、谱页说明完整度和当时心境是否影响观招，每课可观察多少人。"}],"links":["shouzhong-huifeng","huifeng-jianpu","zizhi-yunjin","shicheng-yanxi"],"systems":["skills","levels"]},
  {"key":"zizhi-yunjin","k":"talents","kind":"资质","category":"习武基础","name":"运劲收势","summary":"学会把一招的用力分成起手、正在用力和收手，给下一步留出余地。","sections":[{"title":"观察","body":"教头在安全演练中标出停手信号。记录学员放完一击之后能否主动收势，和谁在何处接守。持用器物与起手空间一并记。"},{"title":"练习","body":"先比较只出一招和连续出招，练习怎样留余。换不同负重的器具复练，分别注明是器物条件变了还是动作仍不稳。"},{"title":"过关","body":"回湾药镖遇到两次交错压力，第一名护卫能退到队友身旁，把第二次护位交给真正有行动的人。耗气、被打断后的返还仍按当前候选招式。"},{"title":"待定","body":"能否与内力修习合用、练熟是否影响开销、较重器物的操练资格。"}],"links":["bulong-jin","zhongchui-zhengjia","zizhi-chidu","tongshi-lianglu"],"systems":["fatigue","ap","mastery"]},
  {"key":"zizhi-chidu","k":"talents","kind":"资质","category":"习武基础","name":"身距判断","summary":"知道越过一步会不会被牵住，换一个落脚处还能不能做原来的动作。","sections":[{"title":"观察","body":"给学员一个险口和两处候选格。先听他说明哪里够得着目标，哪里保得住同行者，再核地图真实状态。"},{"title":"练习","body":"先在可达空格演练，然后换窄桥、烟幕或异物阻挡。先学看目标格、邻格与退格，再练落点变化时取消或换招。"},{"title":"过关","body":"作为后侧援助时，他能辨认退格有没有人占用，并在受牵制的格之外给同伴留出机会。高低差、阵型遮挡与武器距离按规则各记。"},{"title":"待定","body":"用不同器物迁用时需要多少复练，遮挡和多方向牵制怎样呈现在预览里。"}],"links":["cuowei","tieshi-dibu","duangukou","zizhi-yingbian"],"systems":["initiative","ap","zoc"]},
  {"key":"zizhi-yingbian","k":"talents","kind":"资质","category":"实战修习","name":"临机应变","summary":"原先想好的路线走不通时，能从所见和所听里挑一个当下办得成的替代动作。","sections":[{"title":"观察","body":"用候选格让同伴选出一条要去的路，随后由陪练占住一个出口。记录他何时发现要改、能否说清自己看到了什么。"},{"title":"练习","body":"先约定继续、等援和回撤。每次只改变一个与目标有关的条件，复盘具体靠什么信号做了选择。"},{"title":"过关","body":"先知一条消息不全，转告队友走备位或停在安全格。没有新证据时也可以谨慎等等，让整个队伍的约定状态一致。"},{"title":"待定","body":"起手判断是否因练过类似情况而易于上手，低能见度和异常状态怎样影响。"}],"links":["qiaotou-budao","zizhi-chidu","tingdeng-jilu","huijin-shouye"],"systems":["initiative","vision","combatxp"]},
  {"key":"zizhi-hezuo","k":"talents","kind":"资质","category":"实战修习","name":"合练与接应","summary":"能明白同伴打算做什么，等条件齐全再交手、换位或把事交给别人。","sections":[{"title":"观察","body":"先让两人说清谁站哪、约哪个信号、另一侧的人负责什么。演练中查是否真的听见和能回应。"},{"title":"练习","body":"先固定搭档，再跟不同出身的同伴轮练。设一次换人受阻的分支，让未交接的人留下拒绝、提前退或请援的选择。"},{"title":"过关","body":"回湾护镖中，盾手收到约好的信号，能在相邻可达格把接应交给替手。队友实际行动、能否到达和占用的资源都各自算。"},{"title":"待定","body":"已有搭档经验能否部分迁用于新组合，信号可传多远，重复演练何时只用于复习。"}],"links":["gu-hou","shouzhu-delu","paiqiao-yuewei","shouduan-huanzhen"],"systems":["combatxp","levels","ap"]},
  {"key":"shicheng-yanxi","k":"talents","kind":"设定","name":"先辨师承再练招","summary":"师父、谱本与实战证据共同说明一套已有招式怎样进入侠客的武艺栏。","sections":[{"title":"求教","body":"残剑门弟子带来一页回锋剑谱，可试读其中的守势与收锋。完整反击条件还缺一问，由旧同门核对哪位师父能讲清。"},{"title":"拆开的课","body":"先说明何时守哪一侧，再练接住一击。下一课才加入是否付内力还手，并给对手改路时保留停手选择。"},{"title":"实战检验","body":"在有同伴能接守的差事里遇到有效起手。能以合法位置用招并按约结束，或在不该打时主动停手，都可以作为候选实战证据。"},{"title":"来源与待定","body":"每次课注明谁教、用哪段谱、能验证哪些动作。限定招法、谱页损坏、保护附带人情与能否转教须依题目另定。"}],"links":["huifeng-jianpu","guanmen-baili","canjian","zizhi-linghui","shouzhong-huifeng"],"systems":["levels","combatxp","skills"]},
  {"key":"tongshi-lianglu","k":"talents","kind":"设定","name":"同学一式，两条修习路","summary":"用断位接护比较上手快的新学员与学得较慢的老护卫，练到同一使用条件。","sections":[{"title":"第一次领会","body":"新学员很快说对触发，却习惯过早解开原守势。老护卫需要复看什么时候切换，但能选稳定的接应格。先分别标记卡住的这一步。"},{"title":"安排下一课","body":"新人加入一次突发的备用格占用，练取消接护、回到合法站位。老护卫先跟熟搭档重复报信和交接，再换同伴。两人都只用已有的盾术和有效反应。"},{"title":"同一实战目标","body":"面对一名走退路的伤员，实际守住他经过的格，及时取消失效的援护，确保接手人真正到位。用阵上结果确认能不能独立完成。"},{"title":"候选投入","body":"两人的课数、临阵状态和学费分别记。上手快主要省理解时间，熟悉守位主要省重练站位的时间，资质与阅历可以各补一处。"}],"links":["shouduan-huanzhen","zizhi-hezuo","zizhi-yunjin","huijin-shouye","xiuxi-zhangbo"],"systems":["ap","defme","combatxp","levels"]},
  {"key":"shanghou-huanke","k":"talents","kind":"设定","name":"带伤时改课，恢复后复练","summary":"一位守桥同伴无法练重盾，先保住已学会的东西，再选还能承担的职责。","sections":[{"title":"暂停的原因","body":"以眼下伤势与主人的意愿为准，把暂不宜做盾术、缺器具或缺陪练分别标在记录里。原先已习得的内容保留。"},{"title":"可换的练习","body":"可改练清点应急包、报出替手位置或与医者练可安全完成的取物。记录哪个任务真的办成。"},{"title":"何时恢复","body":"等伤势和装备重新适合原招时，从上次未做稳的步继续，校验一次队友、路线和反应额度。也可以同意长期转到更适合的职责。"},{"title":"候选条件","body":"停课耗时、转岗能保留的出勤收益、恢复后复练的验证强度由后续决定。"}],"links":["guxing-xiufu","housheng-care","yaoqian-huanshou","xiuxi-zhangbo"],"systems":["levels","combatxp","ap"]},
  {"key":"xiuxi-zhangbo","k":"talents","kind":"设定","name":"一页修习簿","summary":"用这次学的招、做成的事和下一课要验的条件把修习进度写清。","sections":[{"title":"记哪几项","body":"记录动作与来源、受教者、教法或伙伴、当日器具和状态、实际达到的步骤、还需一次核验的地方。资质观察和出勤结果各自留原来的人与日期。"},{"title":"一条示例","body":"学镖人在营地能说明拍鞘约位的备用格，实际练习时按信号收住了要走向主路的步子。受袭时还未试过，下一课换一个搭档并保留取消分支。"},{"title":"区分困难","body":"没看清信号就改练观兆，听见了却无可达格就查阵位，实际有空格而动错顺序才练动作。只给已经发生的事实记阅历，待观察的阶段保留原标记。"},{"title":"用途与待定","body":"用于安排下一课和选任当前职责。具体等级名、记几次、当场以谁为见证和进展重测周期尚待确认。"}],"links":["paiqiao-yuewei","tongshi-lianglu","zizhi-hezuo","shuxing-peiyang","huijin-shouye","lilian-jianzheng"],"systems":["combatxp","levels","attributes"]},
  {"key":"weiyuan-kaoke","k":"talents","kind":"设定","name":"威远护运课的实用验收","summary":"让学镖人处理一份真实的护送交割和一次途中变动，凭能否完成职责判断武艺进展。","sections":[{"title":"师父给的目标","body":"威远安排一车药和两条符合约定的计划路线。学员可以先管备用格和信号，也可跟货栈验封人学双签交货。"},{"title":"途中变化","body":"桥口牌倒时，守位学员要核替位人和退路。验封学员要查这一批仍在谁手里。可以另派熟手停现在的路、托管并留记或退回报告。"},{"title":"抵达时验什么","body":"守位照实际人是否安全通过判断。交割只写实到的药货，一笔签收只算一次。两条路径都可留下进步和未做到的那一步。"},{"title":"候选成本","body":"训练占人手、营地时间和可能耽误的交割。队伍真实缺人时可先让熟手上，学员只观摩，到下次再实做。"}],"links":["chengkou-yaobiao","paiqiao-yuewei","shuangqian-jiaohuo","shezhong-zhongbiao","huizhen-jiesuan"],"systems":["combatxp","levels","ap"]},
  {"key":"guanzhao-dihu","k":"talents","kind":"设定","name":"从见过敌招到练会应对","summary":"看见奇门小队吹哨换线之后，把有用的信息带回营地演练。","sections":[{"title":"实战可见","body":"先记录第一声哨、另一侧有无回应及可见的弩手移动。只知道一半时保持疑讯，避免把尚未看见的人写成已确认。"},{"title":"战后复练","body":"把这次经历交给巡夜卒。用灯下听讯辨有无回音，再与盾手演练如何守原位、放弃瞄准或改走备路。"},{"title":"进步落到自己的本领","body":"可以练成辨别可疑方向、报信和按预定退路接手。奇门双哨换线仍按对手人物和当前阵地的条件发生，记作敌手能力。"},{"title":"待定条件","body":"敌方信号的可见范围、如何判真假以及一场遇敌能留下多少可复用的训练线索待议。"}],"links":["qimen-huanshao","tingdeng-jilu","guancheng-xunye","zizhi-yingbian","huijin-shouye","chai-zhaojue","zhaoshi-liancheng"],"systems":["combatxp","skills","vision","initiative"]},
  {"key":"jinzhong-huxi","k":"fatigue","kind":"内功","name":"沉息守线","summary":"在提前准备的守位保住一口内力，应对一记重压。","sections":[{"title":"怎么学","body":"候选由固守前排的武师传授，亦可在营地读内功节录参悟。\n\n在营地只守一面，再随已知队友受一次实压，确认能守到他通过。"},{"title":"什么时候能用","body":"已在一处稳格立守的一侧出现实际重压。还够得到来势，有可支配内力和这一次可用的守势反应。"},{"title":"怎么结算","body":"交手中等该侧重压落实，再用反应和内力维持站位。若因此仍在原位，后来接防者才能按同一格况接续。"},{"title":"怎么衔接","body":"标好同伴要走的格再立势。实际接住一击后，让准备好的盾手接防，自己照剩余行动换位。"},{"title":"怎么拆解","body":"敌手可先以轻击试去反应、换到未守侧，或等受护者离开。守方若没确认起手，可以把反应留到重压真正来到。"},{"title":"代价与错用","body":"轻试若只触发普通防守，那份反应可能先用掉。确认重压后已经运劲的内力照扣，即使最后被迫挪开。起手前被迫转向只能另选守法。"}],"links":["shoushi","zhuli-dun","bulong-jin","linji-huanban","yunqi-tiaoxi"]},
  {"key":"xuqiu-tiaoxi","k":"fatigue","kind":"内功","name":"徐息调元","summary":"占一个安全空当调息，把少量内力留给下一段交手。","sections":[{"title":"怎么学","body":"候选由行旅武师带原地调息课。营地演一次开始、守到下次行动和花行动收息，再演一次护手提前离位时的中断。实做由护手见证回气何时到账，并记下当事人随后独立接回的职责。"},{"title":"什么时候能用","body":"先脱开直接牵制，在自己能稳稳立足的格安排调息。可以处在队友确实遮住来路的前线后侧，当事人仍须有动作并能维持掩护。"},{"title":"怎么结算","body":"先花一手启动原地调息。到自己下一次行动机会，若一路维持安全和稳定，选择花一手收息，随后回气。只在收息成功时记一次。会续息换位的人可以按该专长的条件转到相邻安全格再继续。"},{"title":"怎么衔接","body":"队友把近敌挡住后再选空当。练得续息换位，可在接手者已经就位时按专长保留同一次调息的步骤。"},{"title":"怎么拆解","body":"对手逼近落点、切开掩护或让守位者必先救人就能破坏安全时间。"},{"title":"代价与错用","body":"起手之后被迫离格、重新进入直接威胁或主动另做一事，就结束当前调息。到收息前为零恢复，准备和走位已经占用。掩护仍在但等不到收息时，仍可选择结束后先办急事。"}],"links":["cuzhan","zhangduan-gewei","bulong-jin","jieqi-shishou","yunqi-tiaoxi","yanqian-xifa"]},
  {"key":"yinjing-zhuanfeng","k":"fatigue","kind":"内功","name":"缓劲转锋","summary":"承一击后顺势重整兵器，为下一次出手准备。","sections":[{"title":"怎么学","body":"可向擅守势的剑师学运劲，再配合已习剑招使用。\n\n在实际接住一击后演练由守势转回普通握器，换搭档再验一次未接稳时应收手。"},{"title":"什么时候能用","body":"前一手在自己所守一侧实际招架成功，接触后余下可缓和的失衡，仍能控制手中武器，并有余气。"},{"title":"怎么结算","body":"在这次防守的后手窗口选缓劲，实际扣气，缩短这一项失衡的作用。立即还击、留向与转门等后手均在同一窗口择用。仍要用自己的行动站稳、换位或攻守。"},{"title":"怎么衔接","body":"守中回锋挡开来击后，若不适合继续反击，可选用内力缓和失衡，给之后的站稳或换位留出机会。"},{"title":"怎么拆解","body":"从原先守势外下手或让接触无法成立即可拆掉。对手连续压不同位置，仍需同伴接手。"},{"title":"代价与错用","body":"还击的机会让了出去。来势未接住或兵器先被打落时就收手；已经运劲后再遭新压，消耗照记，新发生的失衡或伤势单独结算。"}],"links":["shouzhong-huifeng","shiheng","guqiang-zhen","yunqi-tiaoxi","anfeng-dingxiang"]},
  {"key":"bulong-jin","k":"fatigue","kind":"内功","name":"一息留余","summary":"给领队一眼看出哪些动作会耗光内力，方便留一手。","sections":[{"title":"怎么学","body":"候选作为内力入门课，向任何能讲解耗气的师父求教。\n\n在一趟护撤前明确留给哪项守护，再核差事结束时余气由哪次真实用掉。"},{"title":"什么时候能用","body":"行动前可在自己的内力记录标出想留给下一手的份额，并注明用途。例如留给横枪截步的一次反应。"},{"title":"怎么结算","body":"选取耗气动作时预览花完还能剩多少。低于预留会提示，仍可确认改用；只有本次实际用气时才扣。若具体招式已锁定用气，则那一份已暂时离开可支配额度。"},{"title":"怎么衔接","body":"留出的内力可用于之后的沉息守线或撤离援护。需练经济用招时用自己可用的内力核算，决意改开销再重新看能否履约。"},{"title":"怎么拆解","body":"对手拖到行动无果、逼用其他耗气动作或让原来约的同伴改道，都能让预留用途落空。"},{"title":"代价与错用","body":"超耗会削薄后手。原计划落空可改标别的用途，按手头实际可支配的内力重算。真正的回气要在整息、调息或行息的结算点记。"}],"links":["cuzhan","xuqiu-tiaoxi","jinzhong-huxi","huanhui-heqi","yunqi-tiaoxi"]},
  {"key":"wending-xin","k":"fatigue","kind":"内功","name":"定心回息","summary":"在临阵受惊后用一次主动调息恢复注意。","sections":[{"title":"怎么学","body":"候选由能教基础调息的武师传授。\n\n在一次实际受惊后，能按约退一步定心并恢复既定职责，由照应者确认没有跳过牵制格。"},{"title":"什么时候能用","body":"人物受可缓和的惊惧，附近有能看见或听清的照应人，自己能站稳并有动作。仍处在持续贴身压迫中时先求援或退格。"},{"title":"怎么结算","body":"花一手定心，到这次定心结束前掩护和联络都还成立，则缓和本次惊惧，再按当前战意选择动作。想补内力时，另外用能完成的回气。"},{"title":"怎么衔接","body":"先用同袍应声辨明能去处。到有余量和掩护的格，主动花一手稳住，再决定是否回原来岗位。"},{"title":"怎么拆解","body":"让人物始终受贴身牵制，或切掉他知道的后援，会使定心的条件难维持。"},{"title":"代价与错用","body":"过程中被迫移动、照应走散或重新被压住，就按实际状态提前结束。已经用掉的动作仍记，后续须自己决定撤退或再试。"}],"links":["tongpao-huying","guxing-xiufu","cuzhan","yuansheng-wenche","yunqi-tiaoxi","luobu-jiezhao"]},
  {"key":"jianghu-chushen","k":"background","kind":"设定","name":"出身、招募与去留","summary":"看一个人从哪里来、进队时会什么、答应了谁，以及这趟江湖还能学成什么。以下为出身档案的候选写法。","sections":[{"title":"出身、师承和资质","body":"出身记录来历、旧行当和接触过的环境。师承记录已有武学的来源和仍然有效的约定。性情、资质、伤势和实际掌握的武学各有记录。队伍开局另定初始人手、家当和当局目标。"},{"title":"怎样遇见与入队","body":"先由地点、差事、旧交引荐或求助触发相遇。见面后再查本人意愿、当前职责和谁可以证明来历。可以约一程、雇一趟、长期结伴、仅向其求教或暂不同行。不同类型各自约明酬劳、期限和退出方式。"},{"title":"入队时要核什么","body":"登记眼下能使用的本领、随身物及拥有者、已发生的伤势、未结差事和答应过的人。能分辨货签、会辨兽踪这一类经验可提供选项。兵器、招式和站位在实际交手里决定同伴能做什么。"},{"title":"历练与转向","body":"让同一出身有两条以上可走的路。先靠已有本事承担查路、护货、照料或修缮，再经训练、求教师父和研读已有秘籍学习新职责。资质主要影响学习过程，成长速度和上限待议。"},{"title":"旧约与去留","body":"欠款、师门请托、地方亲友和当前雇约分别记。遇到催书、旧债或义务冲突时，先让当事人提出选择，再以查证、协商、办差或分路结算。离队时记录人物去向、未付报酬和带走的物件，重逢时可沿用本局记录。"},{"title":"出身际遇怎样落地","body":"每次际遇绑定实际在场的人、可查的事由与地点。樵夫辨林路可以给出走法，领队仍可查路或改道。采用建议后根据真正经过的路径、交付物与见证人结算；旧事何时能再次出现待议。"},{"title":"仍待确认的规则","body":"招募地点和稀有度、薪酬、开局装备、属性区间、特殊事件触发频率和离队条件都仍待确认。原版数值页保留为资料入口。出身档案里的本领、随身物和事件属于设计候选。"}],"links":["jiaokou-biaotu","huigu-langzhong","canmen-xuetu","cizhi-yaoyue","huijin-shouye","guxing-xiufu"]},
  {"key":"dulou-chuangong","k":"background","kind":"出身","name":"桥头渡工","summary":"以摆渡和打理系船处为生，关心水位、载重与两岸真正接货的人。","sections":[{"title":"招募与入队","body":"过渡时遇见他正在交班。帮他确认这一程有替班人，可以另约他给车队查水路。"},{"title":"起步本领","body":"可能带水记、木篙和一份过渡记录。能向老船户问到雨后哪段岸浅，仍需确认当天水情。"},{"title":"人情与旧约","body":"替旧货主收的渡钱、代保的东西和自己的器具分别清点。若还有人等船，可先安排替班再出发。"},{"title":"历练与转向","body":"可做水路绘图人和行囊管事，也可经协作练贴石下步，带着轻装照应弯岸撤离。"},{"title":"出身际遇","body":"两岸各有临时货点，一处可过人，另一处才过车。核明后可以分送、等水落或退回改走山道。"}],"links":["tujing-kantu","tieshi-dibu","chengkou-yaobiao"],"category":"乡野生计","role":"查渡路、照应车辆装卸"},
  {"key":"liangzhan-zangfang","k":"background","kind":"出身","name":"粮栈账手","summary":"做过粮栈账手，擅把一包粮、一个收货人和一笔款对上。","sections":[{"title":"招募与入队","body":"在地方粮栈对款时认识。先付做一单的酬劳，办完再问是否愿随队接长差。"},{"title":"起步本领","body":"有自己的算盘、抄账册或具时点的签收条。现有余钱与未到手的货款分栏。"},{"title":"人情与旧约","body":"离岗前把未到款的货单交给原栈人。队伍新账从实际入队日开始，旧雇主的钱仍归原栈清算。"},{"title":"历练与转向","body":"可当报酬和行粮管事。愿意练武可先做后侧接应，以守好撤出的人物为目标。"},{"title":"出身际遇","body":"一张货单收款盖了两次章，实则只有一次到货。可以查实际物料、重新一起签单或先暂停结酬。"}],"links":["fengjian-biaoji","hunliang-bag","huizhen-jiesuan"],"category":"市井行旅","role":"核粮款、辨已交和待交"},
  {"key":"guancheng-xunye","k":"background","kind":"出身","name":"关城巡夜卒","summary":"轮值守过关口，熟悉声音从哪传来、同伴到不了时由谁接位。","sections":[{"title":"招募与入队","body":"从城门查夜、岗棚更换人手或已办解差后相识。若有眼前的换防职责须先妥当交班。"},{"title":"起步本领","body":"常带更牌和便于夜行的旧具。知道如何划定自己看守的来路，其他方向要同伴配合。"},{"title":"人情与旧约","body":"警戒信号只对听到的人生效。有旧队求援时仍需核时点、实际调令和可到达路线。"},{"title":"历练与转向","body":"可跟盾手练守一侧和截角接手，也可发展成队伍斥候与休营安排人。"},{"title":"出身际遇","body":"夜间警号重复却无人报到。可派人核一个来路、留人保护车辆或先按脱离路线撤出，形成不同后续。"}],"links":["shoushi","zhezhuo-jiejiao","tongpao-huying"],"category":"战阵与守备","role":"守夜换班、约应声"},
  {"key":"yizhan-maguan","k":"background","kind":"出身","name":"驿棚马倌","summary":"在边路驿棚照料过驮兽，更关心伤足、饲料和车队真实能走多快。","sections":[{"title":"招募与入队","body":"经驿棚管事或护送牲畜时结识。确认哪些牲畜由原主人领回，哪位马倌被准许离岗。"},{"title":"起步本领","body":"有鞍绳、料袋和标有水草点的旧记。能辨载货太重是否需要分车，武艺另看训过什么。"},{"title":"人情与旧约","body":"领走别人托养的驮兽需另定费用、回还和损伤处理。本人受聘和牲畜同行要分别同意。"},{"title":"历练与转向","body":"可做专门管驮者和车路调度。需要入阵时也可习扶退换守，先护走车边队友。"},{"title":"出身际遇","body":"一头驮兽受惊走丢，先核货包和出走方向。可呼叫邻站看守、减载续行或停留搜寻。"}],"links":["tujing-kantu","xuway-shou","hunliang-bag"],"category":"乡野生计","role":"管驮畜、估下一段运力"},
