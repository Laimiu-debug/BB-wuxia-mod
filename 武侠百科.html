  {"key":"tiepu-xuelu","k":"background","kind":"出身","name":"铁铺学炉人","summary":"替铁铺试过器具，认得一般损耗、需要返坊的损伤与不同器主的标记。","sections":[{"title":"招募与入队","body":"在工坊补兵器或收回旧作坊工具时结识。提出先随一次修缮，合适才另谈留队。"},{"title":"起步本领","body":"可能带磨损样件和工作手记。营地能做的是备料和小修，凡需工坊者另列。"},{"title":"人情与旧约","body":"工坊余料和已订给客人的零件仍属原约。用一份修料之后，与炼器师或队伍共同更新余量。"},{"title":"历练与转向","body":"可专治行囊中的修具，也可熟习重锤收势后兼当持锤守位。武学由师父与实战核验。"},{"title":"出身际遇","body":"看见盾缘上的旧标记和同队遗失器具相似。可核原修账、补好后送回，或先借一件普通盾顶上。"}],"links":["bu-jia","jishi-xiuliao","zhongchui-zhengjia","zhuli-dun"],"category":"工艺百工","role":"查兵刃磨损、分修料"},
  {"key":"huozhan-yanfeng","k":"background","kind":"出身","name":"货栈验封人","summary":"经手过货栈封签，擅辨是否同一批物、同一个带货人。","sections":[{"title":"招募与入队","body":"在失货认领或商队换路时请他确认一回封签。本人可以跟队到指定验收点。"},{"title":"起步本领","body":"有不同货栈的对照样和见证姓名，能记录新旧封记。不确定时标明还缺谁的证词。"},{"title":"人情与旧约","body":"受一方委托查封却被另一方求改签，应说明自己代表谁，另找独立见证或拒绝。"},{"title":"历练与转向","body":"可发展为追货查验和队内账手，也能沿城关熟路练就守车、送信的兼职。"},{"title":"出身际遇","body":"鬼市场上出现相同外包装、批记不同的两份药。查封人能留证，但最后是否认货仍由材料和双方约定决定。"}],"links":["guichang-shihuo","fengjian-biaoji","paoshang-qianpiao"],"category":"市井行旅","role":"查封签、做交割见证"},
  {"key":"jiaokou-biaotu","k":"background","kind":"出身","name":"关口学镖人","summary":"能读简单货单，跟老镖师认得各关交替处。队伍可从学徒契约逐步让他兼顾验签与守车。","sections":[{"title":"招募与入队","body":"在威远交接一车货时认识，先请镖师确认本轮学期或请托是否结束。再谈雇作脚夫、领路或逐步出勤。"},{"title":"起步本领","body":"有旧关签与一截车绳，会记录到站与发货人。若要持盾或领枪，须登记从谁学过。"},{"title":"人情与旧约","body":"原来师徒的交接和不误持有人的随身器物分别处理。查路与守线是两份职责，可单独接受。"},{"title":"历练与转向","body":"善货单者可做随队验货，善站位者可学错步和守狭口。初始资质普通也可沿任一路练起。"},{"title":"出身际遇","body":"那份原关签的持有人改口说没交货。可复查签收处、另找副手或请他在桥口辨重复的货记。"}],"links":["weiyuan","chengkou-yaobiao","cuowei","fengjian-biaoji"],"category":"市井行旅","role":"过关交货、守车轮值"},
  {"key":"huigu-langzhong","k":"background","kind":"出身","name":"回谷学医人","summary":"曾在回湾药铺帮人清点药包与交割，知道药材从哪来和谁经手。","sections":[{"title":"招募与入队","body":"在药铺交料认识。先约办一程补给还是承担营地值班，本人愿接受再去训练临阵照护。"},{"title":"起步本领","body":"有记货小册和便携照护包，能看见物资扣减与补充。对于未知药材先交药师辨别。"},{"title":"人情与旧约","body":"给药铺承诺的交货期限可影响本次差事。谁能取走余药和如何照应既有伤员要分别说明。"},{"title":"历练与转向","body":"可进阵做照护并与盾手练接位，也可留在后方做验料与养伤调度。自身伤情同样纳入。"},{"title":"出身际遇","body":"货铺急缺同一批药，有人愿高价转卖一部分。先请学医人查已经受托给谁，之后选交足、报告缺口或寻新货。"}],"links":["housheng-care","huiwan-yaopu","linzhen-kit","yaopu-jiaoliao"],"category":"工艺百工","role":"应急包补给、相邻照护"},
  {"key":"canmen-xuetu","k":"background","kind":"出身","name":"残门旧学生","summary":"跟过残剑门数位同门中的一位，留有一件能查的旧记。懂基本收锋，尚需证明学到了哪些可用剑招。","sections":[{"title":"招募与入队","body":"由旧同门、失物相认或护过一处落脚地引见。说明需先寻亲还是已能加入新队。"},{"title":"起步本领","body":"可能带试剑短具与旧记。以能够回述的武艺作为起点，旧记只用于确认同门和再求教。"},{"title":"人情与旧约","body":"师门召回和随队原来差事各有承诺。若将信物交给他人，持有人及求教条件随结果更新。"},{"title":"历练与转向","body":"可循剑谱学守中回锋，或与持枪持盾的同伴从错步练出接位。也可先用轻身本领护行货。"},{"title":"出身际遇","body":"收到催书时旧址已有人先到。可带信迟赴、暂请人守现差或自持旧记去找同门。"}],"links":["canjian","huifeng-jianpu","cizhi-yaoyue","shouzhong-huifeng"],"category":"江湖武事","role":"持剑试手、核师承"},
  {"key":"xingqing-shezhi","k":"traits","kind":"设定","name":"性情、禀性与同伴反应","summary":"从同一件差事里看同伴怎样取舍、受触动和调整。档案中的情境与效果均为候选。","sections":[{"title":"长期特征怎样记","body":"性情记录人物平日处事的倾向。禀性记录体质、视野或学习节奏。履历记录幸存、擂斗与曾任身份。出身、师承、已有武学和当前职责分别记录，再由一件具体差事把它们联系起来。"},{"title":"心境、战意与关系","body":"心境随日常损失、休息与谈话变化。战意应对临阵威胁、同伴伤亡和站位压力。胆魄是承压能力的一项参考。人物与领队的关系依用人、履约和旧交发展，同一人可同时忠义、畏惧异兽，并在露出退路后继续担任护卫。"},{"title":"触发前先让人看见事由","body":"记录具体情境、当事人、可见征兆、人物提出的选项和结果。急躁可在时机紧张时催促先动，谨诺可在接差前要求核时限。两人同场时都可提出意见，再依据站位、已知消息、承诺和身份选择能办到的行动。"},{"title":"相似特征如何区分","body":"怯懦着重险事之前反复顾虑退路，胆怯着重突遇威胁时战意动摇，犹豫着重在信息或指令冲突时迟一步。勇敢着重知险后愿意帮忙，无畏着重眼前威吓下仍站得住，视死如归着重为具体承诺自愿担较大风险。"},{"title":"陪练、照应与调整","body":"受惊者可退到有接应的位置，初学慢的同伴可以拆步练习，体质有限的同伴可按出勤和装备换岗。性情变化可来自多次有记录的经历与个人选择；需要缓解多长、哪些属于暂时状态，依各条的候选边界。"},{"title":"结算和待定","body":"同一件事先结算实际行动、伤势与物资，再更新心境、关系和履历。候选按触发来源查能否重复表现。所有影响数值、取得和消退条件、叠加规则、触发频率及初始生成方式仍待讨论。"}],"links":["jin-nuo","gu-hou","yu-ju","xi-ju","ji-xian","gao-nan","jianghu-chushen","huijin-shouye"]},
  {"key":"jin-nuo","k":"traits","kind":"性情","name":"谨诺","summary":"他愿把酬银、期限和可以止约的情形说清，再决定是否签单。","category":"同伴与承诺","role":"定约前问清各方要做的事","sections":[{"title":"关联情境","body":"有人提出护送、接替或兼接第二趟时，他先复述现存职责，再问两个日期能不能同时做到。"},{"title":"行动与选择","body":"给双方另议时限或找替手的选项。除非本人答应或约定实际变化，原先的职责照常记。"},{"title":"应对与变化","body":"可配合验货人与传话人用同一份凭信查承诺。多次实际兑现或重订能影响当局关系。"},{"title":"候选际遇","body":"药镖走到中途，另有旧相识提议护送一批货。谨诺者可先核两批货的到期日，再提接受、分人或谢绝。"}],"links":["chengkou-yaobiao","huozhan-yanfeng","cizhi-yaoyue"]},
  {"key":"gu-hou","k":"traits","kind":"性情","name":"顾后","summary":"整队出发时主动问接应者、担伤员的人和下一处可退格。","category":"同伴与承诺","role":"布阵时会先问最后撤的同伴","sections":[{"title":"关联情境","body":"队伍站位可分前后，有已经安排的后方同伴或货物，且他掌握现有计划。"},{"title":"行动与选择","body":"可建议换队列、留一名后卫或说明谁先撤。实际护卫与撤出需用对应招式和行动。"},{"title":"应对与变化","body":"给可见信号与接替条件。遇两个不同的撤路请求可先核路线，伤员安排逐个落到人。"},{"title":"候选际遇","body":"临近狭口，查路人发现原先选的退格只容一人。可应其建议留尾队先撤或把货车放到第二条通路。"}],"links":["cheluzhen","shouzhu-delu","duangukou"]},
  {"key":"yu-ju","k":"traits","kind":"性情","name":"凭据再议","summary":"讨论失货与认人时，把知道什么、谁这样说和能否复核先写明。","category":"行事与取舍","role":"倾向等可查的证词或物证","sections":[{"title":"关联情境","body":"有两种说法指向同一笔履约或同一人货，并有一条可查线索。"},{"title":"行动与选择","body":"可以暂停对账、要求再验一次、或按少有争议的部分先办。真正权属依交割结果。"},{"title":"应对与变化","body":"对每条消息说明时点、来路与是否亲见。原先的核验请求在满足条件后应收束。"},{"title":"候选际遇","body":"鬼市有个中人把远处听闻说成亲眼交货。他会提出找真实见过的卸货人，而不直接判货已易主。"}],"links":["guichang-shihuo","yaoqian-xiaoxi","fengjian-biaoji"]},
  {"key":"xi-ju","k":"traits","kind":"性情","name":"惜具","summary":"每次收队会查哪件衣甲损坏、实领材料还有多少。","category":"行事与取舍","role":"在意器具和修料如何用到位","sections":[{"title":"关联情境","body":"确有器物耗损或队伍提议采购、换领、改装时出现。"},{"title":"行动与选择","body":"可以把预计更换的护具改为短修、转给适合使用者，或留一份修料处理更紧急的地方。"},{"title":"应对与变化","body":"在可靠性和省料之间做具体核算。需要返坊的旧器具要留足修缮时间。"},{"title":"候选际遇","body":"两面盾同时要修，他建议先修下一段确要用的那面，然后按实际余料决定是否换另一面。"}],"links":["jishi-xiuliao","zhuli-dun","bu-jia"]},
  {"key":"ji-xian","k":"traits","kind":"性情","name":"记险","summary":"探到熟悉的险口时会指出前次自己在哪里失位、谁能出手相助。","category":"阅历与身份","role":"会用亲历险情复查相似路线","sections":[{"title":"关联情境","body":"人物曾亲历一处险情，有可信的当事人与前次落点，当前环境仍有可比较处。"},{"title":"行动与选择","body":"可指出一次可核的预警格、备用路或注意事项。新地势还要由队伍当前所见确定。"},{"title":"应对与变化","body":"查明哪些条件已经改变。成功退出或找回线索可作为复盘记事，后续进展以局内经历记录。"},{"title":"候选际遇","body":"再次走桥口时他记得牌曾倒下，却发现新牌改了朝向。可核两段车辙、重新约护车顺序或走查过的旁路。"}],"links":["qiaotou-budao","tujing-kantu","huijin-shouye"]},
  {"key":"gao-nan","k":"traits","kind":"性情","name":"早报难处","summary":"能向可听见自己的同伴清楚说出哪一步做不了、还可帮什么。","category":"胆气与心境","role":"会在出勤撑不住以前说明情况","sections":[{"title":"关联情境","body":"当前职责发生可见变化，例如受制、器具损坏或下一处落格已被挡。"},{"title":"行动与选择","body":"给队伍提前改派、延后一步或交由相邻人接位的选择。支援照各人的可用资源结算。"},{"title":"应对与变化","body":"让当事人能公开报状态，并记录替换由何事引起。有训练空间时在营地练信号与短距接应。"},{"title":"候选际遇","body":"看护伤员的人发现应急包已耗空，提前报讯。可以让人递药、先移出受压格或在撤后再照护伤势。"}],"links":["yaoqian-huanshou","housheng-care","xuway-shou"]},
  {"key":"neigong-shenfa","k":"fatigue","kind":"设定","name":"内功与身法","summary":"内功决定什么时候有气可用，身法决定人能走到哪里。三套武学分别处理护撤回气、交手收势和负物过险。","sections":[{"title":"先在一件差事上练会","body":"先找师父和陪练，选一项要办成的事，再按词条过营地验收。实做时有熟手接应，回营记录当事人的用气、落格、接应人和结果。这个记录决定哪式可独立使用。"},{"title":"突破来自条件真变了","body":"会雁签行息后，若实战中原哨受逼而有人确实补守，亲自处理过护送，再回师练换哨续签。会贴槛分程后，若狭路实封且亲手处置货物、带人改路，才有卸担改线的突破证据。"},{"title":"一手一手完成","body":"先查有气可用、是否仍能动、谁守来路，再看对手有没有应招。只在词条指定的步骤付内力或回气。脚步真的到格后，才会取得新的距离、方向和后手。"},{"title":"同一个窗口只能选一手","body":"留住守向、转身换门、单剑止锋回护，若都从同一次架住来势取得机会，只能选其一。各招按自己的行动、内力和兵器条件结算。需要队友接应时，队友得自己到位、确认和出手。"}],"links":["yunqi-tiaoxi","luobu-jiezhao","yanqian-xifa","shoufeng-menfa","duangu-danfa","zhaoshi-jiaoshou","lilian-xiuwei"],"systems":["levels","skills","zoc","ap","initiative","mastery"]},
  {"key":"yunqi-tiaoxi","k":"fatigue","kind":"修习","name":"内力怎么练、怎么花、怎么回","summary":"用练成的办法分配当局能支配的内力，算清锁住的份额、已花的那一笔和何时真正回到手上。","sections":[{"title":"内力从哪儿用起","body":"人物有当前内力和能容纳的上限。入门先学认气、留余和安全调息，由老师改变一次来路或接应，让学员知道该继续还是停。出师要求在实战中用节省下的内力办成一项职责，或在有掩护时回气并重新接岗。"},{"title":"预留、扣除与收招","body":"招法若写明起手锁气，先从可支配额度划出，到了词条指定的一步才实际扣除。提前撤招则解除尚未使用的锁额，已经起步、出手或消耗的照实记。一息留余只标记想保留多少，警告后可以主动花这份气。招式要求内力时也要各自查行动或反应。"},{"title":"少气或用尽时","body":"普通走路、未加运劲的普攻和基本防守按行动、牵制和状态结算。气不够时可据此退格、请求队友接手或守到换班。负重和伤势决定某些路段能否走以及能否维持运劲，也按每式的实际条件判断。"},{"title":"交手怎么回气","body":"脱开直接压力后，未学专门心法也可花自己的行动整息。开始时确定能站稳且有退出当前威胁的路线，等到自身下次可行动前仍满足条件才结算少量恢复。徐息调元采用原地调息，雁签行息按两个路标到点结算。每人同时只能维持一项回气，最多回到内力上限。"},{"title":"回气何时中断","body":"起手后被迫离格、失去站稳条件，或敌手实际到位使该法要求的安全条件丢失，便结束相应回气。主动另起攻击、运劲或照护也会结束当前准备。到结算点之前中断时，本次恢复为零，已经做过的动作仍占用。若掌握续息换位，在照应者已接稳时可按专长主动转移一次。"},{"title":"交手结束后","body":"退到安全集结处，可以安排休息与轮岗，把可用于恢复的时间写进差事经过。内力回稳和调养伤势各自完成，营地正式休整的时长、回气量、负重上限仍是平衡议题。"}],"links":["neigong-shenfa","bulong-jin","xuqiu-tiaoxi","jieqi-shishou","cuzhan","yanqian-xifa","lilian-jianzheng","huishi-potu"],"systems":["levels","ap","skills","injuries"]},
  {"key":"yanqian-xifa","k":"fatigue","kind":"修习","name":"雁签息法","summary":"队伍撤过有两处清楚路标的短廊时保留一段节奏，在队友守住的第二处回气。","sections":[{"title":"用路标来练","body":"先跟查路绘图人走两段相连的小径，镖师在第一签让学员复述第二签的方向和护哨的信号。营地复做一次确认信号和一次信号缺失；实做要让伙伴到第二签接上当事人的守位。"},{"title":"先走第一签再看第二签","body":"护哨先确认能压住会来扰的一侧。习练者花行动到第一签，下一行动才继续。一切按原约完成，到第二签才补气，用余下合法行动做守中回锋之类的接招。护哨会断位接护时，也只在真实威胁与经过条件齐备后出手。"},{"title":"已经看见封路","body":"在第一签看见第二签被游斗者抢占，第一段花费保留。若先标的相邻旧格仍通，后哨已守开这侧，自己还留有反应，可用回签步提前撤回，回气为零。若两头都有牵制，就原格求援。"},{"title":"回师能长出什么","body":"曾在差事里遇到原哨受逼，由新哨实际接防，自己收掉旧准备、走完后段并守稳新位置，才可拿双方的记录练换哨续签。复练让替手有一次迟到，要会在掩护中断前放弃调息。"}],"links":["yanqian-xingxi","huanqian-bu","huanshao-xuqian","yunqi-tiaoxi","jieqi-shishou","duanzhi-yinban","qiaokou-liangshou"],"systems":["levels","combatxp","skills","zoc"]},
  {"key":"yanqian-xingxi","k":"fatigue","kind":"内功","name":"雁签行息","summary":"沿两处已认清的路标分两次走，确认第二处有人守住，抵达时才回气。","category":"雁签息法","sections":[{"title":"怎么学","body":"跟查路绘图人勘两处相连的可停格，再向威远镖师学在行进中稳住节奏。试练一次护哨应答和一次隔绝信号。到差事里亲走两段、在第二签安全回气，并紧接着接回守位，才验为独立可用。"},{"title":"什么时候能用","body":"还未开另一项回气，没有贴身敌人的有效压迫。事先看清第一签和第二签，两个路标各有连续的可走路段。护哨在能压住所约来路的位置，已经确认能看见或听见同行的信号。"},{"title":"怎么结算","body":"用自己的行动抵达第一签，第一次只记已经走完的路和所做的准备。下一次自己能行动时，仍具备掩护、路段和信号才继续。第二次付移动，抵达第二签时回一笔内力，受人物回气上限约束。"},{"title":"怎么衔接","body":"护哨可以先用盾前让步或正常接防打开路段。第一签发现封路时，可以放弃回气并请求接护，学过回签步者可选择退回刚走过的一格。完成回气以后，用实际剩余行动和新的距离接守势。"},{"title":"怎么拆解","body":"对手可在第二段开始前实占其中一格，让护哨离开掩护位，或隔掉双方约定的信号。任一必要条件在回气完成前失效，基础行息就结束。"},{"title":"代价与错用","body":"两个路段分别用正式移动行动。误拿假讯当守住，走完第一段也只保留走过的路，不发回气。行至第二段被迫停下时，停在最后合法格或实际被迫落位，起过步的行动照实扣。"}],"links":["yanqian-xifa","huanqian-bu","huanshao-xuqian","duanzhi-yinban","shouduan-huanzhen"],"systems":["levels","ap","zoc"]},
  {"key":"huanshao-xuqian","k":"fatigue","kind":"内功","name":"换哨续签","summary":"第一签换实际在位的护哨，保留同一次行息，仍要走到第二签才回气。","category":"雁签息法","sections":[{"title":"怎么学","body":"独立习得雁签行息。后来原哨受逼，亲自按基础规矩收掉行息，由替手接守，走完后段并实际接岗。带双方的见证回威远复练连续掩护和发生空档两种局面。"},{"title":"什么时候能用","body":"行息只完成第一签，原哨还守得住但需要撤。替手已经到位，以自己可用的守势接同一条来路，双方确认交接时，通向第二签的路径仍可用。"},{"title":"怎么结算","body":"学员在第一签支付一次确认行动，先让替手建立掩护，再解除旧哨的准备。第一段留在原先的行息记录里。下次走到第二签才回气，回气总共结算一次。"},{"title":"怎么衔接","body":"用交替断后安排哪名护哨先守。原哨完成交接后再自己走，行息者用自己后续的移动到第二签。走不到时可以改用普通撤路，或在合法时回签步。"},{"title":"怎么拆解","body":"先打断旧哨、拖住替手，或切断确认信号，都可能使交接缺口实际发生。新哨就位后，敌方仍能另行争夺第二签。"},{"title":"代价与错用","body":"多用一次确认行动和替手自己立守的成本。原哨先撤、替手迟到导致掩护脱节时，本次行息结束，双方已付准备保留；后续若要回气需开一项新的回气。"}],"links":["yanqian-xifa","yanqian-xingxi","huanqian-bu","huishi-potu","cheluzhen"],"systems":["levels","combatxp","ap","zoc"]},
  {"key":"anfeng-dingxiang","k":"fatigue","kind":"内功","name":"按锋定向","summary":"架住一招后花气记住原来路，允许下一次原格近战收势后沿这一侧保留防守准备。","category":"听锋门法","sections":[{"title":"怎么学","body":"向能教守中回锋的师父学习。陪练轮换两侧，学员要在真正接住来势时分辨只护哪面。实战用一回已保留的守向，使自己出过一手后还能在原侧合法接住后续，记录两次接触和中间的出招。"},{"title":"什么时候能用","body":"已付自己的反应并实际架住来招，仍站在原格，所持兵器能在该方向守。此时还有可支配的内力，并有招架成功后可作一次选择的窗口。"},{"title":"怎么结算","body":"在接触成立后实际花气，放掉立即还手，标记这一面。下一次自己的行动若是在原格用同一器具完成普通近战，收势时可续上这面守向。它只等一次合法来势，最迟在下次本人开始行动时结束。后续招架仍付届时可用的反应。"},{"title":"怎么衔接","body":"先以守中回锋的守法接住，再在还手、按锋定向或条件齐备的单剑止锋回护中选一手。已经选择留向后，先查能否在原格普通出手；要换门退开就用各自独立可用的动作。"},{"title":"怎么拆解","body":"前一手避开架势，便没有留向的起点。已经记向时，逼此人让位、换器或被迫转身都能结束记号；留到下一手时，也可绕到记录以外的一侧。"},{"title":"代价与错用","body":"第一次架住用过的反应和这次内力都记账。中间没在原格完成符合条件的近战，或出招被打断，守向记号失效。敌人改压另一侧时，旧气已经花在原侧。"}],"links":["shoufeng-menfa","jiedang-zhuanmen","shouzhong-huifeng","dan-jian","yinjing-zhuanfeng"],"systems":["levels","armskills","zoc"]},
  {"key":"fulou-yinxi","k":"fatigue","kind":"内功","name":"负篓引息","summary":"认定一段标作可借劲的轻载窄阶，付气为自己争取一次带货经过的资格。","category":"断谷担法","sections":[{"title":"怎么学","body":"随山路向导拿实装练习篓走一次可借劲的窄阶，再换到硬障碍前练收手。实地押运中必须由本人带货走完该段，交接人要能确认过阶前后人与货实际在哪。"},{"title":"什么时候能用","body":"人站在稳固格，下一段是地图已经标出、可借劲处理的窄阶。装载只触发该段的轻度限制，衣甲、足伤和地势仍允许，且同时有内力与移动行动。"},{"title":"怎么结算","body":"准备时锁定给这一段的气，实际起步时扣除内力和移动。只给这一名带货者这一段的通行资格；随后各自照落点和牵制结算。再走一段要拿新的行动和条件判断。"},{"title":"怎么衔接","body":"用贴槛分程先行到缓台时，可以把气留给下段，等重新查完坡脚再决定。狭路需要护手看住另一侧时，护手先自己走到位和立守。"},{"title":"怎么拆解","body":"在窄阶另端实际占位、从扶持不到的一侧施加有效牵制，或使带货者失衡，都会破坏这一步。地图上的硬障碍仍依原地形判定。"},{"title":"代价与错用","body":"看清腿脚或衣甲根本过不了时，起步前收招并解锁该气。已经起步后再被截，气和步费都记，人物按实际落点停，货仍按实际持有人或实际落点记录。"}],"links":["duangu-danfa","tiekan-fencheng","xiedan-gaixian","duangukou","bulong-jin"],"systems":["levels","ap","height","zoc"]},
  {"key":"shuxing-dufa","k":"attributes","kind":"设定","name":"侠客面板怎么读","summary":"用同一张面板分清人物底子、当前装备、临时状态与这一招实际用到的值。","sections":[{"title":"常驻与即时","body":"出身、成长和已习武艺留在人物记录。气血、内力、行动点和战意在进行中的场面里更新，头身甲另列装备耐久。"},{"title":"基础、来源与有效值","body":"候选可在每项下拆出人物底值、装备、武学、状态和当前有效值。在属性旁展开来源，能查是换头具、负重还是一次失衡改变了当前判定。"},{"title":"行动前查条件","body":"先查所见与可达格、装备和目标，再看行动点、内力或器具能否付出。候选预览可同时标出受到的拦截与哪些同伴能够接应。"},{"title":"行动后查结果","body":"本次照护、移动、出招和修缮分别按实际结果扣资源。命中、甲损、气血和战意变化在记录里有不同来由。"},{"title":"已选与待议","body":"内力接替疲劳已经选定，行动点承接回合动作额度。绑不绑原版数值、内力回气和负重修正均待定。示例用于读表和讨论。"}],"links":["huanhui-heqi","jiantou-shexian","zhongji-jiaxue","qiaokou-zhanyi","pijia-shizhuang","shuxing-peiyang","mianban-siwei","neigong-shenfa","yunqi-tiaoxi"],"systems":["ap","fatigue"]},
  {"key":"huanhui-heqi","k":"ap","kind":"设定","name":"同一回合的两笔开销","summary":"守桥时同时看行动点与内力，决定能出手、先换位还是请人接替。","sections":[{"title":"局面","body":"护卫本轮还留有行动点，已经做过一次消耗内力的截击。医者刚接近伤员，身旁有一条尚可通行的退格。"},{"title":"先查走位","body":"查看护卫能否走到侧格、是否会遇到牵制。候选让预览列出走位后还能不能出招。想加守势就再查内力够不够。"},{"title":"两种调整","body":"若行动点够而内力不足，可改普通护位、换人或先留气。若内力还有但行动点不够，可让临近队友先照护或在后方预备，等下一回合再动。"},{"title":"结算与待议","body":"两人的行为按各自的行动、耗气和物资记账。内力按所用招法的指定时点预留、扣除或恢复。反应占哪份额度和具体开销仍待议。"}],"links":["hengqiang-jiebu","xuqiu-tiaoxi","bulong-jin","shouzhu-delu","shuxing-dufa","yunqi-tiaoxi"],"systems":["fatigue","initiative","hp"]},
  {"key":"jiantou-shexian","k":"accra","kind":"设定","name":"弩手换点与射界","summary":"把看得见、射得出、能命中和护得住分成不同检查。","sections":[{"title":"局面","body":"狭口左侧有远手，桥口临时起烟。弩手在原位只知道最后一次见敌的位置，附近盾手也遮了一段箭路。"},{"title":"改变射点","body":"先确认可走的侧格和依然待发的弩具。位置改变后重新检查视野、射线、有效射程和还有没有行动额度。若射线被实物遮住，改点后再试。"},{"title":"合法开射","body":"当射线成立时，远射准头和目标远射防御才进入本次命中对照。掩护效果若已用于遮挡检查，一并标出是否还有修正。"},{"title":"结果和待议","body":"命中后再查部位、防护与实伤。射界预览、射高修正、烟幕时效、箭矢何时扣和同时出现多种遮挡的结算待定。"}],"links":["liannu-zhuanhou","wuyan","duankou-shexian","shuxing-dufa"],"systems":["defra","vision","initiative","ap"]},
  {"key":"zhongji-jiaxue","k":"dmgstat","kind":"设定","name":"重击之后查甲损与实伤","summary":"用一记候选重锤展示命中、部位、损甲、穿甲和伤势之间的关系。","sections":[{"title":"先看重击能否发生","body":"锤手亮出起手，守方可以移位、约同伴接位或准备挡住来路。达到可及格和资源条件后，先做命中检查。"},{"title":"候选分支","body":"打空则记落空与收势。命中后注明落到头还是身体，由该部位的护具承受，再按招式威力和破甲效力讨论耐久损失与气血伤害。"},{"title":"把结果分开记","body":"例如命中身体后身甲受损，部分力量造成实伤。头具耐久照其实际受击历史记录。若招式另触发脚下失衡，状态有独立的时效与解除条件。"},{"title":"仍待决定","body":"架势是否独立、招架与护体的位置、穿甲与损甲的具体算法、头部权重和伤势阈值待定。例子只展示一条候选结算链。"}],"links":["zhongchui-zhengjia","shiheng","xushi","pijia-shizhuang","shuxing-dufa"],"systems":["penetr","headchance","hp","headstat","bodystat","defme","accme"]},
  {"key":"qiaokou-zhanyi","k":"morale","kind":"设定","name":"桥口断后的战意","summary":"把胆魄、眼下战意和队内人情放在同一件事里看。","sections":[{"title":"局面","body":"回湾的药镖到了桥边，前位同伴已经负伤，后位同伴亲眼看到侧格有人逼来，原有前后两线仍可退。"},{"title":"各项各记","body":"候选先记看见了什么、当前战意变动有何来由，再参考其胆魄与援手。是否愿承担先前答应的护送职责，另查当前约定和能否安全换手。"},{"title":"应对办法","body":"可以使用同袍应声、让支盾同伴接位，或派后排先穿过已查过的退路。谁看见、听见和完成了哪一步都随场面变化。"},{"title":"结算对照","body":"若实际成功换手，记录防守、撤离、伤势和交割。安心歇息和再谈酬银是战后的心境与关系，正式战意档位和传递修正仍待议。"}],"links":["chengkou-yaobiao","tongpao-huying","cheluzhen","xingqing-shezhi","gu-hou","shuxing-dufa"],"systems":["resolve","initiative","ap"]},
  {"key":"pijia-shizhuang","k":"bodystat","kind":"设定","name":"披甲与轻装的试装对照","summary":"把头身防护、负重及视野分开看，再按同伴职责选装。","sections":[{"title":"同人试两套","body":"守线者可试披甲与榆木护路盾，游斗者可试布里行甲。用同一人对照，记录持器、头具和站位，便于查是哪件东西造成差异。"},{"title":"列清可见代价","body":"分头部、身体和盾具记保护。装了闭面头具时查视野，披甲后查能否正常转身、换位与修缮。负重与内力、先手、步法的关系仍待定。"},{"title":"用差事验选装","body":"窄口防守关注还能否持守、照应旁人和保留退路。侦路或远射关注能看清何处、换得动几步和队友遮护。结果以当次地形和用途为准。"},{"title":"实际记账","body":"不同衣甲物件各有耐久与持有人，维修消耗一笔料。改装后重新查甲具合身与状态，候选面板同时说明哪个值暂时变化。"}],"links":["buli-lijia","zhuli-dun","bu-jia","duangukou","shuxing-dufa"],"systems":["headstat","defme","defra","vision","initiative","fatigue"]},
  {"key":"shuxing-peiyang","k":"talents","kind":"设定","name":"资质、属性与实战阅历","summary":"用一段训练史拆开潜质、当下能力、做过的事和已经习得的武艺。","sections":[{"title":"看人物起点","body":"用出身确认过去的行当、能用的本领和手头家当。用资质记录学习倾向、所需指导和练习节奏。当前装备、心境及伤势影响眼下能做什么。"},{"title":"做事积阅历","body":"护货、结阵、在掩护下照护或接应撤出都能留下经历。是否给实战阅历、重复怎样计、不同贡献如何分配，均待议。"},{"title":"用一种可验证练习修习","body":"关口学镖人受教守桥，先练认来路，再试截步和照应撤退。过了某次实战，回营查哪个动作确已能做、哪项仍需继续练。"},{"title":"待定数值","body":"潜质带来的学习快慢、可成长上限、属性分配次数和受伤后怎么恢复成长尚待定。普通资质也可用合适的练习与成长路线。"}],"links":["jiaokou-biaotu","huijin-shouye","jianghu-chushen","shuxing-dufa","xiwu-shezhi"],"systems":["levels","combatxp","attributes","ap"]},
  {"key":"mianban-siwei","k":"attributes","kind":"设定","name":"四种队内职责的面板样例","summary":"用前排、游斗、远手和照护四种候选职责说明，先读哪些属性才能挑对站位。","sections":[{"title":"护线者","body":"先核头身防护、当前气血、胆魄和守势所需行动，再确认扛过第一阵后还能不能换人或退出来。榆木护路盾与持盾招式的覆盖另查。"},{"title":"游斗者","body":"先读身法先手与行动点，再看用错步或援护后还留不留得住内力。只靠先行动可能被窄格、拦截或不合身的衣甲卡住。"},{"title":"远手","body":"并看视野、射线、远射准头和已有武器。目标旁的盾和掩蔽、同伴是否挡线会改变这次机会。出手后保留撤至下一格的计划。"},{"title":"照护者","body":"优先看气血、可达格、行动和可用的应急包，以及哪位同伴能保证安全落脚。后排职责可通过求教、练习、换装和轮班培养。"}],"links":["pijia-shizhuang","shouzhu-delu","duankou-shexian","housheng-care","shuxing-dufa"],"systems":["ap","hp","resolve","initiative","vision","accra","bodystat"]},
  {"key":"huifeng-jianpu","k":"levels","kind":"修习","name":"回锋剑谱","summary":"一套从守势到一次还击的候选剑谱。","sections":[{"title":"起点","body":"全卷可解释摆好守势、观察来路、接住攻击、决定是否耗气还手的先后。"},{"title":"修习过程","body":"向剑师请教一套基本站法，再用训练格练习接住指定来路。通过后可把守中回锋放进交手动作。"},{"title":"边界与待定","body":"残页仅给练习线索。什么时候学会、能否反复研读与持有人规则待议。"}],"links":["shouzhong-huifeng","tanfeng-wenlu","guanmen-baili"]},
  {"key":"guanmen-baili","k":"levels","kind":"修习","name":"师门引荐信","summary":"用一封可追溯来源的信打开向师父求教的机会。","sections":[{"title":"起点","body":"由可信的同行者、护送对象或熟悉门派的行家递信，写明所求武学。"},{"title":"修习过程","body":"师父先看约定与眼下可教的内容。允许以一次试艺或帮忙完成尝试，结果留下对本局有效的往来。"},{"title":"边界与待定","body":"信件有明确的收件者与来处，能直接研读什么和需要进一步指点什么分别注明。"}],"links":["huifeng-jianpu","canjian","huijin-shouye"]},
  {"key":"huijin-shouye","k":"combatxp","kind":"修习","name":"营地对练课","summary":"实战遇上的难题，可以带回来用预定格位重演。","sections":[{"title":"起点","body":"挑一段实战经过，例如医者被堵、枪手反应交早，选仍能练习的同伴。"},{"title":"修习过程","body":"用有限的营地时段演练站位、信号和安全退路。做成的动作可成为已有武艺的熟习记录。"},{"title":"边界与待定","body":"演练的收益、同一场景重复次数与疲乏处理待定。真实履历仍据当场差事记。"}],"links":["shouzhu-delu","guqiang-zhen","guxing-xiufu","xiuxi-zhangbo","tongshi-lianglu","huifu-duanxi"]},
  {"key":"guxing-xiufu","k":"levels","kind":"修习","name":"老卒改换职责","summary":"旧伤或年纪改变队伍的站位，老卒仍可把阅历用在别处。","sections":[{"title":"起点","body":"当某位老兵反复无法承担原先的守位，领队与他复盘旧伤和愿意承担的职责。"},{"title":"修习过程","body":"试行后侧接应、营地对练或探路一种新分工，用一次实际差事验证合适与否。"},{"title":"边界与待定","body":"旧伤按伤势记录，协作和已掌握的武艺随人物延续。退出前线后待遇待议。"}],"links":["huijin-shouye","shouzhu-delu","tongpao-huying"]},
  {"key":"dingxuan-xi","k":"fatigue","kind":"内功","name":"拢劲回稳","summary":"把一段短时内息用在回稳脚下，准备接回原先职责。","sections":[{"title":"怎么学","body":"候选可在山地护卫课里跟熟路武人学习。\n\n先在高低格演练失衡后移至稳格，随后一次实战确实用掉内力并站回能出勤的格。"},{"title":"什么时候能用","body":"从原失衡位确实退到一个当前可稳立的格。身上仍有可通过站稳处理的临时失衡，才可花气运劲。"},{"title":"怎么结算","body":"站稳后实际耗气，提早解除这项只妨碍脚下的临时效果。若同伴先替你打开了退路，他的守势和步子各自结算。"},{"title":"怎么衔接","body":"配合贴石下步或错步，让脚下先落稳，再对付仍妨碍站位的那项失衡。练完可用普通动作守位。"},{"title":"怎么拆解","body":"占已看到的稳格，或继续施加需要先解的束缚，都会阻断运劲。"},{"title":"代价与错用","body":"稳格被占或在落脚前被截后只结算实际走位，运劲的气尚未扣。站稳后已经花气，再受重压时则按下一次新失衡另算。"}],"links":["shiheng","cuowei","tieshi-dibu","yunqi-tiaoxi","luobu-jiezhao","tiekan-fencheng"]},
  {"key":"linji-huanban","k":"perks","kind":"武学专长","category":"护卫与救援","name":"临机换班","summary":"护撤计划临时改变时，让已经到位的替手提前接起守势。","sections":[{"title":"怎么练成","body":"先练成断位接护，再取得改格接护或撤约再守。在另一趟实战中实际用过这项突破，且事先约好的替手确实守住了新来路，才可带两人的记录回威远复练。验收时故意让替手来不及，查两人能否停住未完成的交接。"},{"title":"实战改变什么","body":"战前花准备行动约一名替手和一侧来路。受护者改道或退格被占，且本次突破已处理该变化时，原护卫可以确认交接。替手在原格支付自己的反应，即可提前立普通守势，护住事先约好的另一边。"},{"title":"代价与应对","body":"原护卫实际交掉负责的守位之后，替手才可生效。替手被压住、听不到信号或反应已用，就按各自原位置应对。交接只办一次，进攻者可压住替手或从未约的方向绕行。"}],"links":["shouduan-huanzhen","gaige-jiehu","cheyue-zaishou","lilian-huqiao","shouzhu-delu","jiezhao-chengshi","qiaokou-liangshou"],"systems":["levels","shieldskills","combatxp"]},
  {"key":"chelu-liuwei","k":"perks","kind":"武学专长","category":"护卫与救援","name":"撤路留尾","summary":"退出时暂把守势留给最后一名仍在路上的同伴。","sections":[{"title":"怎么练成","body":"先能做交替断后并认得合法退格。在一次山路撤离中，亲自完成轮换，又遇到落单者晚于原信号到达，护住他通过。之后让教头复演有另一边来敌的情况，验证何时应放弃守尾。"},{"title":"实战改变什么","body":"布阵时实名指定一名最后要过的人。在自己已准备撤去的一次普通守势到期前，可选择延长到此人通过或自己下次可行动，两者先到为准。用于守尾的反应仍只护原来这一侧。"},{"title":"代价与应对","body":"推迟自己的撤离，保留的反应只能用在守尾。队友改变路线后需放掉相应侧线，不能改指另一人续期。敌人可堵最后格，或从护尾者背后迫他早点走。"}],"links":["cheluzhen","xuway-shou","gu-hou","lilian-jianzheng"],"systems":["levels","surround","zoc"]},
  {"key":"zhaohu-jiexu","k":"perks","kind":"武学专长","category":"护卫与救援","name":"照护接续","summary":"照护者来不及时，把尚未动用的照护交给有本事接手的人。","sections":[{"title":"怎么练成","body":"先学临阵照护与递药接应。实战中遇到医者被牵制或路断，要以同一份急用包照应同一位伤员，并确实办成撤出或稳定伤情。让随队照护人核器物、落格与接手时点。"},{"title":"实战改变什么","body":"已为一位伤员预备照护而尚未用药时，可取消自己的照护准备，花行动把包和约定交给相邻且已习得照护的人。接手人看到新的照护对象，仍须自己到位再使用。"},{"title":"代价与应对","body":"交接期间没有照护效果，原照护者退出这次准备。一份急用包随实物移交，接手人被牵制或已无动作时可先撤伤员。对手切开两人，便能阻断接续。"}],"links":["qiangjiu-dingxin","yaoqian-huanshou","housheng-care","linzhen-kit"],"systems":["levels","injuries","fightuse"]},
  {"key":"fuhe-lianshe","k":"perks","kind":"武学专长","category":"站位与协作","name":"复核联射","summary":"接到约定的同伴信号后，再从两个备选射位里定一个。","sections":[{"title":"怎么练成","body":"先练错格远射，再学会伏弩换点或候隙一箭。一次起烟或盾手挡线的差事中亲自配合报告换点，并验证自己从新格确实有合法射线。回营复演报告错误时如何取消。"},{"title":"实战改变什么","body":"远手在原回合花一次准备，留出主射位和一格备用点。同伴若送来相符的信号，可以在本次射击前核备用点，选择换过去，或者继续守原点。射击仍按自己所见和可付的动作发生。"},{"title":"代价与应对","body":"守候占用准备，换点的移动及装填照常收费。只保留一份待发钩，出手后另行装矢。报信者未亲见、传递过时或被敌堵住两个预瞄点时，下次再核。"}],"links":["duankou-shexian","liannu-zhuanhou","shiding-jian","tingnu-baowei"],"systems":["levels","vision","accra"]},
  {"key":"huishen-huandao","k":"perks","kind":"武学专长","category":"站位与协作","name":"回身换道","summary":"队友冲上来接应前，引路者可以在未踏入险格时转到先查好的旁路。","sections":[{"title":"怎么练成","body":"先能用折身回步与错步让位。领人过险口时遇到一处实际封路，亲自换到已清的侧路并留下后队可跟的口信。让查路人换一次障碍，验能否及时停在合法格。"},{"title":"实战改变什么","body":"移动前可选一个旁路起点，报给同行人。主路出现可见新障碍而尚未踏入该格时，可以用剩余行动改走旁路，不必走完原计划才停。后续每格重新检查牵制和成本。"},{"title":"代价与应对","body":"准备旁路耗时间，已走的格和内力照实保留。改线不牵走队友。两条路同时被封时就停，敌人可从侧格提前逼住备用路。"}],"links":["chongjie-fanbu","cuowei","duangukou","tujing-kantu"],"systems":["levels","zoc","initiative"]},
  {"key":"yuansheng-wenche","k":"perks","kind":"武学专长","category":"站位与协作","name":"援声稳撤","summary":"为受惊的人留一个可以兑现的撤退信号。","sections":[{"title":"怎么练成","body":"学会同袍应声，先在营地从近处指出实际退格。在一次有人因合围或目击队友受伤而动摇的遭遇中，确实帮助被指定的同伴自行撤到目标格。再带曾接应的人回师试一次听不到信号。"},{"title":"实战改变什么","body":"花行动向一名仍能听见并可行动的同伴约一处可自行到达的退格。此人下一次遇到符合的战意动摇时，可选择先执行所约的撤步，再按当时情势处理其余行动。"},{"title":"代价与应对","body":"仅给一人、一次退步选择，行走照耗行动。原先答应守的路需交接。敌方若占退格、隔断声音或形成牵制，状态照常结算。"}],"links":["tongpao-huying","qiaokou-zhanyi","shouzhu-delu","wending-xin"],"systems":["levels","morale","resolve"]},
  {"key":"jieqi-shishou","k":"perks","kind":"武学专长","category":"内息与比试","name":"续息换位","summary":"队友接好防线之后，调息者可以留住一段已完成的休整准备再换位。","sections":[{"title":"怎么练成","body":"已可独立用徐息调元。实战中遇到原格不再安全，先主动结束压力下的休整，队友实际接防后，到另一合法格重新完成一次调息。回师复核哪些步骤已做完、有没有多记一次回气。"},{"title":"实战改变什么","body":"开始徐息调元时约一位接手者。收到对方已经接防的确认，而且原调息尚未中断时，可主动转移一次到事先核过的相邻安全格。使用自己的移动，把已完成的准备接到后续收息。收息仍需本人行动，只在完成时记一次回气。"},{"title":"代价与应对","body":"转移照付移动，原地的照应随人离位结束。接手人与调息者各自结算动作。退格被封、接手者被逼走或中途改去出招时，当前调息结束，已用的行动保留。"}],"links":["xuqiu-tiaoxi","bulong-jin","zizhi-yunjin","lilian-xiuwei","yunqi-tiaoxi"],"systems":["levels","fatigue","ap"]},
  {"key":"leibian-hutui","k":"perks","kind":"武学专长","category":"内息与比试","name":"擂边护退","summary":"懂擂规的同伴可以把已接受的止斗约定变成一条清楚的退台路线。","sections":[{"title":"怎么练成","body":"先在有见证人的擂斗做过一次约停与交割。再遇一场受伤、止斗或双方愿延期的比试，亲自护送自愿退出者到预先说明的边线，由主持人核真实结束。"},{"title":"实战改变什么","body":"双方已接受止斗、主持人能确认时，主持或承担护退的侠客可花一次动作，指定一名参斗者和一处合法边线。被护者能在自己的时机选择按约撤步。对手收手与否及其他角色的行为仍按实际约定。"},{"title":"代价与应对","body":"护退者把这手行动用在清路与作证，自己不能借此继续抢攻。边线受阻或双方尚有争议时，可先分开请见证。实际伤势和耗用照记。"}],"links":["ring-yuedou","daobei-tuizi","mairu-xusu","lishang-duizhu"],"systems":["levels","arena","ambitions"]},
  {"key":"dan-jian","k":"mastery","kind":"兵器专精","category":"刀剑与短兵","name":"单剑·止锋回护","summary":"守中回锋接住一次来击后，可把还击机会用来护住身旁的人。","sections":[{"title":"怎么练成","body":"已可独立使用守中回锋。先在正面接住一招完成还击，再遇到同伴正经过受威胁格的情况，亲自收剑扶其退出。让剑师复演攻势改向的一手，验能否识别新的护位。"},{"title":"实战改变什么","body":"单剑成功招架且尚未反击时，可放弃攻击，把这次反应交给对一名相邻同行者的近身接护。要求能看见新的来路，接触、牵制或防御照常结算。"},{"title":"代价与应对","body":"当次还击用掉，不能同时出剑伤敌。第二次来势或不可及来路需别人接手。对方留在长兵距离或从另一侧逼近，可使这次接护失效。"}],"links":["shouzhong-huifeng","huifeng-jianpu","jianfeng-huanwei","huishi-potu","shoufeng-menfa"],"systems":["sword","armskills"]},
  {"key":"shuang-jian","k":"mastery","kind":"兵器专精","category":"刀剑与短兵","name":"双剑·分锋接替","summary":"一柄留在原方向招架，另一柄给同伴接手创造空当。","sections":[{"title":"怎么练成","body":"先习守中回锋的守法与敛锋换位，再经师父核定两柄相配。真实交手里曾用一柄撑住来路，让同伴走完侧路。再演练副手失用，确认撤步、求援或换成单剑。"},{"title":"实战改变什么","body":"双剑均可用且成功接住原方向的一击时，可把原来的还击机会改成副手牵制，用于给一名相邻同伴争取自己进入标出格的时机。两把剑各有合法距离。"},{"title":"代价与应对","body":"双手已占，交手期间取用其他器具需先收剑。副手牵制仍耗准备与反应，牵制失败或同伴到不了，就没有换位结果。对手可卡住接替格。"}],"links":["jianfeng-huanwei","shouzhong-huifeng","tongshi-lianglu","huijin-shouye"],"systems":["sword","armskills"]},
  {"key":"duan-ci","k":"mastery","kind":"兵器专精","category":"刀剑与短兵","name":"短刺·贴身留退","summary":"准备向空当出手时先留一格退路，对手反应过来前可收招离开。","sections":[{"title":"怎么练成","body":"已练拦手隔步或折身回步，再向短器师父学控制身距。实战中有一次够到目标且打完能脱离，也有一次看到陌生援手入场后收手，并确实撤出。回营核两次路程。"},{"title":"实战改变什么","body":"贴身短器的攻击还未真正发生，且对手改守或出现新威胁时，可放弃本次出手，改对早先标出的合法相邻格作一次付费撤步。牵制与截击仍会核对。"},{"title":"代价与应对","body":"放掉出手机会，准备损耗照收势规则记。需要短器可立即收手，而且新格可走。被合围或退格被占时只能停在原位应对。"}],"links":["quanjiao-gekai","chongjie-fanbu","louxu-caiwei","lilian-jianzheng"],"systems":["dagger","armskills","zoc"]},
  {"key":"dan-dao","k":"mastery","kind":"兵器专精","category":"刀剑与短兵","name":"单刀·封口递守","summary":"刀手封住来路时，可把尚未用掉的守路机会换成同伴经过的掩护。","sections":[{"title":"怎么练成","body":"独立用过横刀封口。再遇护货时己方临时有人要穿过刀路，先收住刀势并让其实际过后守住另一边。随镖师复练谁在进、谁在出。"},{"title":"实战改变什么","body":"持单刀且封口仍有效时，选一位即将经过原守线的同伴。撤去对来路的拦截，改为留一次短护接应其经过。新敌进到原拦截位时按当前普通牵制。"},{"title":"代价与应对","body":"早先的封路失去即时拦截，改护也用自己的反应。旁边一人没能通过就无法补回旧刀势，敌人可在让路时抢到入口。"}],"links":["hengdao-fengkou","dunqian-let","chengkou-yaobiao","lilian-huqiao"],"systems":["sword","armskills","zoc"]},
  {"key":"zhong-dao","k":"mastery","kind":"兵器专精","category":"刀剑与短兵","name":"重刀·止劈收势","summary":"重刀亮出起手后，若刀路被挡，可以提前收去重势并保住已有站位。","sections":[{"title":"怎么练成","body":"先会重刀迫架，实打过一次允许出手的近阵。后来遇见同伴进刀路，及时停劈并守住需要维持的格。回教头处复验同伴迟到和敌手临时逼近。"},{"title":"实战改变什么","body":"握重刀已蓄势而劈砍尚未落下时，发现同伴或被护物进入预定格，可取消本次劈砍。将仍可支出的准备改成一次维持原站位的防守，不继续把威力留给下一击。"},{"title":"代价与应对","body":"前段蓄势和抱刀时间照付，空出的进攻让对手可能回位。狭处无法转动或已遭实际打断时须按原中断流程。"}],"links":["zhongdao-poya","yankou-dao","xushi","lilian-jianzheng"],"systems":["cleaver","armskills","defme"]},
  {"key":"zhong-jian","k":"mastery","kind":"兵器专精","category":"刀剑与短兵","name":"重剑·移锋守面","summary":"制住一条来路之后，可以从蓄势转到同一站位的另一面。","sections":[{"title":"怎么练成","body":"先用可双手持的重剑练出明显可辨的起手和收势。一次实战遇敌分向接近，成功收刀并转护另一侧。复练让教者同时站在旧格和备援格，验只承诺哪一面。"},{"title":"实战改变什么","body":"重剑处于已起手状态、攻击尚未落地且脚下能站稳时，可撤销原重击，以一次反应转向一侧邻格，预备一次抵挡。若需要走位才能够到，就照常结束旧动作。"},{"title":"代价与应对","body":"先前投入用于转换和收势，原重击已作废。单次只转一个方向，耗自己的反应并须留挥器空间。对手可以贴身或争先，由队友另守弱侧。"}],"links":["xushi","shoushi","zhongdao-poya","huishi-potu"],"systems":["sword","armskills","defme"]},
  {"key":"qiang-dao","k":"mastery","kind":"兵器专精","category":"长兵与盾具","name":"枪矛·交枪分程","summary":"双枪守隘时，给下一位枪手接线的机会，前枪腾出过人通路。","sections":[{"title":"怎么练成","body":"先练横枪截步和双枪守隘。战里亲自接替一次枪线，再遇原来行路者提前折返，由你让出路并让下一人挡住可见来敌。请同一搭档查一次听不清信号时能否停止。"},{"title":"实战改变什么","body":"两名持枪武人都在已知的合法格，守线者明确撤掉自己的拦截后，可报出一处仍可控制的来路。后枪手用一份可用反应设拦截，枪手的长度和可视范围照常检查。"},{"title":"代价与应对","body":"前枪取消其拦截，后枪支付设守和后续处置的候选费用。新线未成立前没有接替结果，敌人可挤进两枪之间或绕更远一侧。"}],"links":["hengqiang-jiebu","guqiang-zhen","huiqiang-huhou","linji-huanban","huanqiang-houshou"],"systems":["spear","armskills","zoc"]},
  {"key":"gun-zhang","k":"mastery","kind":"兵器专精","category":"长兵与盾具","name":"棍杖·撑距过队","summary":"用棍端压住一处接近时，把另一处已可走的格留给带货者。","sections":[{"title":"怎么练成","body":"先会棍头撑距。狭口出手压住一名敌手后，同伴确实经过约定格。再实做一次带货队伍须绕到棍端另一侧的差事，并复练让第一个位置暂时空下。"},{"title":"实战改变什么","body":"持适合撑距的棍杖并预见同伴走线时，可预留一次撑距，把出手触发和过人的一格绑在同一个约定上。来敌要挡住这趟通行才用反应。"},{"title":"代价与应对","body":"等待期间不对其他对手出棍。通行格和敌人都需各自可及，撑距失败仍要撤货或改走。敌人拖住路过的人或从棍侧贴近时这次不成立。"}],"links":["zhangduan-gewei","shouzhu-delu","hunliang-bag","huifu-duanxi"],"systems":["mace","armskills","zoc"]},
  {"key":"ji-tang","k":"mastery","kind":"兵器专精","category":"长兵与盾具","name":"戟镗·钩位让道","summary":"把长兵位移用在打开一条已核出的通路上。","sections":[{"title":"怎么练成","body":"先学长钩挑位，完成一次把实际挡路的人拉开后护队通过。随后遇到原落格有人占用，改选另一处仍合法的落格并办成差事。回师说明何处可以牵去。"},{"title":"实战改变什么","body":"戟、镗或带钩的适配长兵施展牵引前，可同时标出可能开放的通路。落格受阻而仍可中止时，可放掉原牵引，另付一次准备改选可及的候补格。"},{"title":"代价与应对","body":"旧目标仍待原处，改选时耗行动，命中和抵抗照旧。候补格若有友军、墙体或落差堵住就暂停。对手可护要塞、夺落格或脱离可及距离。"}],"links":["goulian-tiaowei","jifeng-kaidao","shiheng","duangukou"],"systems":["pole","armskills","height"]},
  {"key":"dun-ju","k":"mastery","kind":"兵器专精","category":"长兵与盾具","name":"盾具·盾缘探路","summary":"盾手以现有盾势争取一次短探，决定后队能不能继续走这侧。","sections":[{"title":"怎么练成","body":"先会盾前让步或并盾成门。用盾真护过一名同行者，又在另一趟遇到临时推车堵过道，端盾探到实际可走的相邻边格并退回报告。请过路人与教头核是否仍覆住约定方向。"},{"title":"实战改变什么","body":"盾手在普通守势下可标出一侧邻格，移到格时只让盾面继续罩着原先可见的那一道来路，保持到看清可否落脚为止。结果只用来告知邻近同伴，其他方向照常重判。"},{"title":"代价与应对","body":"移动与持盾分别支付，换格时其他援护取消。离开原格后有人走来得由替手照应。敌人可从斜侧逼位或用硬遮挡藏住新来路。"}],"links":["dunqian-let","bingdun-chengmen","zhuli-dun","linji-huanban"],"systems":["shield","shieldskills","zoc"]},
  {"key":"fu-yue","k":"mastery","kind":"兵器专精","category":"重击与破护","name":"斧钺·见面压盾","summary":"先辨盾面还在不在，再决定是否把斧击真正落在它上面。","sections":[{"title":"怎么练成","body":"向能教斧钺的武师练明示起手和收势。先实际压过一次持盾者的护位，再遇对手主动撤盾时控制住重击并让队友通过。两次都记录盾面变化与人最终去了哪。"},{"title":"实战改变什么","body":"在较慢的劈击已经选定一面盾却尚未打出时，可以附上守盾条件。盾面仍覆盖才照实击打护具。对手收起或转盾便停手，让已经准备的同伴按新的来路处理。"},{"title":"代价与应对","body":"预备重劈照付，停手没有损盾，也没有对另一人自动转攻的机会。敌人可以用假留盾耗行动，或用另一边遮住接替者。"}],"links":["tieji-dingdun","zhuli-dun","xushi","lilian-jianzheng"],"systems":["axe","armskills","shieldskills"]},
  {"key":"zhan-chui","k":"mastery","kind":"兵器专精","category":"重击与破护","name":"战锤·分力压甲","summary":"重锤落前定好这一击用于压住护具还是追击身体。","sections":[{"title":"怎么练成","body":"先懂沉锤震甲。实战中做过一次明确的压甲，为同伴打开护人道路。另一趟遇外护已经损坏时，能看出无甲可压、收势改守，才带记录向锤师校准。"},{"title":"实战改变什么","body":"留有足够蓄势时，可公开选择把这一次命中的重劲优先用在一处仍存在的护具上，或沿已有手法照常进攻。专精的压甲只作用于已命中的部位，甲损与实伤分别登记。"},{"title":"代价与应对","body":"压甲取舍占去当次部分作用于人的威力，伤害和失衡仍待平衡测试。对手能换开护具、改变距离或等你收势。已无该护具时专精分支失效。"}],"links":["zhongchui-zhengjia","zhongji-jiaxue","shiheng","xushi"],"systems":["hammer","armskills","penetr"]},
  {"key":"jian-yingbian","k":"mastery","kind":"兵器专精","category":"重击与破护","name":"锏与硬鞭·压护留隙","summary":"用沉短器压住一面还在起作用的盾，为答应过的人留出进身时机。","sections":[{"title":"怎么练成","body":"独立用过铁锏压盾。一次实际让持盾者中断援护，队友走完计划路线。再经历对手不再举盾却仍与同伴贴近的情况，练停手然后回到守位。"},{"title":"实战改变什么","body":"持能承力的锏或硬鞭，成功压断近身对手的盾护后，可用仍留的反应继续争住盾缘，等一名预先指定的同伴通过相邻格。到同伴通过或自己下一次行动时放开，以先到为准。"},{"title":"代价与应对","body":"继续争住盾缘消耗反应，自己暂时不能换目标。离开近身或受到牵制便结束。逾期按普通收势处理。对手可推移短器持有者、换另一侧盾手或占过人格。"}],"links":["tieji-dingdun","zhezhuo-jiejiao","zhuli-dun","huifu-duanxi"],"systems":["mace","armskills","shieldskills"]},
  {"key":"bian-lian","k":"mastery","kind":"兵器专精","category":"奇门器械","name":"软鞭与链枷·先收后换","summary":"链兵试探受阻时，可以把继续挥动的机会改为结束当前链势。","sections":[{"title":"怎么练成","body":"已会落链绕盾。实战中完成一次由外侧出手并妥善收链。另一趟遇见同伴提前进入挥动侧，亲自停下防止遮住队友走法。请师父更换地形复练。"},{"title":"实战改变什么","body":"链兵正在展开、仍未完成挥击时，发现侧格被占便可主动收链，撤去这手临时牵制。收链完成后，选择用剩余行动回到普通守位或离开原受制处。"},{"title":"代价与应对","body":"要付收链的行动，未落的攻势消失。收链没有自动得手或脱离。若两边都被敌人卡住，只能请同伴帮忙、留在原处或稍后动。"}],"links":["luolian-raodun","louxu-caiwei","xushi","huifu-duanxi"],"systems":["flail","armskills","zoc"]},
  {"key":"sheng-biao","k":"mastery","kind":"兵器专精","category":"奇门器械","name":"绳镖与流星锤·截线收绳","summary":"绳兵的预定牵制线被横穿时，能撤去牵制并重新把出手器具收回可用。","sections":[{"title":"怎么练成","body":"向懂这一门绳兵的师父学独立出手和回收。实战中曾挡住一侧来敌，又遇队友必须从绳路通过，实际让路并收回器具。带取得的见证再练一次收回没有成功的情况。"},{"title":"实战改变什么","body":"候选绳兵已经形成临时牵制线且仍能控绳时，放弃这次牵制、专门收回器具，为穿线者空出格。器具成功回到持有人后才可在后续合法时机再选出手方向。"},{"title":"代价与应对","body":"收绳需要行动和能通行的绳路。敌人若踩断来路、逼迫持有人脱手或占住绳端，可令器具仍待处理。会留同一件器具的实际归属。"}],"links":["luolian-raodun","cheluzhen","goulian-tiaowei","huishi-potu"],"systems":["flail","pole","armskills"]},
  {"key":"qimen-duan","k":"mastery","kind":"兵器专精","category":"奇门器械","name":"奇门短器·收器接手","summary":"用完短器阻拦之后，赶在同伴递物时把持器的手让出来。","sections":[{"title":"怎么练成","body":"判官笔或折扇正式入选后，分别由会用该器的师父教基础短距动作。实战中在拦住近旁威胁后果真收手接过一件要用的物品，再演练接手格被占的分支。"},{"title":"实战改变什么","body":"短器仍可收拢且一次短距拦挡已经结束时，可以声明先收器，给自己与相邻同伴创造一次按手位进行的交接时机。接到的东西仍要按动作条件才能使用。"},{"title":"代价与应对","body":"付收器与接取的开销，使用者让掉短器接下来的防护。被近身压住或相邻方未到齐便无法交接。具体器形与收拢条件待定。"}],"links":["quanjiao-gekai","yaoqian-huanshou","shuanghuan-dun","huijin-shouye"],"systems":["weapons","dagger","armskills"]},
  {"key":"gong-shu","k":"mastery","kind":"兵器专精","category":"远射与暗器","name":"弓·换隙候发","summary":"原预瞄格被遮后，可把候发机会改给一次已经核实的旁侧出射机会。","sections":[{"title":"怎么练成","body":"先学候隙一箭，实战中亲自等到目标进入第一处合法射线。再遇同伴走进射线，能忍住、确认另一小段射界后只放一箭。回营重练第一眼看错的一次。"},{"title":"实战改变什么","body":"弓已经备妥、原候发尚未触发时，出现遮挡可选择撤销旧瞄准，花一次准备改守可亲眼确认的相邻射格方向。直到新目标实际露出才决定放箭。"},{"title":"代价与应对","body":"耗瞄准与候发，改变瞄准后原方向没有反应箭。弹药只在实际使用时扣，继续瞄准占用移动机会。敌人走反侧或配合盾面可耗掉这一轮守候。"}],"links":["shiding-jian","duankou-shexian","jiantou-shexian","fuhe-lianshe"],"systems":["bow","accra","vision"]},
  {"key":"nu-ju","k":"mastery","kind":"兵器专精","category":"远射与暗器","name":"弩·换点续装","summary":"原装填点被迫放弃时，若队伍实际接护，可以在备用格接着完成这一次装填。","sections":[{"title":"怎么练成","body":"先学伏弩换点。独立完成一次装填并在合规射位用过弩。另一次遇到装填被逼停，亲自撤到预查的掩体，由同伴实际护送，重新完成装填。弩师复核已经完成和还余哪步。"},{"title":"实战改变什么","body":"候选将装填分成可查步骤。如果在预定护卫已接住威胁时主动换到相邻合法掩护，可留存本次已完成的步骤，在下一次有实际行动时接续。未完成之前仍是未待发。"},{"title":"代价与应对","body":"移动和继续装填要付行动。暴露、受击或失去器具时按中断处理，保留的步骤只关联同一副弩与这一次弹药。对手可以迫使两处都失去掩护。"}],"links":["liannu-zhuanhou","tingnu-baowei","duankou-shexian","lilian-jianzheng"],"systems":["crossbow","armskills","accra"]},
  {"key":"touzhi-anqi","k":"mastery","kind":"兵器专精","category":"远射与暗器","name":"飞掷暗器·备两择一","summary":"开手前准备两种手投办法，最后只实际投出合用的一件。","sections":[{"title":"怎么练成","body":"跟教者学一项可用暗器，在实战中应付过一次近处干扰。后来出现敌手后退或盾手遮路，及时收掉原准备，重新拿出适用的另一件才完成掩护。回师验证两类用具归还。"},{"title":"实战改变什么","body":"候选可提前标一手适配的短距器和一手可够较远目标的器，同一次出手只选当前可达的一件。选择改变时重新核实目标和是否留得住通路。"},{"title":"代价与应对","body":"两件均在备取时占位，并付准备动作。只扣实际投出的那件，另一件仍需收回可取位置。敌人逼到没有准备空间处，两种预备都可落空。"}],"links":["tanfeng-wenlu","miuyan-fengxian","jili-bag","huifu-duanxi"],"systems":["throwing","armskills","accra"]},
  {"key":"jikuo-anqi","k":"mastery","kind":"兵器专精","category":"远射与暗器","name":"机括暗器·明示截势","summary":"用已备的机括暗器等一个可辨的起手，让对手知道何处可能遭截。","sections":[{"title":"怎么练成","body":"袖箭或针具类入选后，由懂机括的师父教已准备、可射和待续装，并实际办成一次护人打断。再遇假起手时等到真正可辨的动作，核实对应资源和结果。"},{"title":"实战改变什么","body":"候选可先标出一名可见目标及一类实际起手，在目标确实开始所标动作时才选择反应发射。仍有合法射线、距离和已备器具才可发。打断由原动作规则结算。"},{"title":"代价与应对","body":"占用准备与反应，弹药按用尽记录。目标可以用另一种来势、绕到遮挡后或等发射点受牵制。适用器种与打断结算仍待定。"}],"links":["xushi","tingdeng-jilu","duankou-shexian","huishi-potu"],"systems":["throwing","armskills","vision"]},
  {"key":"huoqi-shouxian","k":"mastery","kind":"兵器专精","category":"远射与暗器","name":"火器·失界停发","summary":"火器若纳入，演练在同行者或货物进入射线时保留安全的停发选择。","sections":[{"title":"怎么练成","body":"先通过有见证的火器课程，再完成一次能说明装填、见敌与实际发射的护送。实战出现原射线受挡时亲自停发，换位置后重新核查是否可用。"},{"title":"实战改变什么","body":"准备发射前可预置一条合法射线和可辨的停发条件。若同伴切进或遮挡突然变化，能解除此次准备并标明器具是否仍可候发，后续再从可见射界出手。"},{"title":"代价与应对","body":"准备花费照记，停发使本轮射击机会消失。再次出手仍需核器具状态、弹药和行动。时代取舍与正式是否收录仍待定。"}],"links":["jiantou-shexian","duankou-shexian","huifu-duanxi","lilian-xiuwei"],"systems":["firearm","armskills","accra"]},
  {"key":"huanqiang-houshou","k":"armskills","kind":"招式","name":"缓枪候实","summary":"可让外沿试探通过，把同一次反应留给本轮随后真正越线的人。","sections":[{"title":"怎么学","body":"先能独立用横枪截步。和同伴打两轮桥口对练，一轮让诱手只踩外沿，一轮让另一人真的踏进护送线。见证人要能指出枪手在哪一次留手、在哪一次用了反应。实做时须在护送线上拦住真正进线的人，由同行确认原来路得以通过。"},{"title":"什么时候能用","body":"持匹配枪械，守着自己够得到的一段通路，且仍有一次拦截反应。外沿试探与穿过所护通路都可能进入枪的距离，由枪手决定何时用掉反应。"},{"title":"怎么结算","body":"可让外沿试探通过，把同一次反应留给本轮随后真正越线的人。是否够得着仍按敌手实际落点判断。"},{"title":"怎么衔接","body":"与桥头布道配合时，先画出要守的线，再决定拦谁。队友完成撤离或改变退路后，枪手要重新判断站位。与另一名枪手交枪时，可按枪矛·交枪分程让后枪另行设守。"},{"title":"怎么拆解","body":"对手可以停在边上耗过窗口，也可从枪手够不到的一侧迫使队伍更换路线。"},{"title":"代价与错用","body":"留手会把这一步让给对方。误拦第一个人后，后到的人可以趁已无反应进线。守线失去的站位也不会随收势取回。"}],"links":["qiang-dao","qiaotou-budao","qimen-shiqiang","qiaokou-liangshou"],"systems":["levels","mastery"]},
  {"key":"cheling-husi","k":"skills","kind":"招式","name":"收令留路","summary":"结束这份约定。","sections":[{"title":"怎么学","body":"先学会独立用拍鞘约位，再请威远镖师安排搭档试练撤令。让旧约的接护人原地复述取消，再各自走完当前能走的撤路。差事中亲自确认撤令并让同行实际改走可用路，见证须记下撤令为何比改约更合适。"},{"title":"什么时候能用","body":"已有拍鞘约位，接令的一方还没启动约定动作，且双方仍能按当时的沟通方式确认撤令。"},{"title":"怎么结算","body":"结束这份约定。各人可按平常规则自己选路，原约占住的准备随取消结束。"},{"title":"怎么衔接","body":"没有可守的新退格时接撤约再守，以现位护住滞留者。若已经认清新退格且盾手仍能接护，可直接选改格接护。"},{"title":"怎么拆解","body":"在取消信号送达前切开联络。只有发令方握有消息时，接令方依旧按自己已有的见闻行动。"},{"title":"代价与错用","body":"撤得太早会失去原本可用的接护。喊完就走却没等到确认，会留下两个不同的撤离打算。"}],"links":["paiqiao-yuewei","cheyue-zaishou","gaige-jiehu","qimen-jieche"],"systems":["levels"]},
  {"key":"chengzhong-zhuanhu","k":"shieldskills","kind":"招式","name":"承重转护","summary":"把这次挡下后仍存续的遮护方向转给新同伴，使用盾手下一次可用行动中的收势选择。","sections":[{"title":"怎么学","body":"请盾术教头用同一面盾和两名同伴演两次接护。记录一次确有交手压力时转护成功，以及一次在旧护位仍有人时拒绝转护。实做时两名同伴都须说清自己当时受到的保护。"},{"title":"什么时候能用","body":"刚用本轮的盾反应真正挡下一次游戏判定中的来势，仍持该盾。新同伴已经在邻接可护格，旧受护人已经离开或明确承受失护。"},{"title":"怎么结算","body":"把这次挡下后仍存续的遮护方向转给新同伴，使用盾手下一次可用行动中的收势选择。第二次攻击照常判定。"},{"title":"怎么衔接","body":"首位同伴走完退格，再和随后独立靠近的同伴接上。需要护住一名走出旧格的人时，按断位接护的办法处理。"},{"title":"怎么拆解","body":"逼盾手继续守着旧受护人，或把后续来势从遮护方向之外送进来。"},{"title":"代价与错用","body":"第二人不在可护格时，转护落空。冒险放弃原护位会让旧受护人暴露，第一次已用掉的反应仍被占用。"}],"links":["shouduan-huanzhen","gaige-jiehu","shouduan-huanzhen"],"systems":["levels","mastery"]},
  {"key":"tiaosuo-jiedao","k":"armskills","kind":"招式","name":"挑索解道","summary":"用这次行动解除封道标记。","sections":[{"title":"怎么学","body":"请查路绘图人与长兵教头用演练索模拟单格封道。从一处安全格解除一次，再记录一次因看不清索端或够不到而改走旁路。后者由同伴复盘是哪条条件未到。差事里亲自解除一次封道，并确认同行实际经该格通过。"},{"title":"什么时候能用","body":"场上有可见的封道索格，角色持适配长兵，能从当前格接触可选中的索端，且有可用行动。"},{"title":"怎么结算","body":"用这次行动解除封道标记。该格随后仍要检查占位和威胁，实际通过由队友自己的移动完成。"},{"title":"怎么衔接","body":"先用观照敌户或同伴报位认清格况，解开后再与护位者确认要护哪个出口。"},{"title":"怎么拆解","body":"守索人可以用自己已有的行动换一处锚格，或派人实占解开的格。"},{"title":"代价与错用","body":"走错能接触索端的位置会先花移动。索格清了就冲进去可能迎上仍在的敌方威胁，解除动作已经用掉。"}],"links":["heifeng-luosuo","guanzhao-dihu","tujing-kantu","qiaokou-liangshou"],"systems":["levels","mastery"]},
  {"key":"gexian-fenwei","k":"skills","kind":"招式","name":"隔线分位","summary":"各自记一段可见通路。","sections":[{"title":"怎么学","body":"请熟悉报位的老哨手安排两名远攻者在一场对练里分别见证不同通道。演一次双方都看得见各自目标的报位，再演一次其中一条视线被挡后撤掉对应记号。实战由护送者确认这两份见闻各自帮助选了哪段路。"},{"title":"什么时候能用","body":"两人各自有可用报位行动，都看得到自己认领的一段通路，且能在本次交手确认各自负责哪一边。"},{"title":"怎么结算","body":"各自记一段可见通路。记录为同伴提供两份独立见闻，实际攻击仍由个人另择时机。"},{"title":"怎么衔接","body":"停弩报位给出其中一边的见闻，另一人报全另一边以后，护送者才有依据选路。发现视线中断时，先撤掉对应记录再重新确认。"},{"title":"怎么拆解","body":"挡住其中一人的视线，或逼这人腾出动作自保。剩下一边的记号只说明它看得见的那段。"},{"title":"代价与错用","body":"两人都要各花一次报位。把过时的空路记号当成现况，会让后续动作在错误落点上启动。"}],"links":["tingnu-baowei","tingdeng-jilu","qimen-huanshao"],"systems":["levels"]},
  {"key":"duanzhi-yinban","k":"zoc","kind":"身法","name":"短止引伴","summary":"可在转折之前主动结束本次移动，报告最后一处可见位置。","sections":[{"title":"怎么学","body":"跟向导练一段会断开视线的窄路，同行各走自己的路。习练者要在转折前主动止步，并在下一轮完成交接。实战里完成一次这样的独立交接，记下最后共同看见的格与各人的终点。"},{"title":"什么时候能用","body":"按可走路线行进，看到转折前有一格可以停，同行尚能收信，仍可决定结束这次移动。"},{"title":"怎么结算","body":"实际停在转折前，报出最后共同看得见的格，放弃本次余步。同行自己达到接应位置后，再按新格走下一段。"},{"title":"怎么衔接","body":"后卫用枪线或护位守住已确认的口子，再由同行独立跟上。被堵后可转入普通撤路或等护手确认可用新格。"},{"title":"怎么拆解","body":"对手可从另一侧提前占住停点，或让两人之间的通信中断。"},{"title":"代价与错用","body":"停点被抢、在到达之前被截或联络已断，只能按实际位置处理，同行可能仍照旧讯留步。选错停点，多用一手才能重新接上。"}],"links":["huanqiang-houshou","gaige-jiehu","qiaokou-liangshou","luobu-jiezhao","huanqian-bu"],"systems":["levels"]},
  {"key":"qimen-shiqiang","k":"racialskills","kind":"敌方招式","name":"奇门前哨·探步诱截","summary":"那一步确实发生，枪手可以拦。","sections":[{"title":"发动者与条件","body":"前哨在能自行撤回的外格活动，且看见枪手守住通道。用自身行动踩入枪手反应范围的边缘，先停在那里。"},{"title":"可见征兆","body":"前哨只跨一格，身体仍能退到外沿。另一边有机会出现看得见或听得见的同伙信号。"},{"title":"规则效果","body":"那一步确实发生，枪手可以拦。后续第二人还须靠自己的动作实际穿过护送线。"},{"title":"后续怎么接","body":"枪手出手后，同伴可接截撤格。枪手留手时，前哨可选择原路再退。"},{"title":"玩家怎么拆","body":"先认清谁只是到外沿、谁走向实际要守的退格。也能先调整护送路线，让这次诱截缺少后手。"},{"title":"敌手的代价","body":"前哨自己花移动并暴露一格。有拦截又没人支援时，它要独自应付这次接战。"}],"links":["qimen-jinglu","qimen-jieche","huanqiang-houshou","qiaokou-liangshou"]},
  {"key":"qimen-jieche","k":"racialskills","kind":"敌方招式","name":"奇门游斗者·截撤格","summary":"实际占住退格后挡住旧路线。","sections":[{"title":"发动者与条件","body":"奇门游斗者观察到对方先前的报位、移动或可见退势，且有可达的目标格，用自己的移动进入该格。"},{"title":"可见征兆","body":"它转身朝退口走，沿途能被看见的队员按自己的视线更新格况。"},{"title":"规则效果","body":"实际占住退格后挡住旧路线。涉及拦截与站位的判定照常走。"},{"title":"后续怎么接","body":"有前哨先耗掉枪线反应时更容易走成。成功占格后只给其他敌手一个新的实际站位依据。"},{"title":"玩家怎么拆","body":"枪手仍能覆盖时截第二人。已被占住时核实旁路，用改格接护换约，也可收令留路。"},{"title":"敌手的代价","body":"猜错退口会花移动守空格。被截在路上时，既没占格，也会占住己方的行道。"}],"links":["qimen-jinglu","qimen-shiqiang","gaige-jiehu","cheling-husi","qiaokou-liangshou"]},
  {"key":"heifeng-luosuo","k":"racialskills","kind":"敌方招式","name":"桥北望风手·落索封格","summary":"封住那一格的通行。","sections":[{"title":"发动者与条件","body":"望风手在场景预设的桥沿索位，用一项行动启用可见的单格封道索。望风手离开维持位或索被解除时取消封道。"},{"title":"可见征兆","body":"格上出现起索标记，望风手把注意留在索位一侧。"},{"title":"规则效果","body":"封住那一格的通行。附近敌我单位的站位和威胁继续独立结算。"},{"title":"后续怎么接","body":"同伙可以实占另一条道。望风手要先放索或交接后才有空离位帮忙。"},{"title":"玩家怎么拆","body":"从有效格挑索解道，或按勘过的旁路避开。解索后重新检查该格有没有敌手。"},{"title":"敌手的代价","body":"封索占用望风手的行动以及维持位置。封在空路上会把自己拖在离交锋较远处。"}],"links":["hushou-liaowang","tiaosuo-jiedao","guanzhao-dihu"]},
  {"key":"yanwu-tingmen","k":"racialskills","kind":"敌方招式","name":"断碑机关·停枢留门","summary":"保住自身朝向的内侧一格。","sections":[{"title":"发动者与条件","body":"断碑机关已经回匣，内侧门位可转动，且机关能用下一次动作切入停枢状态。"},{"title":"可见征兆","body":"回匣的转向停住。外段空出，原有的内侧守门朝向仍可见。"},{"title":"规则效果","body":"保住自身朝向的内侧一格。外段只按地形通行，机关要再动必须等自己的新动作。"},{"title":"后续怎么接","body":"有人真进内侧守区时，按回匣守位的后手结算。全队改走外段时，它要重新等触发或起枢。"},{"title":"玩家怎么拆","body":"借外段转移队伍，也可先在外侧观察到下一次起枢，再决定谁走内段。"},{"title":"敌手的代价","body":"停一次就让掉一段外侧空间。误把无人接近的内门当主线，会少一个阻拦时机。"}],"links":["yanwu-baowu","yanwu-huishou","guanzhao-dihu"]},
  {"key":"muwei-hemen","k":"racialskills","kind":"敌方招式","name":"古墓甲卫·两岗合页","summary":"两人分别盖住自己够得到的一格。","sections":[{"title":"发动者与条件","body":"两名甲卫各在预设的邻接门格，并各自还有一次护门机会。第一名改朝一侧，第二名只在可见的搭档信号到达时跟上。"},{"title":"可见征兆","body":"双岗相继转向，可看出主护一边和留着待补的一边。"},{"title":"规则效果","body":"两人分别盖住自己够得到的一格。场上还剩哪一面防守按各人的朝向、站位和剩余机会计算。"},{"title":"后续怎么接","body":"主护岗用掉反应后，另一岗可按自己的剩余机会补一格，也可守住原门。"},{"title":"玩家怎么拆","body":"拆开两人的位置或等其中一人先交掉反应，把队伍引到它们照顾不到的口子。"},{"title":"敌手的代价","body":"跟转误判会同时漏掉旁路。补岗让掉的原位不会再凭一次联动补回来。"}],"links":["muwei-zhengxing","shouduan-huanzhen","duanzhi-yinban"]},
  {"key":"juguai-chichong","k":"racialskills","kind":"敌方招式","name":"山岩巨怪·沉足蓄冲","summary":"路线维持可走时沿实格移动，逐格检查阻拦。","sections":[{"title":"发动者与条件","body":"巨怪先占定能承重的格，且前方有一段能通行的连续格。用当次行动留出清楚的起势，到下次能行动时才可能冲出。"},{"title":"可见征兆","body":"场上能看见沉足和要占的直线区域，路线信息会随地形和前方占位变化。"},{"title":"规则效果","body":"路线维持可走时沿实格移动，逐格检查阻拦。路断时止在最后可达位置，重定向要重新起势。"},{"title":"后续怎么接","body":"完成冲行后先收势，再由踏岸护水决定是否转回护水位。"},{"title":"玩家怎么拆","body":"在冲行前离开显示的线路，撤离者各走自己的格。也可让场上的合法障碍改变可达路段。"},{"title":"敌手的代价","body":"蓄势期让出侧向响应。冲空仍要收势，离开原来的护水位置也会暂时漏出水口。"}],"links":["juguai-shouguan","juguai-taan","duanzhi-yinban"]},
  {"key":"shouyue-tibi","k":"racialskills","kind":"敌方招式","name":"守约擂客·亮手止斗","summary":"擂客先放下原有的进攻准备。","sections":[{"title":"发动者与条件","body":"有擂台停手约，并出现约定的认输、护退或界线情况时，擂客用自己可用的行动示停。"},{"title":"可见征兆","body":"擂客移出预备位并示意停手，双方与裁定者须处于能确认该信号的位置。"},{"title":"规则效果","body":"擂客先放下原有的进攻准备。停斗的约定效果在双方确认或裁定者认定后发生。"},{"title":"后续怎么接","body":"双方照约退出时，可以接擂边护退，先让需照护的人走。"},{"title":"玩家怎么拆","body":"遇到信号未被接收时由裁定者或同伴补传。擂客误判了情形时，按当时所订的停斗规则确认。"},{"title":"敌手的代价","body":"率先示停会让掉自己的准备。场上各方仍需要完成实际停手与退场动作。"}],"links":["ring-yuedou","leibian-hutui"]},
  {"key":"heifeng-duoche","k":"racialskills","kind":"敌方招式","name":"黑风寨·夺车不追","summary":"该敌手用动作改写货车控制。","sections":[{"title":"发动者与条件","body":"一名寨众实到货车旁合法的接触格，且有一个连续行动窗口。当值的护卫已经离开车旁或正被牵制。"},{"title":"可见征兆","body":"负责夺车的一队贴住车位，追人的一侧有人先停步。"},{"title":"规则效果","body":"该敌手用动作改写货车控制。能否转移货物继续按路径与车况判定。"},{"title":"后续怎么接","body":"货车落定后可守车等同伙，或实际推车撤离。赶着追人会让身边的守车空间空出来。"},{"title":"玩家怎么拆","body":"盯住实在的车位和来路，保护车夫自己走完动作。丢车后可以回到能接触的格重新争取。"},{"title":"敌手的代价","body":"夺车者这一手要留在车旁，会放过撤远的人。没有能走的车路时还得用后续行动守住所得。"}],"links":["heifeng","shouzhu-delu","jifeng-kaidao"]},
  {"key":"zhaoshi-jiaoshou","k":"skills","kind":"战法","name":"招式体系","summary":"每一手写清从哪学来、当场凭什么成立、如何接上，以及对手可以在哪一步改变结果。","sections":[{"title":"侠客能学会什么","body":"招式、内功和身法可以按词条修习。先求得传授、谱本或可复现的练法，再按各项验收试练。已能独立用的动作可通过实战见证和回师突破发展出变式。"},{"title":"敌手出手留下什么","body":"敌方词条记录专属发动者、场上的征兆、后手与拆法。有亲见和实绩的观察可以用来求教对应的侠客应对。例如识破探步诱截，可以成为练缓枪候实的一次见证。"},{"title":"出招按哪几步处理","body":"先确认站位、持械、情报和准备，起手后给符合条件的人应对。应招改变落点、方向或队友状态后，按眼下格况重验。实际用过的资源在结算里记账，收势以后再确定谁能接下一手。"},{"title":"专精怎样进入这一手","body":"兵器专精在匹配所持器物、实际距离和反应尚存时给出特定应对。武学专长帮角色在一种职责遇变时做出选择。两名持枪者可以用交枪分程换线。临机换班则要求替手实际守住约定来路。两者都用接手人自己的反应和站位。"},{"title":"一场差事能留下什么","body":"记下所见征兆、出手人、对手应对、结果和实际代价。成功独立履责可作为成长证据，误判和失败可带回去找问题。连击次数、击杀和重复同一条件只能说明做过几次。"}],"links":["zhaoshi-liancheng","jiezhao-chengshi","chai-zhaojue","qiaokou-liangshou","lilian-xiuwei","zhuanchang-zhuanjing","neigong-shenfa","luobu-jiezhao"],"systems":["levels","combatxp","mastery","perks","armskills","racialskills"]},
  {"key":"zhaoshi-liancheng","k":"skills","kind":"修习","name":"一式怎样练到上场","summary":"从能照着演，到能在交手中自己选时机，再到能复现一种新解法。","sections":[{"title":"求得练法","body":"找词条所列的师父、谱本或见证人。先备必要的器物和同伴，确认练的具体局面，例如有人走出旧盾位时怎样接护。出身、人情和资质可以改变入门途径或试练负担。"},{"title":"过基础验收","body":"在能重摆条件的演练里做出一次合法动作，再让同伴改变一个条件。练习者要说明哪次能出手，哪次应取消、另找落点或退回普通动作。再在有熟手接应的差事中完成自己的职责，凭实际结果登记可独立使用。"},{"title":"拿实战去问具体难题","body":"见证写清场合、本人做的动作、对手或同伴怎样改变条件、最后办成了什么。看到别人办成与本人执行分别记。练成断位接护后，遇到退格被实占，复盘时可以拿亲自处理的旁路结果求改格或撤约的练法。"},{"title":"突破学到的是变式","body":"带着对应的证据回师，再演一次能用和一次该放弃。验收通过，才把变式放入可用选择。若只见过失败，可据此安排下一场试练，当前仍按已掌握的路数做事。"},{"title":"专精帮忙验哪一步","body":"持用匹配兵器去实做特定职责，再复练那项器物条件改变后的取舍。拿枪的人可以凭已会的枪路处理试探，真要依专精守线时仍须看距离和剩余反应。临机换班可以记录一次实战的接替结果，角色仍各学各的招式。"}],"links":["lilian-xiuwei","lilian-jianzheng","huishi-potu","shipei-zhuanjing","huanqiang-houshou","gaige-jiehu","neigong-shenfa"],"systems":["levels","talents","mastery"]},
  {"key":"jiezhao-chengshi","k":"rules","kind":"战法","name":"起手以后怎样接招","summary":"下一手要承接已经发生的局面。看出机会、换人接应、重订旧约各算自己的动作。","sections":[{"title":"同一人接下一手","body":"前一手收住后，用实际剩余的行动、内力、器物或反应重新检查条件。例如盾手刚承过一次来势，仍持盾，旧受护人已退，当次能留住的遮护才有转给邻格同伴的可能。"},{"title":"换人接手","body":"交接要看谁实际到了哪一格、谁收到了什么信号。原盾手不能接时，临机换班允许具备条件的人另担职责。新接手者用自己的护位和反应，行动权保持各自归属。"},{"title":"有准备的接续","body":"拍鞘约位先建立双方都确认的安排。退格被占后，原接护尚未用、看清旁格且双方都确认，才可选择改格接护。新安排生效就清掉旧安排。旁路也断了，可以撤约再守，把留在原处的人护住。"},{"title":"同一扇应招窗口","body":"一项反应只能供角色选择一次。枪手面对外沿试探时可花掉反应，也可等待真正穿过护送线的人。等候期间对手真实走过的格照常发生。"},{"title":"连续衔接的验收","body":"看职责结果。护送要留下受护人自己确实抵达安全格的见证；只确认到备路、准备起了却没人动，可以复盘，但要等做成一次才能拿去验相应专长。"}],"links":["shouduan-huanzhen","gaige-jiehu","paiqiao-yuewei","cheling-husi","chengzhong-zhuanhu","qiaokou-liangshou","luobu-jiezhao","shoufeng-menfa"],"systems":["skills","armskills","perks","rules"]},
  {"key":"chai-zhaojue","k":"combat","kind":"战法","name":"看兆、拆招与失手","summary":"拆招可以改变起手条件、用自己的应招接住来势，或避开后抓住收势。每一步看得到的证据不同。","sections":[{"title":"起手之前可以拆什么","body":"先处理实际条件。移开护送线、用挑索解道打开一格、打断两个哨位的联络，都可能让对手找不到发动条件。还没行动的人按眼下局面另选可用动作。"},{"title":"起手之后可以拆什么","body":"每人只凭自己见到的起势、接到的报告和当前位置出手。有人进枪线且还有反应，可以拦那个人。只能听到响动时，按可用的查兆、报位或防守应对。"},{"title":"收势时可以拆什么","body":"对手用完反应、离开原位或固定了朝向，才会产生相应空当。下一人实际进到空格或够到目标后才能利用，整队的动作照常分别花费。"},{"title":"错用按哪一步记账","body":"起手前看见条件已失，可改用普通动作或继续等待。已投入准备、移动或反应后才发现错判，相应成本保留。场上没有合法落格时停在合法位置，已经确认的新约也要因情势重验。"},{"title":"复盘要写下什么","body":"把亲眼所见、听来的线索和事后才知道的结果分开记录。确认了失手缘由就可安排有针对性的复练。突破需要的成功见证按相应变式单独核实。"}],"links":["louxu-caiwei","tingnu-baowei","guanzhao-dihu","qimen-shiqiang","qimen-jieche","heifeng-luosuo","luobu-jiezhao"],"systems":["skills","racialskills","armskills","effects"]},
  {"key":"qiaokou-liangshou","k":"skills","kind":"战法","name":"桥口两手交锋","summary":"桥口的前哨先试枪，游斗者再争退格。护卫可以早拦、留枪或改格护撤，各有自己的风险和花费。","sections":[{"title":"布置","body":"枪手会缓枪候实，本轮有一次拦截。盾手和伤员先以拍鞘约位确认路线，盾手已经备好断位接护，另有一次用于换约的准备和一次接护反应。此例假定盾手已回师验过改格接护，也学过收令留路。伤员能自行移动，旧退格和侧边旁路都有明确位置。这里的资源额度用于演示本场选择。"},{"title":"第一手试探","body":"前哨只踩到能被枪够到的外沿，仍未逼近伤员。早拦能挡住这个人，枪手本轮就交掉了反应。留手等候会让前哨走完这一步，仍可拦真正试图穿过护送线的游斗者。"},{"title":"第二手争退格","body":"游斗者从侧面靠近原退格，仍须走到实际位置。枪来得及拦时，盾手可按旧约护出。退格已被占时，两人能确认旁路才可用改格接护。确认并改约花一次准备，伤员自己经过并遇到威胁时才花盾手的反应。"},{"title":"犯错与收手","body":"原退格被占仍按旧约等，伤员停在原处，反应没触发，撤出的窗口已经过了。如果枪手留下了可用的旧路线却有人离位去追，原来的护位也会失效。撤掉接护后改走备路须有双方确认，伤员走的是另一条可自行通过的路。"},{"title":"带回什么证据","body":"成功改格护出可记作这次实战使用。要用它验临机换班，还要在实战中实际换人接住职责，并按已有规则复练。早拦、空等和收令退出分别记录，后两种可能留下对站位或联络的新问题。"}],"links":["lilian-huqiao","huanqiang-houshou","qimen-shiqiang","qimen-jieche","shouduan-huanzhen","gaige-jiehu","cheling-husi","linji-huanban","yanqian-xifa"],"systems":["levels","mastery","armskills","shieldskills","racialskills"]},
  {"key":"luobu-jiezhao","k":"zoc","kind":"战法","name":"落脚、脱身与接招","summary":"先问这一步走不走得成，再问走到以后够得到什么。脱身依靠合法的退格和当时真正存在的空当。","sections":[{"title":"先认路线再动","body":"走前查目标格、途中每一段、衣甲和负物限制，以及有哪名敌手真的够得到。先手高可以先走，花费仍按路线逐段结算。若计划走两段，先找能站稳的中间格，再确定第二段是不是本次要走。"},{"title":"贴身时怎么脱","body":"先看哪一侧仍有人有手段拦你。可等敌手交掉相应反应、借同伴实际接防打开一处合法口子，或按已学身法取得具体的退步机会。若还有另一人能拦，照样处理。每条路都被锁住时先停、求援或等条件变化。"},{"title":"谁拦到了哪里","body":"对手能在招法允许的移动窗口尝试拦截。占位变化、失衡、足伤或真被拉离会改变余下路段；若被拦停，位置按最后已经到的合法格或实际受迫落位记录。已经花的移动、内力和拦截反应照实记账。"},{"title":"到了再接招","body":"到格后用新距离、持器、视野和可用行动查普通攻守。用反应起步的身法已经占用对应反应。接护的伙伴必须自己行动，照应原退格的安排也要重新跟当事人确认。"},{"title":"错判要赔哪一手","body":"起步前看出退格已堵，可以取消或另选当前能走的动作。迈步后才发现角落被人抢了，走过的照付，可能暴露旧位置或停在压力下。携物的人若要卸担改线，先办成实际交割或落存，再按剩余动作选路。"}],"links":["neigong-shenfa","jiezhao-chengshi","chai-zhaojue","cuowei","xuway-shou","feixu-side","duanzhi-yinban","huishen-huandao"],"systems":["skills","ap","initiative","height","vision","injuries"]},
  {"key":"shoufeng-menfa","k":"zoc","kind":"修习","name":"听锋门法","summary":"在一次真正接住来势之后，选择花气留住一面守向，或放掉反击，走到一处能接后手的侧格。","sections":[{"title":"用封招和变向来练","body":"找执剑师父配一名会改变来路的陪练。第一轮真的架住，再按动作择一；第二轮只见起手却没有接触，学员要收回手上的打算。实战得留一名能说明格况和接触结果的同伴。"},{"title":"同一次成功招架的三种后手","body":"按锋定向付内力，预备下一次近战收势后保留面向。借挡转门让出同次反击，利用同一个后手窗口付移动行动，撤到侧门格。掌握且持匹配单剑时，也可按止锋回护的条件护邻人。各自使用同一个后手选择。"},{"title":"对手先骗你选边","body":"对手可以佯动、改打他人或封住侧门格。若上轮留住的是北面，而敌人已从侧面压到，按原花费记下弃用的守向。过去的防守资格帮不了新面，须换普通守位或请同伴接应。"},{"title":"练成后怎么用","body":"先有独立用法，再看实战职责需要留向或让位。记录谁挡住、哪面守向后来确实用上、或哪名同伴从打开的侧门格接过来。若进一步求兵器专精，按对应器种已有的实做和复练条件验收。"}],"links":["anfeng-dingxiang","jiedang-zhuanmen","shouzhong-huifeng","dan-jian","jiezhao-chengshi","chai-zhaojue"],"systems":["levels","skills","mastery","armskills","fatigue"]},
  {"key":"duangu-danfa","k":"height","kind":"修习","name":"断谷担法","summary":"为带货下窄阶而练。先找能实停的台阶，选择付气过一段轻度受限的坎，或放下货物争取另一条路。","sections":[{"title":"同一处石阶试三次","body":"向山道向导借实装的练习篓。同一处坎分别空手、轻载和带货走，要求能指出衣甲卡住、货重太高和受到拦截各是哪一项限制。实做由同伴复核本人、货物和下一处落脚。"},{"title":"气只花在预选的一段上","body":"负篓引息可为标成可借劲的窄阶提供一次携货通行资格。贴槛分程先走到能站住的平台，停住交代上半段格况，再用下一次行动检查下半段。该花的气、行动和牵制按各段独立结算。"},{"title":"坡下退格被占","body":"到了石台才见坡底被人占住，先停。若已练成卸担改线，可在稳固且能放货的格安置并留记，同时发出约定的备路信号。本人和同伴各走眼下可用的路线。来不及取回时，货留在实位等待下一次交割。"},{"title":"突破验的是处理残局","body":"已独立用贴槛分程。一次押运中若遭下段封路，亲自按普通动作安置过货，再领同行走过新的可行路线，可以把人员去处、货物实际结果交给向导验课。复练时再让陪练抢占预定存货格，验能否取消。"}],"links":["fulou-yinxi","tiekan-fencheng","xiedan-gaixian","tieshi-dibu","duangukou","shezhong-zhongbiao"],"systems":["levels","skills","zoc","fatigue","ap"]},
  {"key":"huanqian-bu","k":"zoc","kind":"身法","name":"回签步","summary":"在第一签留反应，前路确实被截断时放掉行息，从同伴打开的一侧提前退回旧格。","category":"雁签息法","sections":[{"title":"怎么学","body":"先能独立用雁签行息。在营地分别练后路尚通和回头也有人守两种局面。实做遇阻时由搭档先打开一处旧格的来路，学员主动停掉行息、撤回并报出后段出了什么问题。"},{"title":"什么时候能用","body":"刚停在第一签时可事先指明要退的相邻旧格，并留一份身法反应，准备到下次本人行动前有效。期间见到第二签的路线确有阻断，旧格仍空且后哨已实际打开这一侧并确认，才有回步窗口。"},{"title":"怎么结算","body":"在下次正式行动前，先结束这次行息，用已留反应做一次只到旧格的退步。敌方仍可按自己的合法牵制拦，移动被截时依实际位置停。想再走一格须等自己的正常行动。"},{"title":"怎么衔接","body":"退回以后可用短止引伴的报位办法把第二签封路的情况告诉还在后面的人。护手若要接住新的退格，要按断位接护的真实威胁与过格条件处理。"},{"title":"怎么拆解","body":"敌人可以抢先踏入旧格、逼离刚接防的人，或把第二股仍可出手的威胁留在回路上。只毁掉一侧的牵制时，另一侧照实拦截。"},{"title":"代价与错用","body":"第一段的移动和准备照记，放掉本次回气。若发动前旧格已经被占或后哨还没接到，可以收住，反应另按当前可用的动作处理。起步后被截则反应已经交掉，回到旧格也须另付守势开销。"}],"links":["yanqian-xifa","yanqian-xingxi","huanshao-xuqian","duanzhi-yinban","xuway-shou"],"systems":["levels","ap","vision"]},
  {"key":"jiedang-zhuanmen","k":"zoc","kind":"身法","name":"借挡转门","summary":"实际接住贴身来势以后，放掉同次反击，用剩余移动从已经打开的一侧脱开。","category":"听锋门法","sections":[{"title":"怎么学","body":"由剑师带两名陪练，第一人分别演空起手和实际接触，第二人换守空出的侧格。学员须说对哪次有后手。实战从合法侧格脱开，旧位由搭档实际接住或留给要撤的人，才验收。"},{"title":"什么时候能用","body":"刚确实架住一次贴身来势，有成功后的选择窗口。要去的是原格相邻且已确认可落的侧门格。当事人还有一份可支付的移动行动。原对手的牵制仍有效时，需等其放手或由同伴实际打开该侧。"},{"title":"怎么结算","body":"放弃这一次的反击或留向，用该窗口花移动行动走向侧门。已用的反应是原招架那一次。途中其他敌手若有合法拦截，按其实际结果停步。"},{"title":"怎么衔接","body":"在新格重新确认视线和持器。可用余下动作报位或立普通守势，也可以留门给同伴随后自己走。需要贴身护送时，让盾手用自己的条件和反应接下一人。"},{"title":"怎么拆解","body":"只亮起手便撤、改用够不到的远手，或把接应者和侧门分开，都可让借挡条件失去。还可留第二名敌手真正看住该格。"},{"title":"代价与错用","body":"这一手让出了还击和原先守住的邻格。迈步后才被截，移动计费，按实际落位处理。若架势刚成时已见侧门不合法，可以当场改选仍可用的一手。"}],"links":["shoufeng-menfa","anfeng-dingxiang","shouzhong-huifeng","dan-jian","feixu-side"],"systems":["levels","ap","armskills"]},
  {"key":"tiekan-fencheng","k":"height","kind":"身法","name":"贴槛分程","summary":"把坡路拆成两段，在可站稳的中间台停住，知道下段现在可走才继续。","category":"断谷担法","sections":[{"title":"怎么学","body":"跟向导用要实装的练习篓走两段不同坡面，标清哪块台能停人、哪块只够踏过。演一次坡脚刚被占的变化。实做护队时亲自在台阶停稳认路，再分段引同伴通过。"},{"title":"什么时候能用","body":"所知坡路包含一个可站、未占且符合本人体况的缓台。上段能依正常路线或已满足条件的负篓引息走完，当前有可用移动。"},{"title":"怎么结算","body":"先支付动作走上段，在缓台结束这次移动，并从这里查下段。下次自己能行动时可重选路线，再按第二段的地形、牵制和负物单独付费。两段之间可由同伴先走完自己的接应动作。"},{"title":"怎么衔接","body":"先查下段有没有标成可借劲的窄阶，再选负篓引息或普通移动。如果坡口实封且已练成卸担改线，可在安全台格办理货物，再带人另走合法路。"},{"title":"怎么拆解","body":"提前占住缓台可阻止第一段；待行者站上缓台再抢坡脚，可逼其等待或另选。另一层的接应是否够得到，要看当前高低格和视线。"},{"title":"代价与错用","body":"主动停台会结束这次移动，剩余路程不能折成行动。误把只能经过的格当缓台，则须按这段实际移动停格；硬接下段会暴露在尚未查明的牵制下。"}],"links":["duangu-danfa","fulou-yinxi","xiedan-gaixian","tieshi-dibu","duangukou"],"systems":["levels","ap","zoc"]},
  {"key":"xiedan-gaixian","k":"height","kind":"身法","name":"卸担改线","summary":"下半程真断时，先在可交割的缓台处理这担货，再按自己的行动带人改走轻装可通的路。","category":"断谷担法","sections":[{"title":"怎么学","body":"贴槛分程已能独立用。后来在一次实差碰过坡脚封路，亲自用普通动作妥善落存或交出一担货，接着从另一边带人到达安全处。由向导按两种结果复练，一次及时交割，一次存货格被抢。"},{"title":"什么时候能用","body":"已经按贴槛分程到缓台且确认下段受阻。有按委托可分置的货，脚下允许存放，或旁边有可交割的接收者。另有已核过的轻载路线，同行者能按约接消息。"},{"title":"怎么结算","body":"花一次交割或存放动作，把货实际转手或留在已记实格。完成时可用约好的信号向一名同行者顺带报出新路第一格。本人和同行者随后分别用自己的移动，按各自负重检查通行。"},{"title":"怎么衔接","body":"先请查路者把安全口报给同行。交割确成后，可用短止引伴让后队在转角前确认这条新路。原担货人若仍需要护手，后者必须实际守新口。"},{"title":"怎么拆解","body":"抢占计划卸货的格、截断备路，或让接收人已无行动，均可令准备停住。敌手也可能在货留下而一行人已离开后争夺实际的货位。"},{"title":"代价与错用","body":"交割费一手，移动另付。同伴来不及取回时，货先留在原处承担损失风险。若交割未实成，仍按原本负重查后段；脚下受迫移位就按实际货物去处记。"}],"links":["duangu-danfa","tiekan-fencheng","fulou-yinxi","shezhong-zhongbiao","huishi-potu"],"systems":["levels","combatxp","ap","zoc"]},
  {"key":"zhuanchang-zhuanjing","k":"perks","kind":"设定","name":"武学专长与兵器专精怎么练成","summary":"以战场职责和持器取舍分别确定专长，先验实际本领，再复练新处境下能做的事。","sections":[{"title":"先学会一门武艺","body":"求教或读懂已有谱本，练成基本用法，然后用一次真实职责验它能独立使用。触发、姿态和本领依据分别记到相关的武艺里。"},{"title":"专长从职责里长出来","body":"能守桥只是起点。护撤计划当场改变、接替实际发生、受护者到达安全格，可以作为临机换班的证明。照护与联射也各看本人办成的步骤和同伴如何接住。"},{"title":"兵器专精受实际所持约束","body":"实际用过这类兵器，再在一个会改变解法的问题上完成职责，回来按边界复练。失去所持器物、没有足够距离或无法支出反应时，用各自仍能成立的普通动作。"},{"title":"突破与复练怎么接","body":"已学会的进阶变式可拿到另一趟差事使用。若要凭它取得职责专长，应把实际变化、应对、接手人和结果记清。临机换班可从改格接护或撤约再守其中一式接入。"},{"title":"单次行动怎样结算","body":"同时出现多种高级选择时，各人挑实际要做的一项，按各自行动、内力、器物和反应记账。取消的原准备到此结束。应对落空和复练的记录沿本局保持，待议的还包括换修、课时和实际开销。"}],"links":["linji-huanban","shouyue-ke","shipei-zhuanjing","lilian-xiuwei","huishi-potu","jiezhao-chengshi","qiaokou-liangshou","neigong-shenfa"],"systems":["mastery","levels","combatxp"]},
  {"key":"shouyue-ke","k":"perks","kind":"设定","name":"威远护撤课从突破走到换班","summary":"同一门突破先用到真实变局，然后验证谁能在原护卫交出位置后守住下一道来路。","sections":[{"title":"场面一","body":"已会改格接护的护卫发现原退格被占，先定新格并完成护人。同行替手已在预定格，从信号里知道要顶哪一侧，随后确实守住。"},{"title":"场面二","body":"会撤约再守的护卫在伤员另走时先收掉原约，保护最后一位经过的同伴。替手等当前守位释放后，用自己的反应在另一个方向接守。"},{"title":"证据按人查","body":"带回练习的材料包含原护卫确实放下的守位、替手真付出的动作或反应、受护者走到哪里。若其中一步没办成，先把该步安排成新的对练。"},{"title":"验成新本领","body":"试让替手没到场或已经用掉反应。只有两种情况都能在正确时点决定接替或停止，才通过临机换班的候选验收。推演选任一突破支路均可继续。"}],"links":["linji-huanban","lilian-huqiao","gaige-jiehu","cheyue-zaishou","weiyuan"],"systems":["levels","combatxp","shieldskills"]},
  {"key":"shipei-zhuanjing","k":"mastery","kind":"设定","name":"换兵器后怎样核专精","summary":"把同一件器物的来路、握持和可用招式核清，再决定是否沿用已有的专精。","sections":[{"title":"同门类也要验条件","body":"平山护镖枪换成另一柄适配长枪，若可及格、握法和出手空间仍合用，可先保留已验的基础手法，另对新长度实测。改戟镗时牵拉落格和枪线各有验收。"},{"title":"双持和名器怎样记","body":"双剑、单剑和重剑分别核双手占用、收锋与站位。名器可有自己才具备的变式与磨合证据，物件当前持有和人物已经练会的动作分别保存在相应记录。"},{"title":"用途和代价示例","body":"改拿短器的同伴想从封口改走贴身撤步。可先与熟手练怎样站到起点和合法退出，再在实际小差里完成支援，保持原来已会的另外一类武艺。"},{"title":"仍待定的边界","body":"相容器物的正式名单、多久不用需要复练、能否同时准备多种专长、耐久与耗气数值继续按实际原型讨论。奇门短器、机括和火器采用条件仍待议。"}],"links":["qiang-dao","ji-tang","dan-jian","shuang-jian","zhong-jian","xuanjin-shou"],"systems":["perks","weapons","armskills"]},
  {"key":"gaige-jiehu","k":"shieldskills","kind":"招式","name":"改格接护","summary":"守卫能在护撤尚未触发时重选一处可达的相邻退格。","sections":[{"title":"怎么学","body":"已可独立用断位接护。亲历退格受阻后，确实用原法改走一条旁路并护住同伴。回威远让师父重设被占格，校验改格的合法性与信号。\n\n回师验收时请陪练把备用格也封上，确认自己会放下安排，并由实战见证核对原伤员实际到位。"},{"title":"什么时候能用","body":"已经准备接护，原指定格因可见占位或道路变化无法通行，原反应还未触发。与同一位受护者确认旁侧仍有可达且相邻的格。"},{"title":"怎么结算","body":"可在同一次准备里重选一次退格，旧格的护撤安排立刻作废。重新发出信号并付出候选准备成本，此后仍需有人经过、符合威胁条件才触发接护。"},{"title":"怎么衔接","body":"断位接护成立后，原退格受占时才重选一格。下一手可由实际就位的替手通过临机换班接护新来路。"},{"title":"怎么拆解","body":"对手可同时封住两个格、隔断护卫与受护者的信号，或在原接护反应已发生后再逼格。"},{"title":"代价与错用","body":"原来守线不会自动恢复，换位失效或旁格再被占就得停下按普通动作处理。对手可封退格、分隔信号或趁旧线空出接近。\n\n改格的准备已经支付时，旧格立即失去安排。新格若又被占，既不会自动回到旧护，也不可领取第二次接护。"}],"links":["shouduan-huanzhen","huishi-potu","lilian-huqiao","cheyue-zaishou","linji-huanban","shouyue-ke"],"systems":["levels"]},
  {"key":"cheyue-zaishou","k":"shieldskills","kind":"招式","name":"撤约再守","summary":"当原受护者已改道时，主动取消护撤准备，转去护住自己旁边的一面。","sections":[{"title":"怎么学","body":"已可独立用断位接护。遇到受护者提前改道后安全取消约定，亲自守线或照应本队退到安全位置。回威远复练怎样同时看最后一人和守位。\n\n让练习对象提前改道两次，一次能听见撤令，一次完全隔开，回师核何时应当各自处置。"},{"title":"什么时候能用","body":"选定的受护者已确认改道，原计划尚未触发。盾手还可应招，身边存在一处可防护的来路。"},{"title":"怎么结算","body":"先撤销本次接护并通知同行，再使用候选反应机会进入一侧普通守势。单次准备的反应费用只结算一次，后续动作仍按现有守位规则。"},{"title":"怎么衔接","body":"若接护仍待触发，收到确认以后先取消，按自己还有的反应重新立一侧普通守势。下一手才可谈实际交接。"},{"title":"怎么拆解","body":"对手可切开确认信号、先消耗盾手反应，或用尚未核实的动静引其错误退约。"},{"title":"代价与错用","body":"已经用掉的准备不返还，原受护者也失去这一道接应。若听不见或当前受制，按失去守势的场面处置，允许队友改用别处退路。\n\n取消后原受护者失去这一道接应。已付准备照记，若新来路也守不了，只能由现有队友补位或自己撤。"}],"links":["shouduan-huanzhen","shoubai-jiulu","huishi-potu","gaige-jiehu","linji-huanban"],"systems":["levels"]},
  {"key":"tingnu-baowei","k":"armskills","kind":"招式","name":"停弩报位","summary":"在确认射界消失时放弃本次发矢，把亲见过的最后一个位置报给能听见的人。","sections":[{"title":"怎么学","body":"已可独立使用伏弩换点，并实际处理过视野断开。由巡夜卒和弩手按同一目标的亲见、声音和转述复核。\n\n以烟幕实做一次看得见和看不见的转换，确认自己对真目击、同伴报告及听见动静分别记了什么。"},{"title":"什么时候能用","body":"弩手已有备妥的弩和未触发的放矢准备。射界出现可见阻挡或目标走出视野，弩手仍能把消息传给指定同伴。"},{"title":"怎么结算","body":"取消这一次放矢，留下带时点的最后目击位置。队友按自己的可见性决定守住、查近路或换点。弩矢和当时已投入的行动分别遵守实际发射、准备记账。"},{"title":"怎么衔接","body":"已备弩并预瞄时，遇断线确认停发。邻近同伴收到最后目击位置后可核自己的合法射界，再用伏弩换点或盾护。"},{"title":"怎么拆解","body":"对手可换格、假传声音、同时切断观察与报信，最后目击便过时。"},{"title":"代价与错用","body":"这一回合对应机会已经让出。对手移位、用假动静或隔开同伴可使报告过时。再出手时需有新的合法目标和资源。\n\n把旧位置当实时目标会让下一手瞄向空处。这次停发花掉已投入的准备，压掉出矢前的权利。"}],"links":["nu-lian-jingzhi","liannu-zhuanhou","wuyan","tingdeng-jilu","nu-ju"],"systems":["levels"]},
  {"key":"paiqiao-yuewei","k":"skills","kind":"招式","name":"拍鞘约位","summary":"镖师先与一名同伴约好备用站位，来路有变时才发出换位信号。","sections":[{"title":"怎么学","body":"威远镖局的护运课。两人先约主守格、备用格和谁报告变动，再让陪练堵住主路，实做一回交接。\n\n真带一次同伴过有两条路的窄处，由搭档确认听清主备格，并验一次主格未堵时按原计划行事。"},{"title":"什么时候能用","body":"双方在可互相传讯的格位，各有能走的路线。发信人花一次行动，把备用格及有效时段记给指定同伴。"},{"title":"怎么结算","body":"若来路被占，接收者可在自己的可用时机选择按约换位、重新询问或放弃。接受后仍核走位、牵制和剩余行动。"},{"title":"怎么衔接","body":"先约位置、执行者和改约信号。替手听见以后自己核合法格；掌握临机换班后才能在相应实况用替手的反应接守。"},{"title":"怎么拆解","body":"对手可占备用格、拖到太远听不见，或等拍鞘者真的出手后再压前路。"},{"title":"代价与错用","body":"同一人保留一个备用约定，换约会覆盖旧的。拦住传讯、占了备用格或让双方分隔可使它失效。\n\n报错格会让同伴查看一条走不通的路，先花的准备时间保留，重约要重新确认。"}],"links":["weiyuan","zizhi-hezuo","shouduan-huanzhen","qiaotou-budao","linji-huanban"]},
  {"key":"shouduan-huanzhen","k":"shieldskills","kind":"招式","name":"断位接护","summary":"护卫主动放掉原守位，把一次护人的机会移到伤员必经的相邻格。","sections":[{"title":"怎么学","body":"随队照护人与威远盾手用一条回湾撤路合练。学员须在承诺护住让行格前先识别自己原守位置。\n\n先在营地试着放掉一道旧守，再在有熟手能接替的护撤中亲自护伤员完成经过。"},{"title":"什么时候能用","body":"盾手已有可解除的一侧防守，指定一名同伴和相邻的可通行格，保留反应机会并支付准备代价。"},{"title":"怎么结算","body":"原守位在准备时结束。指定的人经过相邻格时若有可见的近身威胁，盾手可用一次仍有效的反应接护。结果依原来的接触或牵制规则。"},{"title":"怎么衔接","body":"先确认人、相邻格和当前来势。遇实际换格可回师练改格接护；确认此人已改道后可练撤约再守。"},{"title":"怎么拆解","body":"袭击者可先占预定格，或者绕到护卫放弃的旧路；也可迫使盾手先用掉反应。"},{"title":"代价与错用","body":"撤离者走另一侧或盾手被牵走就无法触发。原来来路失去盾护，对手也可改从那里压进。\n\n选错人或格只会空等，已放开的守位持续暴露。到计划失效时要查来路，不能把护持追认给另一个人。"}],"links":["housheng-care","zizhi-hezuo","paiqiao-yuewei","shouzhu-delu","lilian-huqiao","gaige-jiehu","cheyue-zaishou","linji-huanban"]},
  {"key":"tingdeng-jilu","k":"skills","kind":"招式","name":"灯下听讯","summary":"短暂停下脚步，标记障碍一侧传来的近处动静。","sections":[{"title":"怎么学","body":"从关城巡夜卒那里学辨同袍信号，再在营地用烟幕或屏障复核谁亲自看见脚步。\n\n在导师指点下把按时应声者、虚响和真实移动各记录一次，再带一条当场核实的报讯回师。"},{"title":"什么时候能用","body":"自己在能停留的格，可以听清一条在案的动静。先选一侧并花动作观察，方位只按候选感知规则标记。"},{"title":"怎么结算","body":"记录为近处疑讯，保留方向和失效时点。同行者可依此改守或派人查证。要出手仍需亲见、合法射线和可及距离。"},{"title":"怎么衔接","body":"疑讯可用来告诉盾手留一手，或与查路者核实来路。确认了人和位置以后才有资格安排拦截与瞄准。"},{"title":"怎么拆解","body":"对手可制造靠近声响、故意无声绕开，或拖到所记方向已经失效。"},{"title":"代价与错用","body":"停留会让出当下部分出手机会。对手做虚信号或换路可让判断落空，标记过时就只能当作旧消息。\n\n贸然把声音当人，会让守位者过早交出反应。探听的动作已经用了，仍须让能看见的人核确。"}],"links":["guancheng-xunye","zizhi-yingbian","wuyan","liannu-zhuanhou","qimen-shiqiang","guanzhao-dihu"]},
  {"key":"shuanghuan-dun","k":"shieldskills","kind":"招式","name":"交手换盾","summary":"把自己手上的盾交给相邻伙伴使用，空手者可以换成接应或照护。","sections":[{"title":"怎么学","body":"在威远的伤员撤离课里，由两名同伴各试一次持盾、卸盾和接手。先把物件所有人记到同一份清点记录。\n\n让双方各试一次作为交出和接收者，实战以同一面盾、同一份耐久和真实站位核对一次交接。"},{"title":"什么时候能用","body":"两人相邻且各能用手，接受者有空的持具位置。先约谁发起、谁应接以及当前落脚是否安全。"},{"title":"怎么结算","body":"两人顺次完成准备与接手后，原盾和现有耐久一起转移。同回合是否可立刻举盾照现有行动与反应结算。"},{"title":"怎么衔接","body":"接收者在有空手与实际行动时接盾，出手人随即改做照护或准备普通防守。接盾后的立势按其自己的资源结算。"},{"title":"怎么拆解","body":"对手卡住相邻格、让收盾者伸不出空手，或在旧盾已离手时冲旧来路。"},{"title":"代价与错用","body":"准备时原来的盾护可能中止。被分开或不再有空手就停在当前完成的步骤，实物只有一个持有人。\n\n漏数对方的手位会让交接停在半途。退格来不及时两名护卫可能同时少一条可用的路，盾仍只记一份持有。"}],"links":["zhuli-dun","shouduan-huanzhen","yaoqian-huanshou","zizhi-hezuo","dun-ju","zhaohu-jiexu"]},
  {"key":"yanwu-huishou","k":"racialskills","kind":"敌方招式","name":"断碑机关·回匣守位","summary":"看匣机关卫舍弃门口，沿可通行的格退到被碰动的匣旁。","sections":[{"title":"发动者与条件","body":"断碑旧驿的看匣机关卫。有人碰动登记为受护物的内匣、守卫尚可移动时，它可尝试换守。"},{"title":"可见征兆","body":"匣底套钩动了一下，守卫从旧门转向。场上会显示可能身体遮住的落格。"},{"title":"规则效果","body":"使用它自己的移动与准备额度到合法格。成功后起守范围移到匣旁，原门口相应放开。"},{"title":"后续怎么接","body":"若下一拍有人从可见的外格绕向匣门，先按机关实际朝向确认能否回护。要放掉外段时可以接停枢留门。"},{"title":"玩家怎么拆","body":"提前看清可走旁道、放下匣子或阻断抵达格。若找不到合法格，守卫留在原处并显示失败原因。"},{"title":"敌手的代价","body":"回匣要放弃当前外段动作。转回后发现内线空着，也已给人腾出了外沿移动窗口。"}],"links":["yanwu-baowu","duanzhiyemi","muwei-zhengxing","yanwu-tingmen"]},
  {"key":"qimen-huanshao","k":"racialskills","kind":"敌方招式","name":"奇门小队·双哨换线","summary":"前哨失掉一处射界后，后哨依据已经听到的信号接替。","sections":[{"title":"发动者与条件","body":"奇门守隙小队。原有前哨已被逼离或烟幕断了它的观察，另一人仍能听见约定的声音。"},{"title":"可见征兆","body":"先有短哨，随后另一侧有同伴回复。单独听见第一声只说明准备。"},{"title":"规则效果","body":"对手调整预瞄侧，接替者仍需去到可达格并检查已装的弩与合法射线。原前哨实际离开的格按当前控制更新。"},{"title":"后续怎么接","body":"第一声报位以后，每一名敌手仍要自行转位。另一个方向的人成功到格时才可接截撤格。"},{"title":"玩家怎么拆","body":"利用哨间的间隙移开射线，阻断第二人到达的格位，或故意退出诱使前哨原地等候。"},{"title":"敌手的代价","body":"听错或跟转失败会把前后两处脱开。已经走动的人留下实际的站位缺口。"}],"links":["qimen-jinglu","wuyan","liannu-zhuanhou","qimen-jieche","qimen-shiqiang"]},
  {"key":"juguai-taan","k":"racialskills","kind":"敌方招式","name":"山岩巨怪·踏岸护水","summary":"巨怪优先守住去水洼的一侧，留下一条根据地势变化的绕路机会。","sections":[{"title":"发动者与条件","body":"关下山岩巨怪。附近有人踏进通往水洼的边格时，巨怪在自己活动范围内试图抢回一处挡道格。"},{"title":"可见征兆","body":"地面先出现回身拖痕，贴水处才发出重响。预览标出它够得到的一侧。"},{"title":"规则效果","body":"使用当前可用移动站到候选挡位。若成功，护水来路仍受它影响，背向的一边可能让开。"},{"title":"后续怎么接","body":"收稳脚下后再决定要维持水口还是沉足蓄冲。离开水口后，下轮护位从新的实际落点算。"},{"title":"玩家怎么拆","body":"沿高处可走路线绕行、让前排等到他移位再撤货。进到深水或留在非法格都须另行结算，保留掉头离开的分支。"},{"title":"敌手的代价","body":"叩地动作会消耗原有的移动或应变机会。水边没人时白守一次，误踩不稳地形还得停下来收势。"}],"links":["juguai-shouguan","duangukou","goulian-tiaowei","juguai-chichong"]},
  {"key":"shouzhong-huifeng","k":"armskills","kind":"招式","name":"守中回锋","summary":"先守一处来路，架开兵刃后才有机会出剑。","sections":[{"title":"怎么学","body":"候选入口是跟执剑师父学守势，再研读《回锋剑谱》。\n\n由剑师在原来路与侧来路各演一次。接受试守时只有真正架住的那一击能验还手，收锋后要能回位。"},{"title":"什么时候能用","body":"持剑并选定近旁一名对手，预先亮出守势。"},{"title":"怎么结算","body":"对手从选定来路出招且被成功招架时，可选择支付内力还击一次。"},{"title":"怎么衔接","body":"原方向成功挡住来击后取舍还手。练过单剑止锋回护的人可在同一次反应中选去护邻人。"},{"title":"怎么拆解","body":"绕开选择的来路、用远器或佯进后撤，都会让剑士难真正接到对手。"},{"title":"代价与错用","body":"立势占用当前行动。对手可改打队友，用长兵留在反击距离外，或拖到守势结束。\n\n错把其它方向算进守势会在错误位置耗一手。打空或起势后未等到对手也不能重用这次准备。"}],"links":["huifeng-jianpu","shoushi","guqiang-zhen","dan-jian","shoufeng-menfa"]},
  {"key":"tanfeng-wenlu","k":"armskills","kind":"招式","name":"探锋问路","summary":"用轻探引出对手的防法，给队友留下一条可用情报。","sections":[{"title":"怎么学","body":"可由剑术同道在试艺时示范，也可从剑谱的试手篇习得。\n\n在试剑中用同一来路让两位搭档换守，各说出自己亲见的格挡方向。实做确认报告没把第二动作当成旧守。"},{"title":"什么时候能用","body":"执轻剑，目标处于可及距离，双方之间无阻隔。"},{"title":"怎么结算","body":"试探成功后，在目标下一次改换防守前标出已见的格挡方向。队友可据此选位置。"},{"title":"怎么衔接","body":"先探出可见守势，告诉队友下一次从哪侧准备。对手换守后旧情报过期，接招者照新场面看。"},{"title":"怎么拆解","body":"对方延迟格挡、主动变向，或用较长的距离让试探不够到。"},{"title":"代价与错用","body":"先花行动点。对手可后撤避开试探，或在接续攻击前更换守位。\n\n试探空落仍耗行动；错误地继续沿旧线递招，会给对手预先立好的防守机会。"}],"links":["shouzhong-huifeng","louxi","dan-jian","duan-ci"]},
  {"key":"jianfeng-huanwei","k":"armskills","kind":"招式","name":"敛锋换位","summary":"先收剑侧移，给第二名近战让出攻击位置。","sections":[{"title":"怎么学","body":"可在残剑门的双人对练中求教。\n\n同门换位要各人真的走到格。验收用一次侧格被占的例子，看能否提前取消、把替手留下。"},{"title":"什么时候能用","body":"持剑，相邻同伴准备接替，自己一侧有可达格。"},{"title":"怎么结算","body":"施招者退到侧格，同伴得到可主动踏入原位的机会。"},{"title":"怎么衔接","body":"剑手先收锋移开，另一名侠客在自己的动作时机接原位。练双剑分锋时，可在已成立的守势后才用副手牵制辅助接位。"},{"title":"怎么拆解","body":"逼占备格、困住剑手或让替手缺少移动，皆可让原格临时无人。"},{"title":"代价与错用","body":"移动消耗行动点，受强牵制时不能借此抽身。敌人可占住候选侧格。\n\n剑手已经撤开时接手者赶不上，旧格空着，二人各自耗用保留。不可把交接视为自动双移动。"}],"links":["canjian","cuowei","shouzhu-delu","shuang-jian"]},
  {"key":"hengdao-fengkou","k":"armskills","kind":"招式","name":"横刀封口","summary":"在狭口横刀守路，护住后方的同伴或货车。","sections":[{"title":"怎么学","body":"候选入口是随镖走过险路后向老镖师求教。\n\n跟镖师实守一次货路，至少有一人能按约走完；再复验从未标的来路逼近时怎么收住。"},{"title":"什么时候能用","body":"持单刀，选出相邻一处来路，自己与要护的格位之间无遮挡。"},{"title":"怎么结算","body":"有人从该格逼近时，可以抢先作一次压制性劈砍。"},{"title":"怎么衔接","body":"在侧格选定所守路口，队友依标记规划退。单刀封口递守可在实见己方经过时让出原拦截换成护人。"},{"title":"怎么拆解","body":"对手可从另一入口绕行或让前人试去一次反应，第二名再进。"},{"title":"代价与错用","body":"每次出手计入反应次数和内力。对手可走另一入口或引动反应后再上前。\n\n错误把封口当全向防御，未标的路仍露开；第一手反应用错后本轮需要真实替手。"}],"links":["qiaotou-budao","dunqian-let","dan-dao","cheluzhen"]},
  {"key":"zhongdao-poya","k":"armskills","kind":"招式","name":"重刀迫架","summary":"亮出重劈起手，逼对手早作守势或让位。","sections":[{"title":"怎么学","body":"候选由重刀教头传授，先练收势再练重击。\n\n跟重刀教头练一手确实从蓄势到收势。实战验过队友切格时能止劈，把原来所护一侧交清。"},{"title":"什么时候能用","body":"双手持重刀，当前有足够行动额度，且近旁空间容许挥动。"},{"title":"怎么结算","body":"起手后标示预定攻击方向。若依时出手并压过招架，可使目标短时露隙。"},{"title":"怎么衔接","body":"显出重劈方向使对手早选守让。用过止劈收势的刀手可在来路被占前把重势收去，退出原攻击准备。"},{"title":"怎么拆解","body":"看见起手就退到威力够不到的格、从侧格逼近或使其失去挥器空间。"},{"title":"代价与错用","body":"蓄势期间难转向。可退开攻击格、侧面扰动或让守线者替换。额外耗气待定。\n\n重劈未落就被移开或断招，先前蓄势占用仍在。剩下人要按原站位及敌手可能来路承担后续。"}],"links":["xushi","louxi","yankou-dao","zhong-dao"]},
  {"key":"daobei-tuizi","k":"armskills","kind":"招式","name":"刀背劝退","summary":"在擂台或救援中尝试迫使敌手退开。","sections":[{"title":"怎么学","body":"可请打擂人教练习用刀背控距。\n\n在一回可明示收手的比试中验退让与后方空格，不把对手退不开误作推走。"},{"title":"什么时候能用","body":"持刀，目标贴近，目标后方有可落足格。"},{"title":"怎么结算","body":"招架或闪避均可能阻止推退。成功时目标让出原格，可供救援者靠近。"},{"title":"怎么衔接","body":"先核目标后格，推开后让医者自主走近。擂台确认止斗后交给擂边护退办出场。"},{"title":"怎么拆解","body":"占住真正的后格、稳住来路或退到不在刀背距离，均可使推退无法发生。"},{"title":"代价与错用","body":"消耗行动点并留下原有站位。若退路被占，目标可稳住，施招者须另作打算。\n\n对着无退路的人全押推退，已用的动作留账，近身压力仍在；原本留给伤员的格没有打开。"}],"links":["ring-yuedou","shouzhu-delu","leibian-hutui"]},
  {"key":"hengqiang-jiebu","k":"armskills","kind":"招式","name":"横枪截步","summary":"用枪尖覆盖来路，阻住一名正在靠近的敌手。","sections":[{"title":"怎么学","body":"可随镖队练守桥口，由用枪者传授。\n\n在桥口实守一次已经划定的线路，见证要能说清拦的是先出脚的人还是后方实际逼路的人。"},{"title":"什么时候能用","body":"持枪矛，面前有连通的可及格，可在移动完成前布好枪位。"},{"title":"怎么结算","body":"第一次有人沿标示来路进入时，可用反应机会与内力截击。"},{"title":"怎么衔接","body":"标线后只给合法进入者拦截。缓枪候实可先把反应留给会压住撤路的真实入线者，或随双枪分程交给实际在位的枪手。"},{"title":"怎么拆解","body":"前哨探步诱截可套走可用反应，后人沿第二条路压上。也可在枪程之外拉开。"},{"title":"代价与错用","body":"会占住一段走位空间。对手可绕侧，或等同伴先承受枪势。\n\n拦了只探边的人以后，已用反应照记，第二名敌手可以占原退格。下一次要先看谁还在能截的范围。"}],"links":["chengkou-yaobiao","duangukou","guqiang-zhen","huanqiang-houshou","qimen-shiqiang","qiang-dao"]},
  {"key":"huiqiang-huhou","k":"armskills","kind":"招式","name":"回枪护后","summary":"前排枪手回护身旁，避免医者被一名游斗者贴住。","sections":[{"title":"怎么学","body":"可在护卫训练中与医者同练。\n\n先完成一次护人，再让正面同时有威胁，看枪手能否标正面交接与回护两份条件。"},{"title":"什么时候能用","body":"长枪手与后排同伴相邻，敌人正从侧格接近。"},{"title":"怎么结算","body":"允许长枪手消耗一次反应机会，把截击位置换到受护者侧面。"},{"title":"怎么衔接","body":"先预设回护方向，后位医者到格才值得换截击。前枪交掉旧线后请双枪分程的同伴接防。"},{"title":"怎么拆解","body":"前方继续压近、后队拖延入格或从两侧同时逼人可迫使枪手选一面。"},{"title":"代价与错用","body":"原来正面的截击机会随之让出。对方若同时从两路逼近，需要队友接手。\n\n过早回枪会让原拦截机会丢掉；后面同伴没经过也不能拿回，正面只能依其他守者。"}],"links":["housheng-care","guqiang-zhen","feixu-side","qiang-dao"]},
  {"key":"quanjiao-gekai","k":"perkskills","kind":"招式","name":"拦手隔步","summary":"以徒手短打为己方创造一次退步机会。","sections":[{"title":"怎么学","body":"可向市井拳师求教，涉及空手装备条件待议。\n\n练一手隔开近敌后确认同伴确实靠自己后退。实做时用另一处退路验取消时机。"},{"title":"什么时候能用","body":"空出一只手，目标贴近且附近有可退的友方格位。"},{"title":"怎么结算","body":"成功扰动后，指定同伴可主动后撤一格，再按其受到的牵制判定。"},{"title":"怎么衔接","body":"侧面有人持盾先留退格，短打扰动成功后，受护者按自己的时机后退，停稳后有盾线再罩住。"},{"title":"怎么拆解","body":"堵在退格、全程不进短打的可及距离或先牵住受护者。"},{"title":"代价与错用","body":"施招者留在近处，无法靠这一招同时护多个出口。对手可先封退格。\n\n换出的只是可用时机。格位不合法或扰动失败，施招者仍在贴身且本手已经花掉。"}],"links":["cuowei","housheng-care","duan-ci","kaizhang-jielu"]},
  {"key":"goulian-tiaowei","k":"armskills","kind":"招式","name":"长钩挑位","summary":"试着把一名前排从护住队友的位置牵开。","sections":[{"title":"怎么学","body":"候选可从守关军中懂钩镰的老卒处求教。\n\n用长兵在真实路口挑开一名可抵抗的挡路人，教者看过先让哪个格、对手拉到了哪。"},{"title":"什么时候能用","body":"持长柄钩刃，目标在其可及距离内，预定落格可通行。"},{"title":"怎么结算","body":"牵引成功时目标被移到标示格，原先挡住的路随之打开。"},{"title":"怎么衔接","body":"先查牵引落格和开放的路。练戟镗钩位后能在原落格被占前付新准备改选，路实际开放再让同伴自行走。"},{"title":"怎么拆解","body":"占落格、护住跟前目标或退到钩不及处可以让站位牵引无效。"},{"title":"代价与错用","body":"受力重的目标和稳固阵位可以抵抗。落格被占便取消位移。\n\n错算落格时目标仍在原位，伸钩的动作和收势费用照付，队友不得把预告当作打开通道。"}],"links":["guqiang-zhen","juguai-shouguan","ji-tang","shiheng"]},
  {"key":"jifeng-kaidao","k":"armskills","kind":"招式","name":"抡戟开道","summary":"把重戟的威胁铺过连续几格，争取撤离机会。","sections":[{"title":"怎么学","body":"候选入口是长兵教头开设的阵前课。\n\n演练三人交错撤出时只扫有效方向，实战确认让开的路线真的有人用过。"},{"title":"什么时候能用","body":"持长柄斧戟，侧方有挥动空间，路线预先标明。"},{"title":"怎么结算","body":"按标示顺序接触数个格位，成功压制的敌手须重新选择是否守在那里。"},{"title":"怎么衔接","body":"用开阔处铺威胁，再让后排按约走退。已有一条路可走时给交替断后留相邻接应格。"},{"title":"怎么拆解","body":"趁蓄势贴近、走出预告扫线，或让同伴误入挥动空间，使迟重动作需中断。"},{"title":"代价与错用","body":"出手占用大量当回合机会，狭处受限。对手可散开，或在蓄势时逼贴身。\n\n扫线未成时回撤机会还没创造，长柄已耗本轮准备。人、货和敌手按实际仍占的位置记录。"}],"links":["xushi","cheluzhen","goulian-tiaowei","ji-tang"]},
  {"key":"zhangduan-gewei","k":"armskills","kind":"招式","name":"棍头撑距","summary":"用棍端维持身距，争取让准备中的同伴完成动作。","sections":[{"title":"怎么学","body":"候选入口是访寺时向护院武人求教。\n\n实做一次撑住近敌直到同伴完成预定动作，再验对手转向且原计划应取消的场景。"},{"title":"什么时候能用","body":"持长棍，近前那名目标与同伴位于同一条照应线路。"},{"title":"怎么结算","body":"短打成功可压住该目标的下一步靠近机会。"},{"title":"怎么衔接","body":"邻近同伴正在调息或护车时，棍头管住可见的一格。学过撑距过队后再把反应和某人通过相连。"},{"title":"怎么拆解","body":"敌手绕到棍旁、拉走被护者或逼棍手先交行动。"},{"title":"代价与错用","body":"不能长期锁住目标。对手可改走另一格或逼棍手先交出行动。\n\n守错来路只压住空位；真正威胁仍能贴上来，余下阵位要由队友接手。"}],"links":["xuqiu-tiaoxi","housheng-care","gun-zhang"]},
  {"key":"tieji-dingdun","k":"armskills","kind":"招式","name":"铁锏压盾","summary":"把一次重击用在盾面上，使持盾者难继续护旁人。","sections":[{"title":"怎么学","body":"可向城关旧卒请教，也可通过有盾牌陪练的操练习得。\n\n试砸仍生效的盾护，实战看清攻击后原来被遮的同行者是否已有合法进路。"},{"title":"什么时候能用","body":"持锏且能接近已举盾的对手。"},{"title":"怎么结算","body":"命中盾面时优先记录盾具受力，成功后可暂时中断其援护。"},{"title":"怎么衔接","body":"真实成功压断盾护才有后续。练锏与硬鞭压护留隙的，可以付出自己的反应守住盾缘等待一人经过。"},{"title":"怎么拆解","body":"及时撤盾、让另一位盾手接替或护住打击方向外的路。"},{"title":"代价与错用","body":"气血伤害另算。对手可以下盾换位、在接近路上拦击或由第二面盾接替。\n\n对着已收盾的人仍押压盾会浪费这一手，前方没有预想窗口，自己留在容易被侧压的位置。"}],"links":["dunqian-let","zhuli-dun","jian-yingbian"]},
  {"key":"zhongchui-zhengjia","k":"armskills","kind":"招式","name":"沉锤震甲","summary":"用慢而明显的重击试压护甲和招架。","sections":[{"title":"怎么学","body":"候选由用锤匠师从轻槌校力练起。\n\n先用沉重器具练收势，再遇到实际甲具受力，分别说明损甲、余伤与被重击者的失衡。"},{"title":"什么时候能用","body":"双手持战锤，已占好接近位置，有清楚的攻击格。"},{"title":"怎么结算","body":"若命中，可分别记录甲损和短时失衡。"},{"title":"怎么衔接","body":"完成起手且命中后按真实受击部位看甲损。分力压甲可在出手前说明本次牺牲一部分实伤换压甲。"},{"title":"怎么拆解","body":"看见重打方向可绕到侧面、远手逼住锤手，或换位让原甲面打不着。"},{"title":"代价与错用","body":"挥锤前露出蓄势，出手后需要收势。闪让、远程压制或打断可减少这次重击机会。\n\n蓄势被扰或砸空都要收势，未发生的甲损不能写进计划。后排可先扩大距离再决定要不要守这一线。"}],"links":["xushi","shiheng","bu-jia","zhan-chui","zhongji-jiaxue"]},
  {"key":"luolian-raodun","k":"armskills","kind":"招式","name":"落链绕盾","summary":"用链兵的弧线考验持盾人的守护方向。","sections":[{"title":"怎么学","body":"可由奇门兵器传习者在宽地示范。\n\n在宽地侧绕盾面对练，实做一次出手与收链；再练挥动侧有人时按实停止。"},{"title":"什么时候能用","body":"持有可挥展的链枷或链兵，侧面有出手空间。"},{"title":"怎么结算","body":"目标盾面未覆盖预告来路时，允许按另一侧的防护条件结算。"},{"title":"怎么衔接","body":"链兵在盾手外侧取得能挥的空间后候着。链色被实物或同伴占用时，懂先收后换的人可抢着收回，照实际行动再选位置。"},{"title":"怎么拆解","body":"转向盾面、退进更窄的地形或贴到链条未展的一侧均可阻断。"},{"title":"代价与错用","body":"需要展开与收链。敌人可换向、退进狭窄处或在链节未展开前贴近。\n\n链条已经展开却扫不到时仍得付收回，器具本轮可能无法继续防身。队友以合法空格避开原挥线。"}],"links":["louxu-caiwei","zhuli-dun","bian-lian","sheng-biao"]},
  {"key":"shiding-jian","k":"armskills","kind":"招式","name":"候隙一箭","summary":"先选一段射界，等队友把对手引出来再放箭。","sections":[{"title":"怎么学","body":"可由猎户陪练，逐步转到和前排的协作演练。\n\n随猎人练一次可见目标踏过射界，实做有队友遮挡时拒绝放矢，确认准备与用箭各记。"},{"title":"什么时候能用","body":"弓手预先选定一格射界，弓和箭已就绪。"},{"title":"怎么结算","body":"目标离开遮蔽物踏入预设射界时，可选择用反应机会放箭。"},{"title":"怎么衔接","body":"队友把目标带到已选射格才可放箭。练换隙候发后，原线被挡先注销，把可支出的准备改守合法射线。"},{"title":"怎么拆解","body":"盾手领路、烟幕遮挡或不给目标踏入候发格都能让箭手空等。"},{"title":"代价与错用","body":"守候耗行动，机会也可能空过。对手可让盾手先行或走另一条受遮挡路线。\n\n先从可疑声响开箭可能在没有合法目标时浪费机会，若实际发出照扣箭矢。已花候守也不能存成下轮动作。"}],"links":["shouzhong-huifeng","wuyan","duankou-shexian","gong-shu"]},
  {"key":"liannu-zhuanhou","k":"armskills","kind":"招式","name":"伏弩换点","summary":"在掩护下换一个射击位置，再决定何时亮弩。","sections":[{"title":"怎么学","body":"可向有守关经验的弩手请教。\n\n在有掩护的实做中完成移动、核线、发矢或停发显然不同的三步，让里侧同伴确认。"},{"title":"什么时候能用","body":"弩手身处可达掩护格，待发状态与弩矢可查。"},{"title":"怎么结算","body":"允许先占与当前不同的射格，其射界在亮弩后才对对手明确。"},{"title":"怎么衔接","body":"先离开原瞄准格并查新的目标。若正装填，只有具备换点续装的用法且护位已接成，才按所记录的一次装填接续。"},{"title":"怎么拆解","body":"敌手可以同时遮两处射点、先逼装填同伴，或给弩手假报告分走注意。"},{"title":"代价与错用","body":"换点需要行动额度。原先预瞄作废，缺弹或失去掩护时须另找位置。\n\n换到新格发觉目标依然不可见时，本次行动已花，旧瞄准也已放掉。未待发的弩还得重新核弹药与掩护。"}],"links":["duankou-shexian","qimen-jinglu","nu-lian-jingzhi","tingnu-baowei","nu-ju"]},
  {"key":"dunqian-let","k":"shieldskills","kind":"招式","name":"盾前让步","summary":"盾手侧收一步，仍为撤出的同伴遮住一条来路。","sections":[{"title":"怎么学","body":"候选由镖师带领双人护位练习。\n\n实走一回侧收护人，在有人试图从第二侧贴上时要能告诉伤员还剩哪条路。"},{"title":"什么时候能用","body":"持盾者与要护的人相邻，且有可用侧格。"},{"title":"怎么结算","body":"盾手转到侧格并维持对选定一侧的遮护，使同伴有机会通过原位。"},{"title":"怎么衔接","body":"持盾者照旧遮住指定来路后移开本格，伤员或助人者在自己可动时经过。若备用格已经被占，不能先按原计划走。"},{"title":"怎么拆解","body":"先占侧格、沿盾手未选的一侧压近，或让需要过格的同伴一直受牵制。"},{"title":"代价与错用","body":"仍需支付走位和守护的开销。敌人从两面来时只覆盖事先选的一侧。\n\n盾手挪开原格后未能带队友经过，旧格会空。已走动作、变换盾面和后排等待分别记。"}],"links":["zhuli-dun","cheluzhen","xuway-shou","dun-ju","yanqian-xingxi"]},
  {"key":"bingdun-chengmen","k":"shieldskills","kind":"招式","name":"并盾成门","summary":"两人并排守住主要入口，让队友从后方退走。","sections":[{"title":"怎么学","body":"可由关城盾手传授，也可在营地先练互换站位。\n\n试一次两面都实际举盾，另验其中一个退出时能否分别喊明谁还守着。"},{"title":"什么时候能用","body":"两名可举盾的同伴占据相邻格，背后至少留一条通路。"},{"title":"怎么结算","body":"两面盾分别承担相邻来路。各自只在所护一侧具备援护机会。"},{"title":"怎么衔接","body":"两格两面都各有持盾者。确认两人能轮换，再接交替断后。剩下的一面只罩自己的范围。"},{"title":"怎么拆解","body":"让其中一人失位、耗掉其反应、切入两面没有同时罩到的方向。"},{"title":"代价与错用","body":"各需付出行动。任一人被牵走时该侧空出，剩下一人仍可单独自保。\n\n两名盾手同时把行动压在原门口时，后路若堵就难换班。倒下一侧后相关防护作废，剩余站位单独保留。"}],"links":["zhuli-dun","cheluzhen","goulian-tiaowei","dun-ju"]},
  {"key":"zhezhuo-jiejiao","k":"perkskills","kind":"招式","name":"截角接手","summary":"在保护范围内代替同伴顶住一次近身压力。","sections":[{"title":"怎么学","body":"随队护卫互练后可向领队申请学习，最终学习来源待定。\n\n与一名相邻搭档实做一次接手，验替格若被占时搭档如何留在原来安全处。"},{"title":"什么时候能用","body":"双方相邻，施招者尚有反应，预先选定具体同伴。"},{"title":"怎么结算","body":"敌人逼近被护者时，由施招者在合法空格接位或作一次牵制。"},{"title":"怎么衔接","body":"当约定被护者确实遇到近敌时，护卫核合法落格和自己的余量，再用接位或一次牵制承压。"},{"title":"怎么拆解","body":"卡替手的格、先让他消耗反应，或使被护者离开可照应距离。"},{"title":"代价与错用","body":"若接替格被敌占或施招者已受制，行动不能发生。\n\n错标受护者会错过真正的危险来路；替手已经移进不利格时，已走费用留账，队友照实际位置再推应对。"}],"links":["housheng-care","feixu-side","shouzhu-delu","linji-huanban"]},
  {"key":"qiangjiu-dingxin","k":"perkskills","kind":"招式","name":"临阵照护","summary":"先稳住伤员的当前状态，给撤退留一手。","sections":[{"title":"怎么学","body":"从随行郎中处学习队内照护例程。\n\n出师先在有护卫的实际接应中核一次先取包、再靠近、最后让伤员稳定到哪一步。"},{"title":"什么时候能用","body":"医者或受训同伴能到达相邻格，并有可用的急救物资。"},{"title":"怎么结算","body":"暂缓伤员的一项临阵恶化，并提示撤出所需的下一处安全格。"},{"title":"怎么衔接","body":"盾手先让开安全格。到相邻才能照护。若原照护者还没动用药且退路堵了，可经照护接续把同一急用包交给另一个在位的人。"},{"title":"怎么拆解","body":"迫使照护人停在受制格，拦住支援路线或切断原先约的信号。"},{"title":"代价与错用","body":"占用行动和物资，受牵制时会中断。战后伤势仍需调养。\n\n擅自进入没有掩护的近格，未完成的照护按中断记；已花行动和实际消耗的东西照记，伤者仍需要退离与后养。"}],"links":["housheng-care","linzhen-kit","cuzhan","zhaohu-jiexu"]},
  {"key":"yaoqian-huanshou","k":"perkskills","kind":"招式","name":"递药接应","summary":"把药散交给隔壁同伴，省去伤员自行从行囊翻找。","sections":[{"title":"怎么学","body":"可在营地和医者演练递物、撤步与换手。\n\n实交一次同一个急用包，让教者对照两双手、物件去了哪里，以及接者有无机会使用。"},{"title":"什么时候能用","body":"两人相邻且双方可行动，药散已放入随身位。"},{"title":"怎么结算","body":"接过物资的人之后可以另行使用，原持有者的随身物资扣除一次。"},{"title":"怎么衔接","body":"相邻双方能交物才付行动。接过去的人根据自己的后续动作选择用药、带走伤员或继续照护。"},{"title":"怎么拆解","body":"卡开两人、用牵制让手位腾不出，或逼接收者先退出原格。"},{"title":"代价与错用","body":"递送即占行动。二人仍暴露在所在格，可被敌手逼开。\n\n只在一方以为交接成立时，急用包可能仍留原持有人。准备动作照记，实际没接到就得回到可照护计划。"}],"links":["linzhen-kit","housheng-care","zhaohu-jiexu"]},
  {"key":"tongpao-huying","k":"perkskills","kind":"招式","name":"同袍应声","summary":"在同伴战意将散时给出明确的守退信号。","sections":[{"title":"怎么学","body":"候选由队中老卒教常用呼声与退路约定。\n\n验证一次接信人确实听见并找到预定可退格，让老兵记好能退与愿意退分别有什么条件。"},{"title":"什么时候能用","body":"目标看见或听见施招者，还能作出选择。"},{"title":"怎么结算","body":"同伴可尝试稳住战意，或接受指示撤到已标明的安全格。"},{"title":"怎么衔接","body":"先让当事人确认身旁已有接应，随后打出止守信号。会援声稳撤的人还可事先约好在动摇后的退步时机。"},{"title":"怎么拆解","body":"从声音到不了的一侧切开人物、抢占退格或加施近处压力。"},{"title":"代价与错用","body":"只能照应选中的人，既有合围和伤势仍各自生效。敌手可以隔开双方。\n\n对离得太远的人空喊照样耗行动，临阵动摇和现有牵制按实际保留。领队要以能到位的援手接手。"}],"links":["shouzhu-delu","guxing-xiufu","yuansheng-wenche","wending-xin"]},
  {"key":"cuowei","k":"zoc","kind":"身法","name":"错步让位","summary":"沿相邻空格拐一步，给同伴腾出原先占的格位。","sections":[{"title":"怎么学","body":"候选由老镖师和剑门弟子用双人练习传授。\n\n在有退让关系的真实小差里各走一步，并让搭档说明自己什么时候真正取得原位。"},{"title":"什么时候能用","body":"可用的侧格与原格相邻，脚下仍能脱身，需要补位的搭档已知道目标格。"},{"title":"怎么结算","body":"本人用移动到侧格才让出旧格。伙伴看见空位并使用自己的移动后才算实际接上，按他的装备和方向开始准备下一手。"},{"title":"怎么衔接","body":"选好合法侧格，自己移动并留出旧位。第二位同行者用他的行动进入，停稳后才可开始盾守或夹护。"},{"title":"怎么拆解","body":"占侧格、把任意一人牵住，或拖到接手的时点已经作废。"},{"title":"代价与错用","body":"第一人已离位而第二人被截住时，旧格暂空，前者已经付出的移动照记。提前看见侧格被占时可取消，改站原位守或等援。"}],"links":["jianfeng-huanwei","dunqian-let","huishen-huandao","luobu-jiezhao"]},
  {"key":"feixu-side","k":"zoc","kind":"身法","name":"飞絮侧掠","summary":"避开已预告的一条攻击方向，同时保留相邻照应。","sections":[{"title":"怎么学","body":"候选由山野行客教身法，需先掌握错步。\n\n师父演一处已经亮出的来路，让搭档另从未守侧施压。实做验出侧掠之后仍有可达接应格。"},{"title":"什么时候能用","body":"看见对手已经亮出可辨方向的起手，确认相邻侧格和途经边可用，还有一份反应和足够内力。"},{"title":"怎么结算","body":"在对手结算前用反应，开始侧移时扣气。按实际落点判断原起手是否够得到，敌手能否改向取决于他的招法。其他敌人还有合法牵制时照实判。"},{"title":"怎么衔接","body":"等已看见起手且侧格合法时再付反应侧移，保留相邻援手。换格之后合理再读可及距离及后续行动。"},{"title":"怎么拆解","body":"用改向、堵侧格或在前手先消耗反应，让侧掠没有有效路线。"},{"title":"代价与错用","body":"被虚进诱到就已经交掉反应和用过的气。起步前看见退格被占可以收住，已经起步却被拦时按实际受迫落点处理。"}],"links":["cuowei","louxi","louxu-caiwei","qimen-shiqiang","huishen-huandao","luobu-jiezhao","chai-zhaojue"]},
  {"key":"louxu-caiwei","k":"zoc","kind":"身法","name":"绕势踩位","summary":"比起立刻进攻，先绕到能接应队友的位置。","sections":[{"title":"怎么学","body":"可向游侠或镖队探路人请教。\n\n由向导选择有同伴可依的侧路，实走确认这一程没有跨敌占格，复练其中一处转角被封。"},{"title":"什么时候能用","body":"能确定一条沿外缘走到接应人邻格的连续路线，当前身体、装备和移动方式允许。"},{"title":"怎么结算","body":"用自己的移动逐格绕行。走到后重新查距离、视线和剩余动作，可选择接防或给人留路。"},{"title":"怎么衔接","body":"先看接应者的位置再绕到能照应的一侧。到了格再决定让人、接防或按现有距离试出手。"},{"title":"怎么拆解","body":"关住拐角、先占目标格或让绕势者一路受牵制。"},{"title":"代价与错用","body":"敌人堵转角时，在最后合法落格止步。已经走过的行动照记，挂在新格的接护要等人真的到位，旧格仍需队伍另守。"}],"links":["feixu-side","shiding-jian","qimen-jinglu","huishen-huandao","duangukou","luobu-jiezhao"]},
  {"key":"tieshi-dibu","k":"height","kind":"身法","name":"贴石下步","summary":"从高处退到可到达的低格，换一条撤路。","sections":[{"title":"怎么学","body":"候选可由山路向导教授，移步能力和衣甲限制待定。\n\n在向导陪同下查高低落差，护送中从合法低格带人与物通过，用同等衣甲复验落地后的站位。"},{"title":"什么时候能用","body":"衣甲与腿脚允许下移，已看过相邻的下行落点并确认它能立足，有这一段所需移动。"},{"title":"怎么结算","body":"靠正常移动下到低格，地势和牵制在经过相应边时处理。实际站稳才可用拢劲回稳或给后队报出该格。"},{"title":"怎么衔接","body":"先核高低格通行，再下步到认得的格。落稳后能接拢劲回稳，或把新的低处让给走在后面的人。"},{"title":"怎么拆解","body":"守住落点、逼人在高处先失衡或用侧向牵制截住下行。"},{"title":"代价与错用","body":"落点被占、腿脚失稳或从侧面被截都可阻止继续。起步后的移动正常记账，成功离开高格后要由够得着的人补照应。"}],"links":["duangukou","cheluzhen","buli-lijia","dingxuan-xi","huishen-huandao","luobu-jiezhao","tiekan-fencheng"]},
