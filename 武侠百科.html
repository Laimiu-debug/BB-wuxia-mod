  {"key":"xuway-shou","k":"zoc","kind":"身法","name":"扶退换守","summary":"受护者后退，旁人补到空位维持两人的照应。","sections":[{"title":"怎么学","body":"候选可在押运和伤员撤离练习中共同习得。\n\n用一次真实的退出作证。要看到当事人先走、接位者随后过格，再练一次失去任一动作时怎么取消。"},{"title":"什么时候能用","body":"双方事先确认谁先退出、谁从哪来接原位，均有移动并能接到消息，两个路段按各自负重与牵制可行。"},{"title":"怎么结算","body":"第一人自行退出，第二人看见空格才按自己的行动移动。接位者站稳后方能按普通守势或已学专长接下一手。"},{"title":"怎么衔接","body":"确认两人的次序，各自行走。后一个人进到空位之后，才有普通守势或按临机换班的条件接手。"},{"title":"怎么拆解","body":"占据撤落与接入的两个不同格，或打断两人任何一方的移动。"},{"title":"代价与错用","body":"先出去的人已经付步费。接位者临时被牵住就留下真空位，原先的护位不能追认。两边都没走前看见变数时可暂停计划。"}],"links":["dunqian-let","housheng-care","cheluzhen","linji-huanban","chelu-liuwei","luobu-jiezhao"]},
  {"key":"cuzhan","k":"effects","kind":"状态","name":"气竭与基础动作","summary":"内力接近用尽时，突出显示还能使用哪些动作。","sections":[{"title":"出现条件","body":"连续出招、受压后的恢复不足或主动花掉预留内力，可令内力低到难以再用耗气招。"},{"title":"表现与影响","body":"气不够用时，耗气分支按实际所需判断。普通移动、未加运劲的普攻和基本防守照行动、牵制和状态结算。行动顺序、受伤和负物各自看当前条件。"},{"title":"解除与延续","body":"可以先请同伴接手，退到稳固可停且脱开直接压力的格。按普通整息的完成条件恢复，或用已经练成的回气法。回气中断后须重新找机会。"}],"links":["xuqiu-tiaoxi","bulong-jin","housheng-care","yunqi-tiaoxi","yanqian-xingxi"]},
  {"key":"xushi","k":"effects","kind":"状态","name":"已起手","summary":"用清楚的标记提示谁在等时机施展什么方向的招式。","sections":[{"title":"出现条件","body":"人物启动需准备且容许反应的一种招法，至少公开当前来路或目标格。"},{"title":"表现与影响","body":"未出手前可因对手走位、侧击或己方改选而改变结果。"},{"title":"解除与延续","body":"被打断后会失去此次机会，已经消耗的行动与内力怎样退还待议。"}],"links":["zhongdao-poya","zhongchui-zhengjia","jifeng-kaidao"]},
  {"key":"shoushi","k":"effects","kind":"状态","name":"守住一侧","summary":"前排准备在指定方向应付一记攻击。","sections":[{"title":"出现条件","body":"选择守势并保留至少一次可用的反应机会。"},{"title":"表现与影响","body":"进入预定来路的招式可以触发护架或还手。余下方向仍按常规防护处理。"},{"title":"解除与延续","body":"换位、被牵制或用尽反应机会后结束。持续回合和剩余提示待议。"}],"links":["shouzhong-huifeng","jinzhong-huxi","guqiang-zhen"]},
  {"key":"louxi","k":"effects","kind":"状态","name":"短时露隙","summary":"对手在守势失位或收势不及时后露出一点机会。","sections":[{"title":"出现条件","body":"招架失败、重击落空或被迫离开护位，均可成为候选触发。"},{"title":"表现与影响","body":"显示可利用的来路。趁隙者仍需够到，并承担本招消耗和命中判定。"},{"title":"解除与延续","body":"目标可靠回守、拉远身距或请求队友补位。和护甲的结算顺序待定。"}],"links":["zhongdao-poya","tanfeng-wenlu","shiheng"]},
  {"key":"shiheng","k":"effects","kind":"状态","name":"脚下失衡","summary":"被重力扰动后，步法或架住下一招暂时变难。","sections":[{"title":"出现条件","body":"重击、地势落差或被拖离稳定格位后出现。"},{"title":"表现与影响","body":"候选影响下一步走位或反应，具体哪些动作受限由造成者显示。"},{"title":"解除与延续","body":"有限时效，也可用稳固落脚处恢复。是否会跟露隙相互延续待定。"}],"links":["zhongchui-zhengjia","yinjing-zhuanfeng","duangukou"]},
  {"key":"wuyan","k":"effects","kind":"状态","name":"烟幕遮线","summary":"视野被烟挡住，双方的远射和识别一起变化。","sections":[{"title":"出现条件","body":"烟罐等行动令选定格短时被烟覆盖。"},{"title":"表现与影响","body":"经过烟幕的射界需重新确认。烟里能不能察觉相邻人由观察规则决定。"},{"title":"解除与延续","body":"离开烟区或等烟散去可恢复。风、地势及多种格子效果共存仍待议。"}],"links":["miuyan-fengxian","cangyan","shiding-jian"]},
  {"key":"shouzhu-delu","k":"combat","kind":"战法","name":"让出救援路","summary":"让护卫先守险处，再为援手与伤员留出连续退格。","sections":[{"title":"阵容与站位","body":"用持盾者护住靠敌的一侧，医者不挤在同一个转角。"},{"title":"行动顺序","body":"先选撤离点，护卫以盾术让路，医者靠近照护，再按顺序和伤员一同后撤。"},{"title":"失败与调整","body":"退格被封便改用另一条来路。医者被围时优先派接手者，后续护卫换位由剩余行动决定。"}],"links":["dunqian-let","qiangjiu-dingxin","housheng-care"]},
  {"key":"guqiang-zhen","k":"surround","kind":"战法","name":"双枪守隘","summary":"两名长枪手先后管同一狭口的不同位置。","sections":[{"title":"阵容与站位","body":"枪手错格放置，后排留出一条不交叠的退路。"},{"title":"行动顺序","body":"前一人先定截击，后一人保留反应以保护侧路或接替。轮流调整内力和站位。"},{"title":"失败与调整","body":"不宜同时花掉截击。若被牵走一人，另一人缩成单线守位并叫后排转移。"}],"links":["hengqiang-jiebu","huiqiang-huhou","goulian-tiaowei"]},
  {"key":"duankou-shexian","k":"combat","kind":"战法","name":"错格远射","summary":"前排守住近路，弓弩手从错开的格位取得射界。","sections":[{"title":"阵容与站位","body":"盾手、弓手和弩手分据相互可照应的格位，预先约好备用射点。"},{"title":"行动顺序","body":"弓手候隙，弩手被压则换点。盾手守在敌人最可能通过的一侧并给回撤留格。"},{"title":"失败与调整","body":"烟幕和高低差均可能切断射界。远手看不见目标便移到下一事先选的格。"}],"links":["shiding-jian","liannu-zhuanhou","wuyan"]},
  {"key":"cheluzhen","k":"combat","kind":"战法","name":"交替断后","summary":"专用于撤出的队形，让还有行动的人先占住下一处退格。","sections":[{"title":"阵容与站位","body":"至少有两名能独立守住狭口的同伴，且另留伤员可走的通路。"},{"title":"行动顺序","body":"前人交出守位后去下一处布防，后人维持当前来路。需要时用烟幕掩护转换。"},{"title":"失败与调整","body":"队友内力不足或退路被占时要缩短队列，优先让伤员过线。"}],"links":["bingdun-chengmen","xuway-shou","miuyan-fengxian"]},
  {"key":"kaizhang-jielu","k":"perkskills","kind":"招式","name":"推掌解围","summary":"在相邻压力下用徒手牵制换来一步腾挪。","sections":[{"title":"怎么学","body":"候选由擂台拳师先教守距，再与移动同伴对练。\n\n在近侧实际压住一敌的追步，见被援者确实撤出；换一回两人同时逼迫的场景验作用边界。"},{"title":"什么时候能用","body":"至少空出一只手，自己或身旁同伴有被敌人压住的撤离方向。"},{"title":"怎么结算","body":"按近身命中判定尝试令一名敌手失去本次追步机会，撤离者仍须主动移动。"},{"title":"怎么衔接","body":"先看撤步是否还可能。短打成了才给该同伴撤出机会，另一侧最好仍有盾手控制。"},{"title":"怎么拆解","body":"用第二个追步者夹住同伴、抢占退格或让拳手始终够不到。"},{"title":"代价与错用","body":"一次只影响一名本可追进的对手。围住其余退路或逼他提前用掉反应可压住这一招。\n\n错误地向另一侧空打会留下贴身位置，已有动作消耗，真正追步者仍可压住计划路线。"}],"links":["quanjiao-gekai","louxu-caiwei","cheluzhen","shouzhu-delu"]},
  {"key":"jian-bingdu","k":"armskills","kind":"招式","name":"牵锋护肘","summary":"在相邻协作时用短剑把一名来敌的招法牵向空位。","sections":[{"title":"怎么学","body":"可由善使轻剑的师父传授，也可在双人剑谱中看到练法。\n\n由剑师安排真正相邻的来势，亲自牵到空位且护住同伴，复核准备格后来被占的动作中止。"},{"title":"什么时候能用","body":"短剑可及来敌，身侧选定一处空格，两位同伴都尚能照顾站位。"},{"title":"怎么结算","body":"命中或成功扰动时，可使对方重新确认该次攻击的目标或来路。"},{"title":"怎么衔接","body":"当短剑确实够到来敌，试将其攻势牵到另一个可承受的方向。队友依据实际结果再作换位与收锋。"},{"title":"怎么拆解","body":"长兵留在短剑以外、先逼占空格或让两名近身者无法突然相顾。"},{"title":"代价与错用","body":"动作和反应都可能花费资源，身侧若被占则无法开启。长兵可避开短剑有效区。\n\n预先把敌手当作已被牵走时，侧隙仍可能挨打。准备耗用照记，目标没被牵住就得重新判断。"}],"links":["tanfeng-wenlu","shoushi","cuowei","dan-jian","jianfeng-huanwei"]},
  {"key":"chongjie-fanbu","k":"zoc","kind":"身法","name":"折身回步","summary":"先露出继续上前的意图，再回到可照应同伴的位置。","sections":[{"title":"怎么学","body":"候选可从旧同门试脚步的操练中求教。\n\n练先试进再收回一步，实做中由接应者确认所有经过格可走，尤其改线后的最后落脚。"},{"title":"什么时候能用","body":"先看进路和折返时能停的格，两段都有可能靠当前行动走完，手中兵器便于收势。需要运劲起步，还须有余气。"},{"title":"怎么结算","body":"试进真正开始时扣用气和进段移动。见到对手怎样守再选是否折返，以余下可用移动逐格走回已核的格。"},{"title":"怎么衔接","body":"对手显出会守的来路后，未到险格前可选折返，给守位的搭档留出继续观察的空间。"},{"title":"怎么拆解","body":"在画好的中间格设拦截、提早占最后退格，或等侠客花完来回的行动再逼进。"},{"title":"代价与错用","body":"试进耗气之后，被截或退格被抢都照实结算，原来计划的退格可以换成尚可到的合法格。把进段距离算满才想折回，会因没有余步停在前面。"}],"links":["hengqiang-jiebu","jianfeng-huanwei","guqiang-zhen","huishen-huandao","duan-ci","luobu-jiezhao"]},
  {"key":"zhuli-dun","k":"shield","kind":"器物","name":"榆木护路盾","summary":"镖队在桥口和狭路常用的一手盾具候选。","sections":[{"title":"用法或来历","body":"盾面足以照应相邻来路，适合盾前让步、并盾成门与临时护货。"},{"title":"限制与取舍","body":"能护住的只是当前选定方向。举盾、移动与被锏压迫分别计，盾缘受损可显出维修提示。"},{"title":"取得与流转","body":"在镖局库房领用，或交百工坊用木料与盾缘件修缮。防护、耐久和负重待定。"}],"links":["dunqian-let","bingdun-chengmen","tieji-dingdun"]},
  {"key":"pingshan-qiang","k":"spear","kind":"器物","name":"平山护镖枪","summary":"为桥口与乡道的守位准备的一杆普通长枪。","sections":[{"title":"用法或来历","body":"让护卫先管可及的一段来路，也可退出第一排改护医者。"},{"title":"限制与取舍","body":"贴近时受长柄限制，绕开侧线或耗掉截击后，枪手要主动换位。"},{"title":"取得与流转","body":"候选可在威远的练兵场借来演练，耗损可用随队修料登记。"}],"links":["hengqiang-jiebu","huiqiang-huhou","guqiang-zhen"]},
  {"key":"yankou-dao","k":"cleaver","kind":"器物","name":"阔背镇口刀","summary":"用于试验重刀起手、威压与收势取舍的双手兵器。","sections":[{"title":"用法或来历","body":"持用时更适合在开阔的前格作压制，旁边同伴拥挤时难展开。"},{"title":"限制与取舍","body":"占双手和磨损预算，遇敌先看能否站稳起手位置。被绕近时可收刀换守。"},{"title":"取得与流转","body":"由习重刀的教头携同武艺出现，也可在器具铺遇到其他来历的同型刀。"}],"links":["zhongdao-poya","louxi","bu-jia"]},
  {"key":"xuanjin-shou","k":"namedweapon","kind":"器物","name":"归渡旧剑","summary":"剑格刻着旧渡印的名器候选，可循原物追索。","sections":[{"title":"用法或来历","body":"旧渡匠人存有印样，曾失剑的武人只留下一封认领信。有剑、印与信时可认真辨认。"},{"title":"限制与取舍","body":"以一般剑招开局。是否存在专属回锋变式、要练多久和失剑后能否继续使用待议。"},{"title":"取得与流转","body":"可在《认回渡口旧剑》中找原持有人。典当、归还或留下都会更新同一物件的归属。"}],"links":["shouzhong-huifeng","xun-jian-dukou","wuchang"]},
  {"key":"buli-lijia","k":"body","kind":"器物","name":"布里行甲","summary":"以可动和易修为主的轻身甲候选。","sections":[{"title":"用法或来历","body":"供探路人、游斗者或护退的同伴穿用，检查贴身和低阶格位的移动条件。"},{"title":"限制与取舍","body":"在持续承压时需要其他守位协助。具体甲值、破甲率和负重均待定。"},{"title":"取得与流转","body":"城镇匠人可用现成补料修缮，也可参加营地试装。"}],"links":["tieshi-dibu","feixu-side","bu-jia"]},
  {"key":"juguai-shouguan","k":"beasts","kind":"对手","name":"关下山岩巨怪","summary":"体型大，守着狭路前的水洼，是用来检验路线与撤出的候选遭遇。","sections":[{"title":"可见征兆","body":"沿水洼边活动，地面有深足印和碰裂的石块。临阵先让人看到其重击所向。"},{"title":"交手方式","body":"会试图占住队伍必经地点。抡锤或长钩可用来试探是否能移开它，相关判定待议。"},{"title":"应对与待定","body":"可绕另一岸、引开或选择撤退。处理结果会影响附近道路，但不会改变无关地区的行情。"}],"links":["duangukou","goulian-tiaowei","guqiang-zhen","juguai-taan","juguai-chichong"]},
  {"key":"qimen-jinglu","k":"goblins","kind":"对手","name":"奇门守隙小队","summary":"用伏弩、地面用具和游斗手守一处岔路的候选对手组合。","sections":[{"title":"可见征兆","body":"过路人见到临时遮蔽物、已移动的足迹或废弃器具，队伍可先查看附近路况。"},{"title":"交手方式","body":"伏弩手管一条射界，游斗者追求侧面位置。若被压制，小队尝试退到另一条路。"},{"title":"应对与待定","body":"可借盾遮和烟幕推进，也能退回去查另一出口。几人一组、哪些点能设伏待定。"}],"links":["miuyan-fengxian","liannu-zhuanhou","jili-bag","qimen-huanshao","qimen-shiqiang","qimen-jieche"]},
  {"key":"muwei-zhengxing","k":"undead","kind":"对手","name":"双位古墓甲卫","summary":"两名守卫同时照应同一处入口的候选组合。","sections":[{"title":"可见征兆","body":"兵器、甲制与入口形状在进入时可见。一人贴窄口，另一人借长兵守侧。"},{"title":"交手方式","body":"近处战手挡住探进者，远位守卫等有人绕行时才接手。"},{"title":"应对与待定","body":"先识别守卫的有效范围与该门是否必要通过，可绕过或逐个引开。傀儡怎样换守待定。"}],"links":["shoushi","guqiang-zhen","goulian-tiaowei","muwei-hemen"]},
  {"key":"lishang-duizhu","k":"champions","kind":"对手","name":"守约的擂客","summary":"输过一场之后仍愿再赴约的成名武人候选。","sections":[{"title":"可见征兆","body":"此前交锋的结果和双方约定仍在。本次碰面是听到新消息或收到新邀约。"},{"title":"交手方式","body":"按明确的擂规使用兵器，落入不利会收手或请求改期。胜败、伤势和当众说的话分别记。"},{"title":"应对与待定","body":"可应约、协商彩头或推迟，名望只传给见证者及日后听闻的人。"}],"links":["ring-yuedou","mairu-xusu","daobei-tuizi","shouyue-tibi"]},
  {"key":"hushou-liaowang","k":"bandits","kind":"对手","name":"桥北望风手","summary":"在一趟押运附近辨认货车和旗号的劫队成员候选。","sections":[{"title":"可见征兆","body":"先出现在可撤的坡顶或桥侧。领队若提前查路，可察觉其重复观察同一车队。"},{"title":"交手方式","body":"发现货队时给同伙传信，避免独自承压。失去接应则尝试离开。"},{"title":"应对与待定","body":"提前部署护卫或临时改道可改变袭扰机会。若留活口或发现遗物，后续可核查他收到何种消息。"}],"links":["qiaotou-budao","heifeng","tujing-kantu","heifeng-luosuo"]},
  {"key":"yanwu-baowu","k":"constructs","kind":"对手","name":"看匣机关卫","summary":"只护某一匣物件、松手后会改变守位的遗迹守卫候选。","sections":[{"title":"可见征兆","body":"先从灯影、枢轴与被护匣的位置辨认真正的守备对象。"},{"title":"交手方式","body":"靠近被护物时尝试阻止交互。队伍在远处驻足时，它可能仍停在原位。"},{"title":"应对与待定","body":"能否用另一通路避开、移走目标或解除驱动都属待议，避免凭故障随机解除。"}],"links":["muwei-zhengxing","duanzhiyemi","fengjian-biaoji","yanwu-huishou","yanwu-tingmen"]},
  {"key":"tongxing-kaipian","k":"origins","kind":"开局","name":"小队初走镖","summary":"以一队接散镖的新人开始单局江湖。","sections":[{"title":"起始处境","body":"初始有人熟悉货单、有人能守狭口，但随队储银较紧。第一份协议可挑选稳路或险路。"},{"title":"开局目标","body":"护住同伴、完成交割并攒出下一趟盘缠。回镇后可以按交手暴露的短处去请教。"},{"title":"初始条件待定","body":"队伍编制、初始行囊和押运限期待议。首次可有不接镖或改接小差事的选择。"}],"links":["jiaokou-biaotu","weiyuan","chengkou-yaobiao"]},
  {"key":"canjian-kaiju","k":"origins","kind":"开局","name":"残门寻同伴","summary":"带残剑门旧同伴出发，沿剑谱线索找散失的人。","sections":[{"title":"起始处境","body":"队伍带一片旧记和一条残页线索。已有人学过单人守势，队友还不能熟练接位。"},{"title":"开局目标","body":"先找到见过旧人的人，再决定护送、打听下一处落脚点或用已有武艺接差度日。"},{"title":"初始条件待定","body":"能否请来旧同门取决于各人去留。开启时所带人数与持有之物另定。"}],"links":["canjian","canmen-xuetu","duanzhiyemi"]},
  {"key":"jingyesi-kaiju","k":"origins","kind":"开局","name":"借信办旧案","summary":"以靖夜司暗桩的候选身份接手一桩缺证据的小案。","sections":[{"title":"起始处境","body":"携一封指向辖区内联络人的旧信，初始人手适合走访和守望。"},{"title":"开局目标","body":"用亲见、货签和证词核对一次失物去向，换取之后差事的申请机会。"},{"title":"初始条件待定","body":"授权只涉及该桩差事，其他地方的通行照当地约定。结案与不再追索的条件待定。"}],"links":["jingyesi","paoshang-qianpiao","guichang-shihuo"]},
  {"key":"housheng-care","k":"retinue","kind":"行家","name":"随队照护人","summary":"清点急救物资、看护归营伤员，也可能亲自负责临阵照护。","sections":[{"title":"队内职责","body":"对出勤只负责已经约定的职责。战前与领队确认伤员撤路和供取的随身用具。"},{"title":"能提供的帮助","body":"能给低经验同伴示范递药接应与伤员撤离。战后登记谁需要歇息、还能否赶下一程。"},{"title":"聘用与限制","body":"是否占出战名额、可连续照顾的人数和报酬待议，靠队友留出安全位置。"}],"links":["qiangjiu-dingxin","yaoqian-huanshou","linzhen-kit"]},
  {"key":"tujing-kantu","k":"retinue","kind":"行家","name":"查路绘图人","summary":"走在前方核实地形，把有出处的路况写进随队图。","sections":[{"title":"队内职责","body":"找同行者、旧路线与地面标志确认途中能否走车、哪里能撤步。"},{"title":"能提供的帮助","body":"把刚核过的路线和传闻未证实的路线分别标识。可据此选较安全的再探路径。"},{"title":"聘用与限制","body":"绘制和亲眼重查看所花时间。道路在时局变更后可能失效，迹象待议。"}],"links":["duangukou","qiaotou-budao","yaoqian-xiaoxi","yanqian-xifa","duangu-danfa"]},
  {"key":"weiyuan","k":"factions","kind":"势力","name":"威远镖局","summary":"候选镖局，靠承接货运及其信用长期活动。","sections":[{"title":"组织与活动","body":"总号接委托，分号可依约指派一批人手。若领队不接药镖，可由别队护送。"},{"title":"交往方式","body":"队伍可以走镖、向老镖师学桥口守法、押完货核验镖银。谁带哪张镖单都可追。"},{"title":"待定事项","body":"镖局是否能在局内开新分号、玩家与其长期关系，以及失镖后如何赔付待议。"}],"links":["tongxing-kaipian","chengkou-yaobiao","huizhen-jiesuan","weiyuan-kaoke","paiqiao-yuewei","shuangqian-jiaohuo","shouyue-ke"]},
  {"key":"jingyesi","k":"factions","kind":"势力","name":"靖夜司","summary":"候选追查组织，按委托与辖区核实具体案件。","sections":[{"title":"组织与活动","body":"暗桩可以接触货签、失物报案和目击者。案令的具体范围需要可查。"},{"title":"交往方式","body":"队伍可报信、提供证物或应邀护送当事人。通过调查弄清物件去向后可以交差。"},{"title":"待定事项","body":"组织权限、罚则和调查牵连的范围尚未确定，同一案件的追查需有证据链。"}],"links":["jingyesi-kaiju","paoshang-qianpiao","fengjian-biaoji"]},
  {"key":"wuchang","k":"factions","kind":"势力","name":"无常鬼市","summary":"候选地下交易与传话网络，人、货和消息有不同来路。","sections":[{"title":"组织与活动","body":"可能有鉴货人、中人、买主与异地传话者。行情只对知道这次交易的人可见。"},{"title":"交往方式","body":"队伍可托人鉴定旧物，核封记或购买一条有时效的寻货消息。买卖之后须更新实物持有人。"},{"title":"待定事项","body":"要不要固定驻地、参加交易的凭信和假消息被揭穿后的变化待议。"}],"links":["guichang-shihuo","xun-jian-dukou","yaoqian-xiaoxi"]},
  {"key":"canjian","k":"factions","kind":"势力","name":"残剑门","summary":"候选剑门，流散弟子仍凭旧交、信物和既有剑法寻访同门。","sections":[{"title":"组织与活动","body":"能教哪套剑术由当时在场的人和现有卷谱决定。不同弟子可以各自承担师门旧约。"},{"title":"交往方式","body":"可出手保护同门、寻残页或借引荐信请教师父。所学武艺能用于守线与换位。"},{"title":"待定事项","body":"是否有正式山门可回、卷谱谁能阅读及弟子回去多久待议。"}],"links":["canjian-kaiju","huifeng-jianpu","guanmen-baili"]},
  {"key":"heifeng","k":"factions","kind":"势力","name":"黑风寨","summary":"候选绿林寨众，在盘缠、承诺和地盘之间选择行为。","sections":[{"title":"组织与活动","body":"有要供养的人及能派出的劫队。药镖是否被盯上取决于传来的消息及可调人手。"},{"title":"交往方式","body":"队伍可依当地情势提前查路、谈通路或在失镖后依证追货。亲眼见过的人才能报确切线索。"},{"title":"待定事项","body":"各支寨兵服从程度、是否长期以劫掠谋生和能否改变经营方式待议。"}],"links":["hushou-liaowang","qiaotou-budao","paoshang-qianpiao","heifeng-duoche"]},
  {"key":"duangukou","k":"terrain","kind":"地点","name":"断谷狭口","summary":"高低格位交错的山道，用来推演押运、贴近与撤出。","sections":[{"title":"怎样发现","body":"两侧一高一低，货车主路比徒步旁道窄。领队可由高处先察望风人和车道通行。"},{"title":"可办之事","body":"枪手守住上路，盾手护住转角，医者在可后撤的位置照应。重器能否在转角展开须另判。"},{"title":"变化与待定","body":"道路封断时，更新货车、步行两种通行记录。实际格形与路线待议。"}],"links":["hengqiang-jiebu","tieshi-dibu","qiaotou-budao","duangu-danfa"]},
  {"key":"huiwan-yaopu","k":"buildings","kind":"地点","name":"回湾药铺","summary":"一趟候选药镖的收货位置，也是队伍补药与照护伤员的地方。","sections":[{"title":"怎样发现","body":"缺哪批药、何时到货及收货人写在委托里。店里的可用库存和等候时间可见。"},{"title":"可办之事","body":"签收后只让这一批药货进入药铺库存。队伍也可在此安排休养或委托药师鉴料。"},{"title":"变化与待定","body":"货未到时仍可缺药，影响只落在相关市镇与库存。费用和余货流向待议。"}],"links":["chengkou-yaobiao","huizhen-jiesuan","yaopu-jiaoliao"]},
  {"key":"duanzhiyemi","k":"landmarks","kind":"地点","name":"断碑旧驿","summary":"藏有不完整剑谱和旧守卫的一处候选秘境。","sections":[{"title":"怎样发现","body":"可由返乡弟子或查路绘图人认出碑记。岗口能走的路和被锁住的内匣可分别查探。"},{"title":"可办之事","body":"走外路或许只找到一片残页。若进一步开启内匣，要先弄清守卫与红封记的关系。"},{"title":"变化与待定","body":"同一残页由拿到的人持有，后来的寻访人只得见剩余线索。进入和取物条件待议。"}],"links":["canjian-kaiju","yanwu-baowu","huifeng-jianpu"]},
  {"key":"yaoqian-xiaoxi","k":"rumors","kind":"地点","name":"渡口茶棚","summary":"确认消息是亲历还是转述的地方。","sections":[{"title":"怎样发现","body":"每天谁经过、哪一段路刚受扰可问棚主。过路镖师、船家与山货客能给出不同时间的消息。"},{"title":"可办之事","body":"记录谁说的和他最后见到哪批人货。进茶棚也可能听到现有的人在寻回旧剑。"},{"title":"变化与待定","body":"是否收打听费用和消息多久失准待议，消息变化不会直接改变器物归属。"}],"links":["qingshan-wangdai","tujing-kantu","xun-jian-dukou"]},
  {"key":"yidi-jieqian","k":"caravans","kind":"行旅技","name":"异地接签","summary":"收货人改换交割点时，凭原约里有据的授权按同一票货办完交接。","sections":[{"title":"习得条件","body":"已经独立做过双签交货，并完成过一票有授权的换人或改点交付。由威远验签人复核承运签、转交凭信与到货实物。"},{"title":"发动","body":"仍在原委托有效期，货主或原收货人给过具体授权，现接手的人能与见证或凭信印证。先清点实到之物和已经签收的部分。"},{"title":"作用","body":"可以在被允许的新地点更新实际交付人与货物持有。只给本次核收的实物写签收。当前货单沿用，已付酬银和已签收的货仍用原登记。"},{"title":"代价与对手应对","body":"核实要花时间，通常多一次见证沟通。证词和封记对不上时须等、改交或继续托管。接手人权限终止后按原差事补办。"}],"links":["yaohuo-jieji","shuangqian-jiaohuo","huozhan-yanfeng","guichang-shihuo"],"systems":["levels"]},
  {"key":"shuangqian-jiaohuo","k":"caravans","kind":"行旅技","name":"双签交货","summary":"以写在同一票镖单上的承运证与到货证核认同一批实物。","sections":[{"title":"习得方式","body":"向威远镖局的验签人学，实查回湾药铺的交割。学员先辨货主、承运人和谁有资格签收，再独立说清楚一张货单。"},{"title":"使用条件","body":"有同一批货的现有记录，双方均可核对。若已经拆包、换人或缺件，先登记实际状态再签。"},{"title":"规则效果","body":"实际由承运人交给收货者的部分才写进签收。失落或留下待验的部分仍可继续查找，兑现哪笔酬银以具体约定为准。"},{"title":"代价与应对","body":"核验要花交割时间，验货人与双方均需能查来路。假货签可被对照货物和熟识的见证人发现。"}],"links":["huozhan-yanfeng","chengkou-yaobiao","huizhen-jiesuan","zizhi-linghui","yaohuo-jieji","yidi-jieqian"]},
  {"key":"shezhong-zhongbiao","k":"caravans","kind":"行旅技","name":"卸货留记","summary":"行囊过重或车路断开时，暂托一件实物，给人留出先走的路。","sections":[{"title":"习得方式","body":"桥头渡工与学镖人合练。选可查的地方，记录托管人、到期日、取走方式和信物来路。"},{"title":"使用条件","body":"货件可暂分，委托与货主允许托管。双方确认地点与交接，队伍要先有一小段能付出的停留时间。"},{"title":"规则效果","body":"留置货件从车上移到选定地点及托管者记录。领队可带伤员或余货先到下一站，日后按记录取回。"},{"title":"代价与应对","body":"托管占时间与人情，货件可能被移动或追问。另一方可凭可核的封签追查其去处。只有实际取回再入队伍库存。"}],"links":["dulou-chuangong","qiaotou-budao","fengjian-biaoji","zizhi-yingbian"]},
  {"key":"chengkou-yaobiao","k":"civiljobs","kind":"委托","name":"回湾走药镖","summary":"替药商把同一批药送到回湾药铺，是多系统共用的一次委托示例。","sections":[{"title":"接差条件","body":"药商列出收货人、验封位置、货单和酬银约定，领队可先核通路与行囊再决定是否接。"},{"title":"途中过程","body":"经候选路段推进。途中可遭望风、遇劫或改道，实际交割须按车上那批货的状态完成。"},{"title":"交割与分支","body":"送达后药铺签收并依约领酬。失镖后按最后踪迹追查。领队不接时可由别队承运。"}],"links":["weiyuan","huiwan-yaopu","qiaotou-budao","paoshang-qianpiao","lilian-huqiao","shoubai-jiulu"]},
  {"key":"paoshang-qianpiao","k":"noblejobs","kind":"委托","name":"循签追失货","summary":"失镖后的追加差事，追的是之前那一批货。","sections":[{"title":"接差条件","body":"取原货单、见过货物的人和最近消息，确认货物确实没被签收。"},{"title":"途中过程","body":"可查望风人的来路、鬼市中人的报价或现场封记。遇货时先核包裹是否同一批。"},{"title":"交割与分支","body":"追回后更新当前持有人，再按新约交还。已耗掉或卖出的部分须有可核去向。"}],"links":["chengkou-yaobiao","jingyesi","guichang-shihuo","fengjian-biaoji"]},
  {"key":"xun-jian-dukou","k":"civiljobs","kind":"委托","name":"认回渡口旧剑","summary":"替一位旧剑主找回一件来历能查的器物。","sections":[{"title":"接差条件","body":"他提供剑格的渡印和上次见到它的人。若剑已转卖，需向当前手持者说明来意。"},{"title":"途中过程","body":"可在渡口问路，去鬼市请行家核印，再查是否已有另一封认领信。"},{"title":"交割与分支","body":"失主接回后补写归属。若旧主同意转让，记成交和后来可否求教。酬银待定。"}],"links":["xuanjin-shou","yaoqian-xiaoxi","wuchang"]},
  {"key":"ring-yuedou","k":"contracts","kind":"委托","name":"城中讲定彩头","summary":"比试前先把所约的兵器、彩头和停止条件讲清楚。","sections":[{"title":"接差条件","body":"由守擂或应擂的人挑一名对手，给拒绝、改期或换彩头机会。"},{"title":"途中过程","body":"按擂规进行，受伤、离台和提出止斗先各自记录，达成胜负时才交付约定的彩头。"},{"title":"交割与分支","body":"见证者可带走比赛消息。双方后来愿不愿意再约，由这件事和后续听闻决定。"}],"links":["lishang-duizhu","mairu-xusu","daobei-tuizi"]},
  {"key":"qiaotou-budao","k":"evcontract","kind":"际遇","name":"桥口牌倒","summary":"车到桥口才听说指路牌被推倒，原路可能已经有人守着。","sections":[{"title":"触发与可见线索","body":"当前有走镖货队，且领队未亲自核实最后路段。斜倒的牌和新车辙都可检查。"},{"title":"可选处置","body":"可留人看货，再派探路人察看。也可改走绕路。守好队形后继续行车同样可选。"},{"title":"后果与延续","body":"绑在同一张镖单上。迟到、碰面和是否能逃出由真实路况决定。"}],"links":["chengkou-yaobiao","duangukou","hushou-liaowang"]},
  {"key":"guichang-shihuo","k":"evcontract","kind":"际遇","name":"鬼市对货","summary":"中人听说要找旧货，摆出一件外观相似、封记却不同的包裹。","sections":[{"title":"触发与可见线索","body":"追货人握有原来的货签或亲见者的说法，能在中人离开前提出核验。"},{"title":"可选处置","body":"可验封、询价、叫见证人认货或放弃交易。货物去向暂不明确时，可记录最后见闻。"},{"title":"后果与延续","body":"改装、已取用或误认须各自更新持有与数量，不能凭相似外观把新货记成原货。"}],"links":["wuchang","fengjian-biaoji","paoshang-qianpiao"]},
  {"key":"huizhen-jiesuan","k":"evcontract","kind":"际遇","name":"归镇了镖","summary":"交割、分酬、补货与养伤分别落到正确的人和物资上。","sections":[{"title":"触发与可见线索","body":"镖队带着原货单、实际到达的货与人员找收货人。"},{"title":"可选处置","body":"到货签收后核对镖银和分配。若夹带其他货物，就办新的交割。医者再按现有余钱与伤员状况安排歇脚。"},{"title":"后果与延续","body":"本趟有且只有一次交付结论。若药货不足或失镖，另看赔付、追索与是否须补货。"}],"links":["chengkou-yaobiao","huiwan-yaopu","housheng-care"]},
  {"key":"mairu-xusu","k":"events","kind":"际遇","name":"隔擂再相逢","summary":"昔日武人带着同一段比试过往来找领队。","sections":[{"title":"触发与可见线索","body":"以先前的擂会或止斗约定为起点，带来消息的人能说清上次见到双方的时间。"},{"title":"可选处置","body":"可约下一场、解除误会，或请对方示范一段已有武艺。对方可因伤势或职责拒绝。"},{"title":"后果与延续","body":"变化只在本局。若比试结果有争议，记录分别来自哪位见证人。"}],"links":["lishang-duizhu","ring-yuedou","huijin-shouye"]},
  {"key":"fengtou-xiuqi","k":"evother","kind":"际遇","name":"风口稍歇","summary":"行走过险路后，队伍可选择进城续差还是就地略作补给。","sections":[{"title":"触发与可见线索","body":"一次差事途中折返或交付后，队伍仍有疲乏、旧伤或装备耗损。"},{"title":"可选处置","body":"可以先分行粮、补甲，再和伤员确认可担任的职责。也可留下部分人歇息，由其他人送信。"},{"title":"后果与延续","body":"耗用实际物资与时间。下一趟是否能出勤从人员和行囊记录读取。"}],"links":["hunliang-bag","bu-jia","huizhen-jiesuan"]},
  {"key":"cizhi-yaoyue","k":"evbg","kind":"际遇","name":"师门一封催书","summary":"同门有事相请时，把当前差事与旧约一起谈清。","sections":[{"title":"触发与可见线索","body":"在场有仍与师门往来的弟子。书信来路可验，写明求助之人、时限与所在。"},{"title":"可选处置","body":"可暂缓接差、分人传话或与师门商议改期。若有人实际离队，要预先把其位置和持有物更新。"},{"title":"后果与延续","body":"师门回信可能迟到。同伴去留按约定延续，未作决定时先保留当前人的状态。"}],"links":["canmen-xuetu","canjian","guanmen-baili"]},
  {"key":"miuyan-fengxian","k":"fightuse","kind":"招式","name":"掷烟断线","summary":"在选定格旁落烟，暂缓沿原射界的双方远射。","sections":[{"title":"怎么学","body":"可跟有用具经验的镖师学落格与撤离配合。\n\n一次实做中用烟实际遮掉一条来袭射线，让后排从事先约的格退出，并核己方望不到谁。"},{"title":"什么时候能用","body":"行囊有可取用的烟幕器具，落点处于可用范围。"},{"title":"怎么结算","body":"烟覆盖选中格附近一小片区域，相关远射按能见度重新选择目标。"},{"title":"怎么衔接","body":"预定撤路后再落烟。友方远手可停弩报位，近战从已实际认过的边线通行。"},{"title":"怎么拆解","body":"等烟散、在烟外换另一条线，或让先进入者堵住近侧出口。"},{"title":"代价与错用","body":"会用去一件用具和一次行动。烟也遮住己方观察，对手可绕到烟外等候。\n\n投错会遮住己方视野和预瞄，烟罐照扣。烟里的路径尚须重新核，撤不出来时需原地找护持。"}],"links":["wuyan","cangyan","cheluzhen","tingnu-baowei"]},
  {"key":"tieding-zulu","k":"fightuse","kind":"招式","name":"撒蒺断步","summary":"用可见的地面用具让一条近路暂时难走。","sections":[{"title":"怎么学","body":"候选由奇门行家或工坊短课教授。\n\n教者先标一条两边都能走的路，实战用一次布置守住将要进入的格，并确认后来的人确知哪儿不能直走。"},{"title":"什么时候能用","body":"有铁蒺藜袋，预定落格可见并可抵达。"},{"title":"怎么结算","body":"踏入标出的格位可能中断当次移动，路线预览先显示阻碍。"},{"title":"怎么衔接","body":"先把本队备用通路说清。投放后观察真实占格与选择，必要时以枪守另一侧。"},{"title":"怎么拆解","body":"可清理、选择另一条路线，或从外线压制守着用具的人。"},{"title":"代价与错用","body":"使用耗物资，己方也须绕开。对手可停下清理、换路或以远射逼退守点者。\n\n堵到同伴还没走完的通路时，放置照扣物资，己方也不能照原来的路径经过。另查可用绕路和是否能取回。"}],"links":["jili-bag","qimen-jinglu","guqiang-zhen"]},
  {"key":"qingshan-wangdai","k":"accessory","kind":"器物","name":"刻格路牌","summary":"把一次勘路结果固定在同一块随队牌上。","sections":[{"title":"用法或来历","body":"标记走到的关口、最近一次测看的时间以及货车能否经过。"},{"title":"限制与取舍","body":"已标记的路仍可能被封。只有再查或有可靠目击者时才更新。"},{"title":"取得与流转","body":"从查路绘图人处取得，可随途保持一份。是否占佩饰位待议。"}],"links":["tujing-kantu","duangukou","yaoqian-xiaoxi"]},
  {"key":"cangyan","k":"fightuse","kind":"用具","name":"行镖烟罐","summary":"用于标示和临时遮断射界的战斗用具候选。","sections":[{"title":"使用方式","body":"配合掷烟断线，在两个遮挡物之间暂时遮住一个区域。"},{"title":"消耗与限制","body":"一件用具只能在本次投放中结算一次。烟遮住双方，撤离路线须在落烟前确认。"},{"title":"补给与待定","body":"镖局库房或百工坊可补。覆盖、时效和风对烟的影响待议。"}],"links":["miuyan-fengxian","wuyan","cheluzhen"]},
  {"key":"jili-bag","k":"fightuse","kind":"用具","name":"随身蒺藜袋","summary":"用于给一个可见格位加上可清理的通行阻碍。","sections":[{"title":"使用方式","body":"随身位备一份，可借撒蒺断步布置在敌我都能看到的格位。"},{"title":"消耗与限制","body":"消耗一道材料，友军经过也可能受阻。清理就是一项独立动作。"},{"title":"补给与待定","body":"可从工坊补给。是否回收、同格多种效果及持续时间待定。"}],"links":["tieding-zulu","qimen-jinglu","guqiang-zhen"]},
  {"key":"linzhen-kit","k":"medical","kind":"用具","name":"行医急用包","summary":"把可在交手中取到的急救物资放在随身位。","sections":[{"title":"使用方式","body":"急用包供临阵照护或递药接应取用。战后休养的储备单独计算。"},{"title":"消耗与限制","body":"物资转交或使用后更新持有人和数量，随行救护活动仍需可达的格位。"},{"title":"补给与待定","body":"可在回湾药铺补给，携带量、费用与岗位条件待议。"}],"links":["housheng-care","qiangjiu-dingxin","yaoqian-huanshou"]},

    const found=matchingTopics(query);
    const reviewCount=found.filter(a=>a.placement).length;
    cnt.textContent=(state.g?groupOf(state.g).new:'全部章节')+' · '+reviewCount+' 项旧稿对照 · '+(found.length-reviewCount)+' 项已有条目';
    output='<p class="info">各项按最新设计取舍整理。可从卡片查看关联的原版系统。 <a href="https://app.notion.com/p/41b5946e369881da87e3de593f59efe6" target="_blank" rel="noopener">设计总纲与修订记录 ↗</a></p>'+
      (found.length?topicGroups(found,query):emptyState(0));
  }
  if(query && state.v!=='additions') {
    const matches=matchingTopics(query);
    if(matches.length) ctx.insertAdjacentHTML('beforeend','<button class="scope-clear" data-other-topics>在设计议题中查看 '+matches.length+' 项</button>');
  }
  if(query && state.v!=='articles') {
    const matches=matchingArticles(query,'','');
    if(matches.length)ctx.insertAdjacentHTML('beforeend','<button class="scope-clear" data-other-articles>在武侠词条中查看 '+matches.length+' 篇</button>');
  }
  area.innerHTML=output;
}
function openDialog(title,rows,href,extra='') {
  const box=element('detail');element('detail-title').textContent=title;
  element('detail-body').innerHTML='<dl>'+rows.map(([a,b])=>'<dt>'+html(a)+'</dt><dd>'+b+'</dd>').join('')+'</dl>'+extra;
  element('detail-source').href=href;
  if(!box.open)box.showModal();
  else element('detail-title').focus({preventScroll:true});
  box.scrollTop=0;
}
function detailArticle(heading,body) {
  return '<section class="detail-article"><h3>'+html(heading)+'</h3>'+paragraphs(body)+'</section>';
}
function systemDetailButtons(keys) {
  return keys.map(key=>'<button data-system-detail="'+key+'">'+html(systems.get(key).new)+'</button>').join('');
}
function attributeOverview() {
  const count=book.attributeGroups.reduce((total,group)=>total+group.keys.length,0);
  return '<section class="detail-article attribute-overview"><h3>'+zhNum(count)+' 项属性速查</h3>'+
    book.attributeGroups.map(group=>'<div class="cross"><strong>'+html(group.name)+'</strong>'+
      systemDetailButtons(group.keys)+'</div>').join('')+'</section>';
}
function groupedOverview(kind,title,className) {
  const paths=book.articles.filter(a=>a.kind===kind);
  const categories=[...new Set(paths.map(a=>a.category))];
  return '<section class="detail-article '+className+'"><h3>'+zhNum(paths.length)+' 项'+html(title)+'</h3>'+
    categories.map(category=>'<div class="cross"><strong>'+html(category)+'</strong>'+
      articleButtons(paths.filter(a=>a.category===category).map(a=>a.key))+'</div>').join('')+'</section>';
}
function talentOverview() {
  return groupedOverview('资质','习武资质','talent-overview');
}
function specialtyOverview(kind) {
  return groupedOverview(kind,kind,'specialty-overview');
}
function innerPracticeLinks() {
  return '<div class="cross"><button data-article-kind="内功">浏览内功</button>'+
    '<button data-article-kind="身法">浏览身法</button>'+
    articleButtons(['yanqian-xifa','shoufeng-menfa','duangu-danfa'])+'</div>';
}
function skillIndexLinks() {
  return '<div class="cross"><button data-article-kind="招式">可学招式</button>'+
    '<button data-article-kind="内功">侠客内功</button><button data-article-kind="身法">侠客身法</button>'+
    '<button data-article-kind="行旅技">行旅技</button><button data-article-kind="敌方招式">敌手招法</button></div>';
}
function systemArticle(s) {
  if(s.key==='attributes')return attributeOverview()+detailArticle('武侠正文',s.body);
  if(s.key==='talents')return talentOverview()+'<div class="cross">'+articleButtons(['xiwu-shezhi'])+'</div>'+detailArticle('武侠正文',s.body);
  if(s.key==='skills')return '<div class="cross">'+articleButtons(['zhaoshi-jiaoshou','neigong-shenfa','zhaoshi-liancheng','chai-zhaojue'])+'</div>'+
    skillIndexLinks()+detailArticle('武侠正文',s.body);
  if(s.key==='racialskills')
    return '<div class="cross"><button data-article-kind="敌方招式">浏览敌方专属招法</button>'+
      articleButtons(['qimen-shiqiang','heifeng-luosuo','chai-zhaojue'])+'</div>'+detailArticle('武侠正文',s.body);
  if(s.key==='perks'||s.key==='mastery')
    return specialtyOverview(s.new)+'<div class="cross">'+articleButtons(['zhuanchang-zhuanjing'])+'</div>'+detailArticle('武侠正文',s.body);
  if(s.key==='levels'||s.key==='combatxp')
    return '<div class="cross">'+articleButtons(['lilian-xiuwei','lilian-huqiao'])+'</div>'+detailArticle('武侠正文',s.body);
  if(s.key==='zoc'||s.key==='height')
    return '<div class="cross">'+articleButtons(['neigong-shenfa','luobu-jiezhao'])+'</div>'+detailArticle('武侠正文',s.body);
  if(!s.attribute)return detailArticle(s.g===9?'查阅说明':'武侠正文',s.body);
  return (s.key==='fatigue'?'<div class="cross">'+articleButtons(['neigong-shenfa','yunqi-tiaoxi'])+'</div>':'')+
    '<div class="cross">'+tag('候选')+'<span>规则与交手示例</span></div>'+
    s.attribute.sections.map(section=>detailArticle(section.title,section.body)).join('')+
    '<div class="cross">相关属性与系统 '+systemDetailButtons(s.attribute.related)+'</div>'+
    '<div class="cross"><button data-system-detail="attributes">回到属性速查</button></div>';
}
function showSystem(s) {
  const ns=newLinks(s.key);
  const notes=ns.length?'<div class="cross">设计议题 '+ns.map(a=>'<button data-go-addition="'+a.key+'">'+html(a.name)+'</button>').join('')+'</div>':'';
  const count=articleRefs.get(s.key).size;
  const related=count?'<div class="cross"><button data-article-system="'+s.key+'">查看 '+zhNum(count)+' 篇武侠词条</button></div>':'';
  const link=profileIndexLink(s.key);
  const extra=(link?'<div class="cross">'+link+'</div>':'')+notes+related;
  const rows=[['原版入口',html(s.old)],['对应方式',tag(s.rel)],['所属章节',html(groupOf(s.g).new)]];
  if(s.key==='fatigue')rows.push(['已选方向','内力接替原版疲劳']);
  openDialog(s.new,rows,s.ref,systemArticle(s)+extra);
}
function profileDetail(e) {
  const p=e.profile;
  const catalog=profileCatalogs.get(e.k);
  const events=(p.events||[]).map(id=>'<button data-entry="'+id+'">'+html(entries.get(id).n)+'</button>').join('');
  const related=p.articles.map(key=>'<button data-article="'+key+'">'+html(articles.get(key).name)+'</button>').join('');
  return '<section class="detail-article"><h3>'+catalog.name+'档案 '+tag('候选')+'</h3>'+
    '<dl><dt>'+catalog.name+'类别</dt><dd>'+html(p.category)+'</dd><dt>'+catalog.roleLabel+'</dt><dd>'+html(p.role)+'</dd>'+
    Object.entries(catalog.fields).map(([key,title])=>'<dt>'+html(title)+'</dt><dd>'+html(p[key])+'</dd>').join('')+'</dl>'+
    (events?'<div class="cross">关联际遇 '+events+'</div>':'')+
    '<div class="cross">相关武侠词条 '+related+'</div></section>';
}
function showEntry(e) {
  const s=systems.get(e.k);const keys=[e.k,...(e.also||[])];
  const rows=[['原版词条',html(e.zh||e.en)],['原版编号',String(e.id)],
    ['所属系统','<button class="linkbtn" data-system-detail="'+s.key+'">'+html(s.new)+'</button>']];
  if(e.zh && e.zh!==e.en) rows.splice(1,0,['英文原名','<span lang="en">'+html(e.en)+'</span>']);
  if(keys.length>1) rows.push(['相关系统','<div class="cross">'+systemsButtons(keys.slice(1))+'</div>']);
  if(e.sourceRole) rows.push(['原版归属',html(e.sourceRole)]);
  if(e.candidate) rows.push(['对照拟名',tag('候选')]);
  const body=(e.body?detailArticle('对照短释',e.body):'')+(e.profile?profileDetail(e):'');
  openDialog(e.n||e.zh||e.en,rows,'https://bbmod.com'+e.u,body);
}
function goSystem(k) {
  const s=systems.get(k);if(!s)return;
  if(element('detail').open)element('detail').close();
  for(const a of parentChain(k).slice(1))expanded.add(a);
  change({v:'systems',g:s.g,k:'',q:'',r:'',t:'',a:''});
  const row=element('sys-'+k);if(row){row.scrollIntoView({block:'center',behavior:'instant'});row.querySelector('[data-system-detail]').focus({preventScroll:true});}
}
function goArticle(key) {
  const a=articles.get(key);if(!a)return;
  if(element('detail').open)element('detail').close();
  change(state.v==='articles'?{a:key,p:state.p}:{v:'articles',a:key,g:systems.get(a.k).g,k:'',q:'',r:'',t:''});
  element('article-title').focus();
}
document.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b||b.disabled)return;
  const d=b.dataset;
  if(d.view) {change({v:d.view,k:'',r:'',t:'',a:''});return;}
  if('group' in d) {change({g:Number(d.group),k:'',a:''});moveTop();return;}
  if(d.article){goArticle(d.article);return;}
  if(d.growthAction) {
    const action=growthActions.get(d.growthAction);
    if(action)updateGrowthTrial(action);
    return;
  }
  if('growthReset' in d){updateGrowthTrial();return;}
  if(d.exchangeChoice){updateExchangeTrial(d.exchangeChoice);return;}
  if('exchangeReset' in d){updateExchangeTrial();return;}
  if(d.articleKind) {
    if(element('detail').open)element('detail').close();
    change({v:'articles',g:0,k:'',q:'',r:'',t:d.articleKind,a:''});
    moveTop();return;
  }
  if('articleBack' in d){change({a:'',p:state.p});moveTop();return;}
  if(d.articleSystem){
    if(element('detail').open)element('detail').close();
    change({v:'articles',g:systems.get(d.articleSystem).g,k:d.articleSystem,q:'',r:'',t:'',a:''});
    moveTop();return;
  }
  if('toggle' in d) {
    if(expanded.has(d.toggle))expanded.delete(d.toggle);else expanded.add(d.toggle);
    render();
    const next=element('results').querySelector('[data-toggle="'+d.toggle+'"]');
    if(next)next.focus({preventScroll:true});return;
  }
  if('expandAll' in d) {for(const s of book.systems.filter(s=>!state.g||s.g===state.g)) {if(d.expandAll==='1')expanded.add(s.key);else expanded.delete(s.key);}render();return;}
  if(d.index) {
    if(element('detail').open)element('detail').close();
    change({v:'entries',g:systems.get(d.index).g,k:d.index,q:'',r:'',t:'',a:'',c:''});
    moveTop();return;
  }
  if('page' in d){change({p:Number(d.page)});moveTop();return;}
  if(d.entry){showEntry(entries.get(Number(d.entry)));return;}
  if(d.systemDetail){showSystem(systems.get(d.systemDetail));return;}
  if(d.goSystem){goSystem(d.goSystem);return;}
  if(d.goAddition){
    if(element('detail').open) element('detail').close();
    change({v:'additions',g:0,k:'',q:'',r:'',t:'',a:''});
    const card=element('addition-'+d.goAddition);
    if(card) {
      card.closest('details').open=true;
      card.querySelector('.topic-body').open=true;
      card.scrollIntoView({block:'center',behavior:'instant'});
      card.focus({preventScroll:true});
    }
    return;
  }
  if('unlimit' in d){change({k:'',g:0});return;}
  if('otherEntries' in d){change({v:'entries',k:'',r:''});return;}
  if('otherTopics' in d){change({v:'additions',k:'',r:'',t:'',a:''});return;}
  if('otherArticles' in d){change({v:'articles',k:'',r:'',t:'',a:''});return;}
  if('reset' in d){change(state.v==='entries'&&profileCatalogs.has(state.k)?{q:'',c:''}:{q:'',k:'',r:'',g:0,t:'',a:'',c:''});}
});
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();element('main').focus();});
element('query').addEventListener('input',e=>change({q:e.target.value,a:''},true));
element('relation').addEventListener('change',e=>change({r:e.target.value}));
element('mobile-group').addEventListener('change',e=>change({g:Number(e.target.value),k:'',a:''}));
element('article-kind').addEventListener('change',e=>change({t:e.target.value,a:''}));
element('profile-category').addEventListener('change',e=>change({c:e.target.value}));
element('detail').addEventListener('click',e=>{if(e.target===element('detail')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)e.target.close();}});
window.addEventListener('popstate',()=>{if(element('detail').open)element('detail').close();state=readUrl();render();});
drawOptions();state=readUrl();render();


</script>
</body></html>
